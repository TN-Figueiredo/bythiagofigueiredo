<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caminho do teste do YouTube (mockup M2 r1)</title>
<style>
/* Mockup M2 r1 (21/10/2026). Parte do cartão S7 r3 aprovado: mesmos tokens, selos, faixas e escala 4/8/12/16/24/32.
   Novo só: --vc (versão C, Naksu r2) e --err (texto de erro com ⚠). Só hex/rgba literais; nenhum color-mix(). Texto >= 12 px. Dados SINTÉTICOS. */
*,*::before,*::after{box-sizing:border-box}
:root{--pg:#100E0C;--pgt:#F5EFE6;--pgm:#A89D88;--pgb:#332D25;--pgs:#221E1A}
html{background:var(--pg)}
body{margin:0;font:400 14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--pgt);background:var(--pg)}
.ctl{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:10px 16px;background:var(--pgs);border-bottom:1px solid var(--pgb)}
.grp{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--pgm);flex-wrap:wrap;min-width:0;max-width:100%}
#selE{width:min(420px,calc(100vw - 90px))}
.grp select{min-width:0;font:inherit;font-size:13px;min-height:34px;max-width:min(420px,100%);padding:0 8px;border:1px solid #40382D;border-radius:6px;background:#16130F;color:var(--pgt)}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid #40382D;border-radius:6px;overflow:hidden}
.seg button{font:inherit;font-size:13px;min-height:34px;padding:0 12px;border:0;background:transparent;color:var(--pgm);cursor:pointer}
.seg button[aria-pressed="true"]{background:#F5EFE6;color:#100E0C;font-weight:600}
.ctl :focus-visible{outline:2px solid #FF8240;outline-offset:2px}
.wrap{max-width:1520px;margin:0 auto;padding:16px 16px 80px}
.expl{max-width:96ch;color:var(--pgm);font-size:13px;margin:0 0 16px}
.expl b{color:var(--pgt);font-weight:600}
.stage{overflow-x:auto;max-width:100%}
@media (max-width:440px){.wrap{padding:12px 0 80px}.expl{padding:0 16px}.frame.w390{border-radius:0;border-left:0;border-right:0}}

.frame{
  --bg:#1A1714;--surface:#221E1A;--surface-2:#272219;--sunk:#16130F;
  --border:#332D25;--border-subtle:#2A251F;--border-strong:#40382D;--btn-line:#7D7260;
  --text:#F5EFE6;--muted:#A89D88;--dim:#958A75;--faint:#5C5345;
  --accent:#FF8240;--on-accent:#1A120A;--nm:#E59CC0;--nm-line:#B0678F;--nm-bg:#3A2232;--nm-fio:rgba(229,156,192,.14);
  --warn:#F5B13D;--warn-bg:rgba(245,158,11,.10);--warn-line:#C98A1B;
  --ok:#6FCF97;--ok-bg:rgba(111,207,151,.10);--ok-line:#3E8F63;
  --yt:#9FB4C9;--yt-bg:rgba(159,180,201,.08);--yt-line:#6B8199;--yt-solid:rgba(159,180,201,.16);
  --err:#F4A097;--err-line:#B85A50;
  --va:#FF8240;--vb:#6FA8DC;--vc:#B79CF2;
  --skel:#2E2822;
  background:var(--bg);color:var(--text);color-scheme:dark;container-type:inline-size;border:1px solid var(--border);border-radius:10px;padding:24px;font-size:14px;position:relative}
.frame[data-theme="light"]{
  --bg:#F7F2E9;--surface:#FBF7F0;--surface-2:#F2EBDF;--sunk:#F2EBDF;
  --border:#DDD2BF;--border-subtle:#E7DECF;--border-strong:#C9BBA3;--btn-line:#8A7C62;
  --text:#231C14;--muted:#5E5240;--dim:#6E624E;--faint:#A69A84;
  --accent:#B8481A;--on-accent:#FFF8F1;--nm:#8E2A62;--nm-line:#A85585;--nm-bg:#F7E1EC;--nm-fio:rgba(142,42,98,.10);
  --warn:#7A4F00;--warn-bg:rgba(138,90,0,.09);--warn-line:#8A5A00;
  --ok:#1E6B43;--ok-bg:rgba(30,107,67,.09);--ok-line:#3E8F63;
  --yt:#34506B;--yt-bg:rgba(52,80,107,.07);--yt-line:#6B8199;--yt-solid:rgba(52,80,107,.09);
  --err:#9E2A1E;--err-line:#B85A50;
  --va:#B8481A;--vb:#2B6DA8;--vc:#6B4BB8;
  --skel:#E7DECF;color-scheme:light}
.frame.w1440{width:1440px}.frame.w390{width:390px;padding:16px 12px}
.frame :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
:where(.frame) :is(h1,h2,h3,h4,p,ol,ul){margin:0}
.num{font-variant-numeric:tabular-nums}
.meta{font-size:12.5px;color:var(--muted)}
.nm{display:inline-block;padding:1px 7px;border:1px solid var(--nm-line);border-radius:4px;color:var(--nm);font:400 12px/16px Inter,system-ui,sans-serif;background:repeating-linear-gradient(135deg,var(--nm-bg) 0 6px,var(--nm-fio) 6px 8px);white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:36px;padding:0 12px;border:1px solid var(--btn-line);border-radius:6px;background:var(--surface-2);color:var(--text);font:500 13px/18px Inter,system-ui,sans-serif;cursor:pointer;text-align:center}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.ghost{background:transparent}
.btn[disabled]{color:var(--muted);border-style:dashed;cursor:not-allowed;background:transparent}
.lnk{font:inherit;font-size:13.5px;color:var(--yt);background:none;border:0;padding:0 2px;min-height:24px;text-decoration:underline;cursor:pointer;text-align:left}
@container (max-width:640px){.btn{min-height:44px}.lnk{min-height:44px}}

/* página */
.pg-crumb{font-size:12.5px;color:var(--muted)}
.pg-h{font:600 24px/1.25 Georgia,serif;margin-top:4px}
.sum{margin:16px 0 0;font:600 21px/1.35 Georgia,serif;max-width:72ch;text-wrap:balance}
.sum small{display:block;font:400 13px/1.45 Inter,system-ui,sans-serif;color:var(--muted);margin-top:4px}
@container (max-width:640px){.pg-h{font-size:20px}.sum{font-size:18px}}
.col{max-width:1040px}
.list{max-width:1120px}

/* miniaturas sintéticas */
.th{display:grid;place-items:center;border-radius:5px;color:rgba(255,255,255,.92);font:600 16px/1 Georgia,serif;flex:none;aspect-ratio:16/9;width:96px}
.tA{background:linear-gradient(135deg,#C2562E,#E8A15A 60%,#F3D19A)}
.tB{background:linear-gradient(135deg,#1F4E79,#3B8EC4 60%,#9BD0EE)}
.tC{background:linear-gradient(135deg,#3E2A78,#7A5BC9 60%,#C9B6F2)}
.tD{background:linear-gradient(135deg,#5A3B1E,#A7743F 60%,#E3C08E)}
.tE{background:linear-gradient(135deg,#24423A,#4E8C78 60%,#A9D8C4)}
.tF{background:linear-gradient(135deg,#4A2430,#9C4A5E 60%,#E3A7B5)}
.th.short{aspect-ratio:9/16;width:51px}
.th.fail{background:repeating-linear-gradient(135deg,var(--surface-2) 0 8px,var(--sunk) 8px 12px);border:1px dashed var(--err-line);color:var(--err);font:500 12px/1.3 Inter,system-ui,sans-serif;text-align:center;padding:6px}

/* selos: forma + símbolo + palavra, nunca só cor (S7 r3) */
.selo{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:999px;font:600 12px/18px Inter,system-ui,sans-serif;border:1px solid var(--border-strong);white-space:nowrap;color:var(--text)}
.selo svg{flex:none}
.selo.lab{border-color:var(--accent);color:var(--accent)}
.selo.yt{border:1px dashed var(--yt-line);color:var(--yt);background:var(--yt-bg)}
.selo.yts{border:1px solid var(--yt-line);color:var(--yt);background:var(--yt-solid)}
.selo.warn{border-color:var(--warn-line);color:var(--warn);background:var(--warn-bg)}
.selo.ok{border-color:var(--ok-line);color:var(--ok);background:var(--ok-bg)}
.selo.unk{border:1px solid var(--nm-line);color:var(--nm);background:repeating-linear-gradient(135deg,var(--nm-bg) 0 6px,var(--nm-fio) 6px 8px)}
.selo.dim{border-color:var(--border-strong);color:var(--dim)}
.selo.mute{border-color:var(--border-strong);color:var(--muted);font-weight:500}

/* faixas (S7 r3) */
.band{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:8px;border:1px solid var(--border);background:var(--surface)}
.band .ic{flex:none;margin-top:2px}
.band h3{font:600 14.5px/1.35 Inter,system-ui,sans-serif}
.band p{font-size:13.5px;color:var(--muted);margin-top:2px;max-width:78ch}
.band .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.band.warn{border-color:var(--warn-line);background:var(--warn-bg);border-left-width:4px}
.band.warn .ic{color:var(--warn)}
.band.yt{border:1px dashed var(--yt-line);background:var(--yt-bg)}
.band.yt .ic{color:var(--yt)}
.band.ok{border-color:var(--ok-line);background:var(--ok-bg);border-left-width:4px}
.band.ok .ic{color:var(--ok)}
.band.lab{border-color:var(--accent);border-left-width:4px}
.band.lab .ic{color:var(--accent)}
.band.err{border-color:var(--err-line);border-left-width:4px}
.band.err .ic,.band.err h3{color:var(--err)}
.band>div{min-width:0;flex:1}
.ask{margin-top:12px;padding:12px;border:1px solid var(--warn-line);border-radius:8px;background:var(--warn-bg)}
.ask p{color:var(--text);font-size:13.5px}
.ask .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.errl{display:flex;gap:8px;align-items:flex-start;margin-top:12px;font-size:13.5px;color:var(--err)}
.errl svg{flex:none;margin-top:3px}
.errl span{color:var(--text)}
.errl b{color:var(--err)}

/* lista de vídeos */
.list{margin-top:24px;border:1px solid var(--border);border-radius:10px;background:var(--surface);overflow:hidden}
.lhd{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);font-size:12.5px;color:var(--muted)}
.vrow{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:16px;align-items:start;padding:16px;border-bottom:1px solid var(--border-subtle)}
.vrow:last-child{border-bottom:0}
.vrow .th.short{justify-self:center}
.vrow h4{font:600 14.5px/1.35 Inter,system-ui,sans-serif;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vrow .st{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.vrow .fr{font-size:13.5px;color:var(--muted);margin-top:4px;max-width:70ch}
.vrow .fr2{display:flex;gap:6px;align-items:flex-start;font-size:13px;color:var(--muted);margin-top:4px}
.vrow .fr2 svg{flex:none;margin-top:3px;color:var(--warn)}
.vrow .ra{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:180px}
.vrow .ra .btn{min-width:160px}
.vrow.ctx{opacity:.62}
.vrow.hot{background:var(--surface-2)}
.vrow .full{grid-column:2 / 4}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;max-width:720px}
.two .opt2{border:1px solid var(--border);border-radius:8px;padding:12px;background:var(--surface)}
.two .opt2 p{font-size:13px;color:var(--muted);margin-top:8px}
.two .opt2 .btn{width:100%}
@container (max-width:640px){
 .vrow{grid-template-columns:72px minmax(0,1fr);gap:12px;padding:12px}
 .vrow .th{width:72px}.vrow .th.short{width:40px}
 .vrow .ra{grid-column:1 / 3;align-items:stretch;min-width:0}
 .vrow .ra .btn{width:100%;min-width:0}
 .vrow .full{grid-column:1 / 3}
 .two{grid-template-columns:1fr}
}
.skel{display:block;background:var(--skel);border-radius:4px}
@media (prefers-reduced-motion:no-preference){.skel{animation:pulse 1.6s ease-in-out infinite}}
@keyframes pulse{50%{opacity:.55}}

/* ficha: painel na própria página, no lugar da linha (até 880 px de conteúdo) */
.ficha{border:1px solid var(--border-strong);border-radius:10px;background:var(--bg);margin:0;padding:24px;border-left:4px solid var(--yt-line)}
.list .ficha{border-radius:0;border-left-width:4px;border-top:0;border-right:0;border-bottom:1px solid var(--border-subtle)}
.fin{max-width:880px}
.fbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.fhd{display:flex;gap:16px;align-items:center}
.fhd .th{width:128px}
.fhd h2{font:600 19px/1.3 Georgia,serif;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.fhd .ttl{flex:1;min-width:0}
.crumb{font-size:12.5px;color:var(--muted)}
.fst{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.save{display:flex;gap:6px;align-items:center;min-height:20px;font-size:12.5px;color:var(--muted)}
.save.off{color:var(--err)}
.save.off span{color:var(--text)}
.ficha .sum{margin-top:16px}
.ficha .band{margin-top:16px}
.blk{margin-top:24px;padding-top:24px;border-top:1px solid var(--border-subtle)}
.blk>h3{display:flex;align-items:center;gap:10px;font:600 15.5px/1.35 Inter,system-ui,sans-serif}
.blk>h3 .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1px solid var(--btn-line);font:600 12.5px/1 Inter,system-ui,sans-serif;color:var(--muted);flex:none}
.blk>.lede{font-size:13.5px;color:var(--muted);margin-top:4px;max-width:70ch}
.blk.hl{border:1px dashed var(--yt-line);background:var(--yt-bg);border-radius:8px;padding:16px;margin-top:24px}
.segc{display:inline-flex;border:1px solid var(--btn-line);border-radius:6px;overflow:hidden;margin-top:12px}
.segc button{font:500 13px/18px Inter,system-ui,sans-serif;min-height:36px;padding:0 14px;border:0;border-right:1px solid var(--btn-line);background:transparent;color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.segc button:last-child{border-right:0}
.segc button[aria-checked="true"]{background:var(--surface-2);box-shadow:inset 0 0 0 2px var(--text);font-weight:600}
.segc button[aria-checked="false"] svg{display:none}
.segc[aria-disabled="true"] button{cursor:not-allowed;color:var(--muted)}
.vers{display:grid;gap:12px;margin-top:16px}
.ver{border:1px solid var(--border);border-radius:8px;padding:12px;background:var(--surface)}
.ver.orig{background:transparent;border-style:solid}
.ver .vh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ver .vh b{font:600 13.5px/1.35 Inter,system-ui,sans-serif}
.vchip{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:5px;font:700 13px/1 Inter,system-ui,sans-serif;color:#fff;flex:none;border:1px solid rgba(255,255,255,.35)}
.vA{background:#B8481A}.vB{background:#2B6DA8}.vC{background:#6B4BB8}
.vbody{display:grid;grid-template-columns:160px minmax(0,1fr);gap:12px 16px;margin-top:12px;align-items:start}
.vbody.nothumb{grid-template-columns:minmax(0,1fr)}
.vbody .th{width:160px;font-size:20px}
.slot{display:grid;place-items:center;width:160px;aspect-ratio:16/9;border:1px dashed var(--btn-line);border-radius:5px;color:var(--muted);font:500 12.5px/1.35 Inter,system-ui,sans-serif;text-align:center;padding:8px;background:transparent;cursor:pointer}
.fld label{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted)}
.fld textarea{resize:none}
.fld input,.fld textarea{width:100%;margin-top:4px;min-height:40px;padding:8px 10px;border:1px solid var(--btn-line);border-radius:6px;background:var(--sunk);color:var(--text);font:400 14px/1.4 Inter,system-ui,sans-serif}
.fld :is(input,textarea)[readonly]{border-style:dashed;color:var(--muted)}
.fld .cnt{font-variant-numeric:tabular-nums}
.ro{font:600 15px/1.4 Georgia,serif}
.vacts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.addv{width:100%;min-height:44px;border:1px dashed var(--btn-line);border-radius:8px;background:transparent;color:var(--text);font:500 13px/18px Inter,system-ui,sans-serif;cursor:pointer}
.steps{margin:12px 0 0;padding-left:20px;font-size:13.5px;max-width:70ch}
.steps li{margin-top:6px}
.steps li::marker{color:var(--muted);font-variant-numeric:tabular-nums}
.bacts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.why{font-size:12.5px;color:var(--muted);margin-top:8px}
.q3{font:600 16px/1.35 Georgia,serif;margin-top:12px}
.alt{margin-top:16px;font-size:13.5px;color:var(--muted)}
.foot{position:sticky;bottom:0;z-index:2;margin:24px -12px -16px;padding:12px 12px calc(12px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--border-strong)}
.foot .btn{width:100%}
.foot p{font-size:12.5px;color:var(--muted);margin-top:6px;text-align:center}
.foot .sent{display:flex;gap:8px;align-items:center;justify-content:center;min-height:44px;font-size:13.5px}
@container (max-width:640px){
 .ficha{padding:0;border:0;background:transparent}
 .list .ficha{border:0}
 .fhd .th{display:none}
 .fhd h2{-webkit-line-clamp:2;font-size:17px}
 .vbody{grid-template-columns:minmax(0,1fr)}
 .vbody .th,.slot{width:100%}
 .vacts .btn,.bacts .btn{flex:1 1 140px}
 .segc{display:flex}.segc button{flex:1;justify-content:center;min-height:44px;padding:0 8px}
 .blk.hl{padding:12px}
 .ask .acts .btn,.band .acts .btn{flex:1 1 140px}
}

/* dia 14 */
.d14{max-width:880px;margin-top:12px;border:1px solid var(--yt-line);background:var(--yt-solid);border-radius:10px;padding:16px}
.d14 h3{font:600 17px/1.35 Georgia,serif}
.d14 .meta{margin-top:4px}
.vgrid{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:16px;margin-top:16px}
.vopt{display:flex;flex-direction:column;gap:8px;text-align:left;padding:12px;border:1px solid var(--btn-line);border-radius:8px;background:var(--surface);color:var(--text);cursor:pointer;font:inherit;min-height:44px}
.vopt .th{width:100%}
.vopt .top{display:flex;gap:8px;align-items:center}
.vopt q{quotes:none;font:600 13.5px/1.4 Inter,system-ui,sans-serif;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vopt .lbl{font:600 13.5px/1.3 Inter,system-ui,sans-serif;margin-top:auto;padding-top:4px;border-top:1px solid var(--border-subtle)}
.other{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:24px}
.other>span{font-size:13px;color:var(--muted);margin-right:4px}
.other .btn{min-width:120px}
@container (max-width:640px){
 .vgrid{grid-template-columns:1fr;gap:12px}
 .vopt{flex-direction:row;align-items:center}
 .vopt .th{width:96px}
 .vopt .tx{min-width:0;flex:1;display:flex;flex-direction:column;gap:6px}
 .vopt .lbl{border-top:0;padding-top:0}
 .other{flex-direction:column;align-items:stretch}.other .btn{width:100%}
}
.res2{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-top:12px}
.cf{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.cf .opt2{border:1px solid var(--border);border-radius:8px;padding:12px;background:var(--surface)}
.cf .who{font-size:12.5px;color:var(--muted)}
.cf .top{display:flex;gap:8px;align-items:center;margin-top:8px}
.cf q{quotes:none;font:600 14px/1.4 Georgia,serif}
@container (max-width:640px){.cf{grid-template-columns:1fr}}

/* S7 estado 1 (sem redesenho, mesmas classes do S7 r3) */
.card{border:1px dashed var(--yt-line);background:var(--yt-bg);border-radius:10px;padding:24px;margin-top:16px}
.card .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.card .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;align-items:center}
.card>.meta{margin-top:12px}
.pair2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.opt{border:1px solid var(--border);border-radius:8px;padding:12px;background:var(--surface)}
.opt .row{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.opt q{display:block;font:600 15px/1.4 Georgia,serif;quotes:none}
.opt .big{display:flex;gap:8px;align-items:baseline;justify-content:space-between;margin-top:8px;font-size:13px;color:var(--muted)}
.opt .big b{font:600 20px/1 Georgia,serif;color:var(--text)}
.far{margin-left:24px}

/* ---------- render ---------- */
const fr=document.getElementById('fr');
function render(key){
 const def=st[S.e]||st.lista;
 const d0=def();if(d0.pre){d0.pre()}
 const d=def();
 fr.innerHTML=d.h;fr.dataset.theme=S.tema;fr.className='frame w'+S.w;
 document.body.style.background=S.tema==='light'?'#E9E2D6':'';
 document.getElementById('expl').innerHTML='<b>'+(LABEL[S.e]||'')+'.</b> '+d.x;
 document.getElementById('selE').value=KEYS.includes(S.e)?S.e:'';
 [['sTema',S.tema],['sLarg',S.w],['sMot',S.mot]].forEach(p=>document.querySelectorAll('#'+p[0]+' button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===p[1])));
 document.getElementById('gMot').classList.toggle('hide',S.e!=='ficha-erro');
 try{history.replaceState(null,'','?estado='+S.e+'&tema='+S.tema+'&largura='+S.w)}catch(e){}
 if(key){const t=fr.querySelector('[data-k="'+key+'"]');if(t)t.focus()}
}
function go(e,key){if(!e.startsWith('ficha'))S.campos=null;S.e=e;S.ask=null;render(key)}
const sE=document.getElementById('selE');
E.forEach(g=>{const og=document.createElement('optgroup');og.label=g[0];g[1].forEach(x=>{const o=document.createElement('option');o.value=x[0];o.textContent=x[1];og.appendChild(o)});sE.appendChild(og)});
sE.addEventListener('change',()=>{S.campos=null;S.e=sE.value;S.ask=null;render()});
document.addEventListener('click',ev=>{
 const c=ev.target.closest('[data-campos]');if(c&&!c.disabled){S.campos=c.dataset.campos;if(S.e==='ficha-so-titulo'||S.e==='ficha-so-miniatura')S.e='ficha-duas';render();const t=fr.querySelector('[data-campos="'+S.campos+'"]');if(t)t.focus();return}
 const a=ev.target.closest('[data-ask]');if(a){S.ask=S.ask===a.dataset.ask?null:a.dataset.ask;render(a.dataset.k);return}
 const g=ev.target.closest('.frame [data-go]');if(g&&!g.disabled){go(g.dataset.go,g.dataset.k);return}
 const t=ev.target.closest('#sTema button');if(t){S.tema=t.dataset.v;render();return}
 const w=ev.target.closest('#sLarg button');if(w){S.w=w.dataset.v;render();return}
 const m=ev.target.closest('#sMot button');if(m){S.mot=m.dataset.v;render();return}
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&S.e.indexOf('ficha')===0){S.campos=null;S.e='lista';render('row-r66')}});
const q=new URLSearchParams(location.search);
if(q.get('estado')&&st[q.get('estado')])S.e=q.get('estado');
if(['dark','light'].includes(q.get('tema')))S.tema=q.get('tema');
if(['1440','390'].includes(q.get('largura')))S.w=q.get('largura');
if(q.get('motivo')&&MOT[q.get('motivo')])S.mot=q.get('motivo');
render();
</script></body></html>
