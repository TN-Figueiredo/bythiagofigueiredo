<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mudanças dos competidores</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="chrome.css">
<style>
/* Mudanças: só o que é desta tela. Tokens gerais,sidebar,cabeçalhos,nicho,abas,barra de estados,tema e toasts vêm de chrome.css/chrome.js.
   Abaixo,só os tokens que existem apenas nesta tela (diff,sparkline,selos). */
#screen{
  --success-text:#4ADE80; --success-bg:rgba(34,197,94,.12);
  --danger-text:#F26B6B; --danger-bg:rgba(239,68,68,.12);
  --warning-bg:rgba(245,158,11,.10); --warning-line:rgba(245,158,11,.32); --warning-text:#FBBF24;
  --info-text:#67E8F9; --info-bg:rgba(6,182,212,.10); --info-line:rgba(6,182,212,.30);
  --utm:#FBBF24; --ins-bg:rgba(34,197,94,.16); --del-color:#D49A8F;
  --spark-before:#8A7F6B; --spark-after:#F5EFE6; --band:rgba(168,157,136,.18);
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]) #screen{
    --success-text:#11692F; --success-bg:rgba(17,105,47,.09);
    --danger-text:#B42318; --danger-bg:rgba(180,35,24,.07);
    --warning-bg:rgba(180,83,9,.08); --warning-line:rgba(180,83,9,.30); --warning-text:#92400E;
    --info-text:#155E75; --info-bg:rgba(14,116,144,.08); --info-line:rgba(14,116,144,.28);
    --utm:#8A3F06; --ins-bg:rgba(17,105,47,.13); --del-color:#8E4A3E;
    --spark-before:#7A6E58; --spark-after:#231C14; --band:rgba(94,82,64,.13);
} }
:root[data-theme="light"] #screen{
    --success-text:#11692F; --success-bg:rgba(17,105,47,.09);
    --danger-text:#B42318; --danger-bg:rgba(180,35,24,.07);
    --warning-bg:rgba(180,83,9,.08); --warning-line:rgba(180,83,9,.30); --warning-text:#92400E;
    --info-text:#155E75; --info-bg:rgba(14,116,144,.08); --info-line:rgba(14,116,144,.28);
    --utm:#8A3F06; --ins-bg:rgba(17,105,47,.13); --del-color:#8E4A3E;
    --spark-before:#7A6E58; --spark-after:#231C14; --band:rgba(94,82,64,.13);
}
#screen .num{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;letter-spacing:0}
:where(#screen) a{color:inherit}
:where(#screen) button{font:inherit;color:inherit}
#screen{font-size:14px}
#screen :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
#screen svg.i{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#screen .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#screen .hidden{display:none !important}
/* texto pequeno sobre fundos tintos usa --muted (CONVENCOES R2) */
#screen .effect,#screen .forja,#screen .d-diff,#screen .badge{--dim:var(--muted)}

/* ---------- resumo ---------- */
#screen .sumbox{margin-top:0}
#screen .tot{display:block;margin-top:2px}
#screen .chip-cen{font-size:11.5px;color:var(--muted);border:1px solid var(--border-strong);border-radius:4px;padding:0 6px;line-height:18px}
#screen .d-peek{list-style:none;margin:10px 0 0;padding:0;font:400 12.5px/1.5 Inter,sans-serif;color:var(--muted)}
#screen .d-peek li{display:flex;gap:8px;min-width:0}
#screen .d-peek .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#screen .d-peek .g{flex:none;width:10px}
#screen .d-peek .a .g{color:var(--success-text)}
#screen .d-peek .r .g{color:var(--danger-text)}
#screen .d-peek .more{font-family:Inter,sans-serif;font-size:12px}
#screen .sumline{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;min-height:40px;padding:6px 14px;border:1px solid var(--border);border-radius:8px;background:var(--surface);font-size:12.5px;color:var(--muted)}
#screen .sumline::-webkit-details-marker{display:none}
#screen .sumline b{color:var(--text);font-weight:600}
#screen .sumline #sumLine{flex:1;min-width:0}
#screen .sumbox[open] #sumLine{display:none}
#screen .sumbox[open] > .sumline{min-height:32px;padding:2px 14px;justify-content:flex-end}
#screen .sumline .sumopen{white-space:nowrap;color:var(--text);text-decoration:underline;text-underline-offset:3px}
#screen .sumbox[open] > .sumline{border-radius:8px 8px 0 0;border-bottom:0}
#screen .sumbox .summary{margin-top:0;border-top-left-radius:0;border-top-right-radius:0}
#screen .summary{margin-top:16px;display:grid;grid-template-columns:minmax(0,.72fr) minmax(0,1.45fr) minmax(0,.9fr);border:1px solid var(--border);border-radius:8px;background:var(--surface);overflow:hidden}
#screen .summary > section{padding:12px 18px;min-width:0}
#screen .summary > section + section{border-left:1px solid var(--border-subtle)}
#screen .summary h2{font-size:13px;font-weight:600;margin:0}
#screen .summary .win{font-size:12px;color:var(--dim);margin:2px 0 10px}
#screen .lead{margin:0;font-size:14px;line-height:1.6;color:var(--muted);max-width:62ch}
#screen .lead strong{color:var(--text);font-weight:600}
#screen .lead.small{font-size:12.5px;color:var(--dim);margin-top:8px}
#screen table.led{width:100%;border-collapse:collapse;font-size:13px}
#screen table.led th{font-weight:500;text-align:left;color:var(--dim);font-size:12px;padding:0 10px 6px 0;border-bottom:1px solid var(--border-subtle)}
#screen table.led th.r,#screen table.led td.r{text-align:right}
#screen table.led th.rh{font-weight:400;padding:5px 10px 5px 0;vertical-align:baseline;color:var(--text);font-size:13px}
#screen table.led td{padding:5px 10px 5px 0;border-bottom:1px solid var(--border-subtle);vertical-align:baseline}
#screen table.led tr:last-child td,#screen table.led tr:last-child th.rh{border-bottom:0}
#screen table.led td.read{color:var(--dim);font-size:12px}
#screen table.led td.r{white-space:nowrap}

#screen .small-n{display:inline-flex;align-items:center;gap:5px;color:var(--warning-text);font-size:12px}
#screen .ledout{margin:8px 0 0;font-size:12px;color:var(--dim);line-height:1.5}
#screen .ledout b{color:var(--muted);font-weight:600}
#screen .method{margin:4px 0 0;font-size:12px;color:var(--dim);max-width:80ch}
#screen .method summary{cursor:pointer;min-height:32px;display:inline-flex;align-items:center;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
#screen .method p{margin:4px 0 0}

/* ---------- forja ---------- */
#screen .forja{border-left:1px solid var(--border-subtle);background:var(--forja-subtle);padding:16px 18px;display:flex;flex-direction:column;gap:8px;min-width:0}
#screen .fj-niche{border-top:1px solid var(--forja-line);padding-top:6px}
#screen .fj-niche > summary{cursor:pointer;list-style:none;font-size:12.5px;color:var(--text);min-height:32px;display:flex;align-items:center;gap:8px}
#screen .fj-niche > summary > span:nth-child(2){flex:1;min-width:0}
#screen .fj-niche > summary::-webkit-details-marker{display:none}
#screen .fj-niche .since-l{display:block;color:var(--muted)}
#screen .fj-niche > summary .open{margin-left:auto;color:var(--forja);text-decoration:underline;text-underline-offset:3px;white-space:nowrap}

#screen .forja-h{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;font-size:13px}
#screen .forja-h b{font-weight:600}
#screen .stamp{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--forja);border:1px solid var(--forja-line);border-radius:4px;padding:1px 7px;background:var(--surface)}
#screen .stamp svg{width:13px;height:13px}
#screen .state{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:1px 8px;border-radius:10px;border:1px solid var(--border-strong);color:var(--muted);background:var(--surface)}
#screen .state.bad{color:var(--danger-text);border-color:var(--danger-text)}
#screen .state.warn{color:var(--warning-text);border-color:var(--warning-line)}
#screen .state.ok{color:var(--forja);border-color:var(--forja-line)}
#screen .forja-status{font-size:12.5px;color:var(--text);margin:0}
#screen .forja-read{margin:4px 0 6px}
#screen .fj-lines{margin:2px 0 4px;padding-left:18px}
#screen .fj-lines li{margin:1px 0}
#screen .forja-read .rh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:6px}
#screen .forja-voice{font:400 14px/1.55 Fraunces,serif;color:var(--text);max-width:80ch;margin:0}
#screen .forja-voice ul{margin:6px 0 0;padding-left:18px}
#screen .forja-voice li{margin:2px 0}
#screen .lnk{display:inline;font:500 12.5px/1.2 Inter,sans-serif;padding:9px 4px;background:none;border:0;color:var(--forja);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
#screen .forja-note{font-size:12px;color:var(--muted);margin:0}
#screen .btn{display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:0 14px;border-radius:6px;border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
#screen .btn:hover{background:var(--surface-2)}

/* alerta */

/* ---------- filtros ---------- */
#screen .filters{margin-top:12px;padding-bottom:8px;border-bottom:1px solid var(--border-subtle);display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end}
#screen .field{display:flex;flex-direction:column;gap:4px}
#screen .field > .lbl{font-size:11.5px;color:var(--dim)}
#screen .seg{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;background:var(--surface)}
#screen .seg button{border:0;background:transparent;height:32px;padding:0 10px;font-size:12.5px;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
#screen .seg button + button{border-left:1px solid var(--border-subtle)}
#screen .seg button:hover{color:var(--text)}
#screen .seg button:disabled{cursor:not-allowed;color:var(--muted);background:var(--surface-2)}
#screen .seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--text);box-shadow:inset 0 -2px 0 var(--text)}
#screen .seg .c{font-size:11px;color:var(--muted)}
#screen .sel{height:32px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);padding:0 8px;font-size:12.5px;max-width:190px}
#screen .check{display:inline-flex;align-items:center;gap:7px;min-height:32px;padding:0 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);font-size:12.5px;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap}
#screen .check input{accent-color:var(--text);width:15px;height:15px;margin:0}
#screen .search{position:relative;flex:1 1 130px;max-width:280px;min-width:130px}
#screen .search svg{position:absolute;left:10px;top:9px;color:var(--dim)}
#screen .search input{width:100%;height:32px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);padding:0 10px 0 32px;font-size:12.5px}
#screen .search input::placeholder{color:var(--dim)}
#screen .fchip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 0 0 10px;border:1px solid var(--border-strong);border-radius:6px;background:var(--surface);color:var(--text);font-size:12.5px}

#screen .fchip button{width:32px;height:32px;border:0;background:none;cursor:pointer;color:var(--muted);border-radius:4px;display:grid;place-items:center}
#screen .more{position:relative}
#screen .more summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);font-size:12.5px;color:var(--muted);white-space:nowrap}
#screen .more summary::-webkit-details-marker{display:none}
#screen .more summary::after{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);margin:-3px 0 0 2px}
#screen .more[open] summary{color:var(--text);border-color:var(--border-strong)}
#screen .more summary.on{color:var(--text);border-color:var(--text)}
#screen .more-pop{position:absolute;z-index:20;top:calc(100% + 6px);right:0;min-width:260px;padding:12px;border:1px solid var(--border-strong);border-radius:8px;background:var(--surface);box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:10px}
#screen .more-pop .sel{max-width:none;width:100%}
#screen .count-row{display:flex;justify-content:space-between;align-items:center;gap:8px 16px;flex-wrap:wrap;margin:8px 0 0;font-size:12.5px;color:var(--dim)}
#screen .count-row b{color:var(--text);font-weight:500}
#screen .legend{display:flex;gap:14px;flex-wrap:wrap}
#screen .legend span{display:inline-flex;align-items:center;gap:6px}

/* ---------- grupo por vídeo ---------- */
#screen .vid{margin-top:10px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
#screen .vid-h{display:flex;align-items:flex-start;gap:14px;padding:10px 18px 8px;border-bottom:1px solid var(--border-subtle)}
#screen .av{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:11px;font-weight:700;color:#1A120A}
#screen .who{min-width:0;flex:1}
#screen .ch{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#screen .ch b{color:var(--text);font-weight:600}
#screen .tag{font-size:11px;padding:0 6px;border-radius:3px;line-height:18px;border:1px solid currentColor}
#screen .tag.rv{color:var(--info-text)}
#screen .syncnote{display:flex;align-items:center;gap:6px;margin:4px 0 0;font-size:12px;color:var(--warning-text)}
#screen .btn.fj-outline{background:transparent;border-color:var(--forja);color:var(--forja)}
#screen .btn.fj-outline:hover{background:var(--forja-subtle)}
#screen .fj-confirm{border-top:1px solid var(--forja-line);padding-top:8px}
#screen .tag.ia{color:var(--ia)} #screen .tag.viagem{color:var(--viagem)}
#screen .vid-h h3{margin:1px 0 1px;font-size:15.5px;font-weight:600;line-height:1.35}
#screen .meta{font-size:12px;color:var(--dim);display:flex;gap:4px 14px;flex-wrap:wrap}
#screen .acts{display:flex;gap:4px;flex:none;align-items:center}
#screen .ghost{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 10px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--muted);font-size:12.5px;text-decoration:none;cursor:pointer;white-space:nowrap}
#screen .ghost:hover{border-color:var(--border);background:var(--surface-2);color:var(--text)}
#screen .save{width:32px;height:32px;padding:0;justify-content:center}
#screen .save[aria-pressed="true"]{color:var(--text)}
#screen .save[aria-pressed="true"] svg{fill:currentColor}

/* linha de troca */
#screen .chg{display:grid;grid-template-columns:160px minmax(0,1fr) 340px;border-top:1px solid var(--border-subtle)}
#screen .chg:first-of-type{border-top:0}
#screen .chg > *{padding:16px 18px;min-width:0}
#screen .when{border-right:1px solid var(--border-subtle)}
#screen .kind{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600}

#screen .wline{display:block;margin-top:4px;font-size:12.5px;color:var(--muted)}
#screen .wline .rel{display:block;font-size:12px;color:var(--dim)}
#screen .when .seq{display:block;margin-top:8px;font-size:12px;color:var(--dim)}
#screen .when .save{margin-top:8px;margin-left:-8px}
#screen .effect{border-left:1px solid var(--border-subtle);background:var(--sunk)}

/* diff de título (herói) */
#screen .t-pair{display:grid;grid-template-columns:38px minmax(0,1fr);row-gap:8px;align-items:baseline}
#screen .t-pair .lbl{font-size:11.5px;color:var(--dim);font-weight:500}
#screen .t-pair p{margin:0}
#screen .t-old{font-size:15px;line-height:1.4;color:var(--dim)}
#screen .t-old del{text-decoration:line-through;text-decoration-color:var(--danger);text-decoration-thickness:1.5px;color:var(--del-color)}
#screen .t-new{font-size:18px;line-height:1.35;font-weight:600;letter-spacing:-.01em}
#screen .t-new ins{text-decoration:none;background:var(--ins-bg);box-shadow:inset 0 -2px 0 var(--success);padding:0 2px;border-radius:2px}
#screen .tmv{text-decoration:underline dotted;text-decoration-color:var(--muted);text-underline-offset:4px}
#screen .tcase{text-decoration:underline dashed;text-decoration-color:var(--muted);text-underline-offset:4px}
#screen .t-stats{margin-top:10px;font-size:12px;color:var(--dim);display:flex;gap:4px 14px;flex-wrap:wrap}

#screen .badge{display:inline-flex;align-items:flex-start;gap:6px;font-size:12px;line-height:1.4;padding:5px 9px;border-radius:5px;margin-bottom:12px}
#screen .badge svg{margin-top:1px}
#screen .badge.rev{background:var(--info-bg);color:var(--info-text);border:1px solid var(--info-line)}
#screen .badge.note{background:var(--warning-bg);color:var(--warning-text);border:1px solid var(--warning-line)}

/* thumbs (herói) */
#screen .th-pair{display:grid;grid-template-columns:minmax(0,1fr) 30px minmax(0,1fr);align-items:start;max-width:620px}

#screen .th-pair figure{margin:0}
#screen .th-pair figcaption{margin-top:7px;font-size:12px;color:var(--dim);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
#screen .th-pair figcaption b{color:var(--muted);font-weight:600}
#screen .th-arrow{display:grid;place-items:center;color:var(--dim)}
#screen .thumb{position:relative;aspect-ratio:16/9;border-radius:5px;overflow:hidden;background:linear-gradient(135deg,var(--a) 0 60%,var(--b) 60% 100%);box-shadow:0 0 0 1px rgba(0,0,0,.25)}
#screen .thumb .tx{position:absolute;max-width:56%;font-weight:800;line-height:.95;letter-spacing:-.02em;text-transform:uppercase;text-shadow:0 2px 0 rgba(0,0,0,.35)}

#screen .thumb .person{position:absolute;bottom:0;width:34%;height:80%}
#screen .thumb .person::before{content:"";position:absolute;left:24%;top:0;width:52%;aspect-ratio:1;border-radius:50%;background:var(--s)}
#screen .thumb .person::after{content:"";position:absolute;left:0;right:0;bottom:-6%;height:42%;border-radius:48% 48% 0 0;background:var(--sh)}
#screen .thumb .dur{position:absolute;right:5px;bottom:5px;background:rgba(0,0,0,.82);color:#fff;font:500 10px/1 "JetBrains Mono",monospace;padding:3px 4px;border-radius:3px}
#screen .hatch{display:grid;place-items:center;text-align:center;background:repeating-linear-gradient(135deg,var(--sunk) 0 10px,var(--surface) 10px 20px);box-shadow:inset 0 0 0 1px var(--border-strong);color:var(--muted);font-size:12.5px;line-height:1.45;padding:14px;border-radius:6px}
#screen .hatch b{display:block;color:var(--text);font-weight:600;margin-bottom:2px}

/* diff de descrição */
#screen .d-head{font-size:13px;color:var(--muted);margin:0 0 10px;max-width:70ch}
#screen .d-sum{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap}
#screen .d-sum .chip{font-size:12.5px;padding:3px 8px;border-radius:4px;border:1px solid var(--border);color:var(--text)}
#screen .d-sum .chip .add{color:var(--success-text)} #screen .d-sum .chip .rem{color:var(--danger-text)}
#screen .d-sum .noise{color:var(--dim);font-size:12px}
#screen .linkbtn{background:none;border:0;padding:0 4px;min-height:32px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:12.5px}
#screen .linkbtn:hover{color:var(--text)}
#screen .d-diff{margin-top:10px;border:1px solid var(--border-subtle);border-radius:6px;background:var(--sunk);font-size:12.5px;line-height:1.55;overflow:hidden}
#screen .d-diff .ln{display:grid;grid-template-columns:26px minmax(0,1fr);padding:2px 12px 2px 0;overflow-wrap:anywhere;color:var(--text)}
#screen .d-diff .g{text-align:center;font-family:"JetBrains Mono",monospace;font-weight:500}
#screen .d-diff .ln.a{background:var(--success-bg)} #screen .d-diff .ln.a .g{color:var(--success-text)}
#screen .d-diff .ln.r{background:var(--danger-bg)} #screen .d-diff .ln.r .g{color:var(--danger-text)}
#screen .d-diff .ln.ctx{color:var(--muted)}
#screen .d-diff .ln.nz{display:none;color:var(--utm);font-style:italic}
#screen .d-diff.show-noise .ln.nz{display:grid}

#screen .d-diff .bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:0 10px;border-top:1px solid var(--border-subtle);font-size:12px;color:var(--muted)}
#screen .d-diff .bar label{display:inline-flex;align-items:center;gap:7px;min-height:32px;cursor:pointer}
#screen .d-diff .bar input{accent-color:var(--text);width:15px;height:15px;margin:0}

#screen .eff-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;color:var(--dim);margin-bottom:4px}
#screen .sparkbox{position:relative;height:64px;margin-bottom:20px}
#screen .spark{display:block;width:100%;height:64px}
#screen .spark-lbl{position:absolute;font-size:10.5px;color:var(--muted);top:-1px;pointer-events:none;white-space:nowrap}

#screen .eff-dl dd{margin:0;text-align:right;color:var(--muted)}
#screen .eff-dl dd .num{color:var(--text)}

#screen .verdict{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13.5px;font-weight:600}

#screen .verdict.win{color:var(--success-text)}
#screen .verdict.loss{color:var(--danger-text)}
#screen .verdict.flat,#screen .verdict.inc{color:var(--text)}
#screen .verdict.wait{color:var(--text);font-weight:500}
#screen .adj{display:inline-block;margin-top:6px;font-size:11.5px;color:var(--muted);border:1px solid var(--border);border-radius:4px;padding:1px 7px}
#screen .eff-foot{margin:6px 0 0;font-size:12px;color:var(--dim);line-height:1.45}

#screen .progress i{flex:1;height:5px;border-radius:2px;background:var(--border-strong)}
#screen .progress i.f{background:var(--muted)}
#screen .na{font-size:12.5px;color:var(--muted);line-height:1.5;margin:0}

/* vazio e paginação */
#screen .empty{margin-top:16px;border:1px dashed var(--border-strong);border-radius:8px;padding:36px 24px;text-align:center}
#screen .empty h3{margin:0 0 6px;font-size:15px;font-weight:600}
#screen .empty p{margin:0 auto 14px;color:var(--dim);font-size:13px;max-width:56ch}
#screen .empty .btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#screen .pager{margin-top:22px;display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--dim)}

@media (max-width:1280px){ #screen .summary{grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr)} #screen .summary > .forja{grid-column:1/-1;border-left:0;border-top:1px solid var(--border-subtle)} }
@media (max-width:1180px){ #screen .chg{grid-template-columns:150px minmax(0,1fr) 290px}      }

  #screen .vid-h{flex-wrap:wrap}
  #screen .acts{width:100%;margin-left:36px}
}
@media (max-width:820px){
  
  #screen .search{max-width:none;flex-basis:100%}
  #screen .acts{margin-left:0;flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){ #screen *{transition:none !important;animation:none !important;scroll-behavior:auto !important} }

  onTheme:function(){drawSparks();},
  onMock:function(id,g){onMock(id,g);},

var root=document.documentElement;
var TYPES=[['title','Título','i-title'],['thumb','Thumbnail','i-image'],['desc','Descrição','i-text']];
var MEASURED=['ganhou','perdeu','neutro','inconclusivo'];
var DECIDED=['ganhou','perdeu','neutro'];
var NICHE_STORE={todos:'Todos',viagem:'Viagem',ia:'IA'};
var FMT_LABEL={all:'longos e Shorts',long:'longos',short:'Shorts'};
function fmtQ(){return st.fmt==='all'?null:st.fmt;}
function numH(t){return esc(t).replace(/^([−+-]?[\d.,]+)/,'<span class="num">$1</span>');}
function rangeTxt(arr){var a=arr.slice().sort(function(x,y){return x-y});return a.length===1?F.pp(a[0]):'de '+F.pp(a[0]).replace(' pp','')+' a '+F.pp(a[a.length-1]);}
function ppTxt(v){return F.pp(v);}
/* M1: grupos das inconclusivas = effect.inconclusiveKind do motor */
var INC_KINDS=[['janela-dupla',function(n){return (n===1?'inconclusiva':'inconclusivas')+' por 2 campos em &lt;&nbsp;'+SIM+'&nbsp;h';}],['versao-curta',function(n){return 'com uma das versões menos de 1 dia no ar';}],['antes-curto',function(n){return 'com o antes curto demais (≤ 2 dias)';}],['outro',function(n){return (n===1?'inconclusiva':'inconclusivas')+' por outro motivo';}]];

/* ---------- estado da tela ---------- */
var st={win:30,fmt:'all',niche:'todos',type:'all',channel:'all',sort:'recent',measured:false,saved:false,q:'',video:null,changes:null,limit:8};
(function(){var p=window.__params||{};
  if(p.win&&['7','30','90'].indexOf(p.win)>-1)st.win=+p.win;
  if(p.fmt&&['all','long','short'].indexOf(p.fmt)>-1)st.fmt=p.fmt;
  if(p.sort&&['recent','gain','loss'].indexOf(p.sort)>-1)st.sort=p.sort;
  if(p.q)st.q=p.q;if(p.measured==='1')st.measured=true;if(p.saved==='1')st.saved=true;
  if(p.type&&['title','thumb','desc'].indexOf(p.type)>-1)st.type=p.type;
  if(p.channel&&O.channel(p.channel)&&!O.channel(p.channel).own)st.channel=p.channel;
  if(p.video&&O.video(p.video)){st.video=p.video;st.win=90;st.fmt=O.video(p.video).fmt;}
  if(p.changes){var ids=p.changes.split(',').filter(function(id){return O.change(id)});if(ids.length){st.changes=ids;st.winBefore=st.win;st.win=90;}}
})();
var SW=O.swipe;

/* ---------- utilidades de apresentação ---------- */
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function pl(n,one,many){return n+' '+(n===1?one:many);}
function pctTxt(fr){return fr==null?'—':F.pct(fr);}
function chName(id){return O.channel(id).name;}
function eff(c){return O.effect(c.id);}
function isMeasured(c){var e=eff(c);return MEASURED.indexOf(e.status)>-1;}
function query(o){o=o||{};
  if(st.changes&&!o.ignoreChanges){var ids=st.changes;return O.changesIn({days:90,niche:'todos',type:o.ignoreType||st.type==='all'?null:st.type}).filter(function(c){return ids.indexOf(c.id)>-1});}
  return O.changesIn({days:o.days||st.win,niche:st.niche,fmt:o.anyFmt?null:fmtQ(),
  type:o.ignoreType||st.type==='all'?null:st.type,channel:o.ignoreChannel||st.channel==='all'?null:st.channel,video:o.ignoreVideo?null:st.video});}
function extra(list){return list.filter(function(c){
  if(st.measured&&!isMeasured(c))return false;
  if(st.saved&&!SW.saved(c.id))return false;
  if(st.q){var v=O.video(c.video);var hay=[v.title,chName(c.ch),typeof c.before==='string'?c.before:'',typeof c.after==='string'?c.after:''].join(' ').toLowerCase();var qq=st.q.toLowerCase();if(hay.indexOf(qq)<0)return false;}
  return true;});}
function durTxt(ms,approx){return D.dur(ms,approx).replace(/≈ /,'cerca de ').replace(/(\d+) d\b/g,function(_,n){return n+(n==='1'?' dia':' dias')}).replace(/(\d+) h\b/g,function(_,n){return n+(n==='1'?' hora':' horas')}).replace(/(\d+) min\b/g,function(_,n){return n+(n==='1'?' minuto':' minutos')}).replace(/(\d+ (?:dias?|horas?)) (\d+ (?:horas?|minutos?))$/,'$1 e $2').replace(/ e 0 (horas|minutos)$/,'');}
function whenText(at,c){
  if(c.prec==='min')return D.weekdayShort(at)+', '+D.dm(at)+', '+D.hm(at);
  if(c.prec==='6h'){var a=c.window[0],b=c.window[1];if(D.dm(a)===D.dm(b-1))return D.weekdayShort(a)+', '+D.dm(a)+', entre '+D.hh(a)+' e '+(D.hm(b)==='00:00'?'24h':D.hh(b));return D.weekdayShort(a)+', '+c.whenText;}
  if(c.window){var a1=c.window[0],b1=c.window[1];return 'entre '+D.weekdayShort(a1)+', '+D.dm(a1)+' '+D.hh(a1)+' e '+D.weekdayShort(b1)+', '+D.dm(b1)+' '+D.hh(b1);}
  return c.whenText;}
/* ---------- cabeçalho, abas, avisos ---------- */
document.addEventListener('click',function(e){var b=e.target.closest('#methodBtn');if(!b)return;var m=document.getElementById('method'),o=b.getAttribute('aria-expanded')==='true';m.hidden=o;b.setAttribute('aria-expanded',String(!o));});
function renderHead(){
  document.getElementById('method').textContent='Precisa de '+AFTER+' dias depois da troca; o antes pode ser mais curto (coleta diária desde '+D.dm(O.SERIES_START)+'). Efeito = variação observada de views/dia ('+O.RULES.effect.afterDays+' dias depois vs até '+O.RULES.effect.maxBeforeDays+' dias antes) menos a esperada: a variação dos vídeos sem troca do mesmo canal e formato, na mesma faixa de idade ou no mesmo dia de vida. Ganhou ou perdeu só com mais de '+O.RULES.effect.pp+' pp e fora da faixa normal (interquartil). Inconclusivo com n < '+O.RULES.effect.minN+', antes curto ou outro campo mudado em menos de '+O.RULES.effect.simultHours+'\u00a0h. Não prova causa.';
}

/* ---------- resumo e ledger ---------- */
function renderSummary(){
  var wk=O.changesIn({days:7,niche:st.niche,fmt:fmtQ()});
  var cnt={title:0,thumb:0,desc:0},vids={},chs={},per={};
  wk.forEach(function(c){cnt[c.type]++;vids[c.video]=1;chs[c.ch]=1;per[c.ch]=(per[c.ch]||0)+1;});
  var top=Object.keys(per).sort(function(a,b){return per[b]-per[a]})[0];
  var revs=wk.filter(function(c){return c.revertTo}).length;
  var fmtName={all:'longos e Shorts',long:'vídeos longos',short:'Shorts'}[st.fmt],nicheTxt=st.niche==='todos'?'':', nicho '+NICHE_STORE[st.niche];
  var from=O.NOW-7*DAY;
  document.getElementById('weekWin').textContent='De '+D.weekdayShort(from)+', '+D.dm(from)+', a hoje, '+fmtName+nicheTxt+'.';
  var lead=document.getElementById('weekLead');
  if(!wk.length){lead.textContent='Nenhuma troca em '+fmtName+nicheTxt+' nesta semana.';return;}

  ].filter(function(f){return f[1]});
  function countWithout(f){var keep=JSON.stringify(st);f[4]();var n=extra(query()).length;Object.assign(st,JSON.parse(keep));return n;}
  var restr=(st.measured?' com efeito medido':'')+(st.saved?' no swipe file':'')+(st.q?' com “'+st.q+'”':'')+(st.channel!=='all'?' de '+chName(st.channel):'');
  var since=st.type==='thumb'?O.ARCHIVE_START:null,capped=since&&(O.NOW-st.win*DAY)<since,descNote=st.type==='desc'&&(O.NOW-st.win*DAY)<O.ARCHIVE_START;
  var head='Nenhuma troca'+tp+restr+where+(capped?' desde '+D.dm(since)+' (início da detecção)':' nos últimos '+st.win+' dias');
  var why,btns='',fix=[];
  if(base.length){
    FILT.forEach(function(f){var n=countWithout(f);if(n)fix.push([f,n]);});
    var typed=st.type!=='all'?base.filter(function(c){return c.type===st.type}):base;
    if(st.measured&&typed.length){var by={};typed.forEach(function(c){var s=eff(c).label;by[s]=(by[s]||0)+1;});
      why=(typed.length===1?'A única troca':'As '+typed.length+' trocas')+tp+' desta janela'+where+' ainda não '+(typed.length===1?'tem':'têm')+' efeito medido: '+Object.keys(by).map(function(k){return by[k]+' '+k}).join(', ')+'.';}
    else if(capped&&!typed.length) why='Trocas de thumbnail só são detectadas desde '+D.dm(since)+' ('+Math.floor((O.NOW-since)/DAY)+' dias); nesse período, nenhuma'+where+'. Há '+pl(base.length,'troca','trocas')+' de outros tipos nesta janela.';
    else why='Há '+pl(base.length,'troca','trocas')+where+' nesta janela; '+(fix.length?fix.map(function(x){return x[0][2]+' esconde '+(x[1]===base.length?(x[1]===1?'a única':'todas as '+x[1]):(x[1]===1?'1':x[1]))}).join(', '):'a combinação dos filtros esconde todas')+'.';
    fix.forEach(function(x,i){btns+='<button class="btn" type="button" data-fix="'+i+'">'+esc(x[0][3])+' ('+x[1]+')</button>';});
  }else{
    var wider=[30,90].filter(function(w){return w>st.win}).map(function(w){return [w,O.changesIn({days:w,niche:st.niche,fmt:fmtQ()}).length]}).filter(function(x){return x[1]>0})[0];
    if(wider){why='Nenhuma troca'+where+' nesta janela. Em '+wider[0]+' dias há '+pl(wider[1],'troca.','trocas.');btns+='<button class="btn" type="button" data-widen="'+wider[0]+'">Ampliar para '+wider[0]+' dias</button>';}
    else why='Nenhuma troca'+where+' nos últimos '+st.win+' dias, com qualquer filtro. Isso é resultado: esses canais não mexeram em títulos, thumbnails nem descrições nesse período'+((O.NOW-st.win*DAY)<O.ARCHIVE_START?' (thumbnails só detectadas desde '+D.dm(O.ARCHIVE_START)+')':'')+'.';
  }
  if(descNote)why+=' Descrições anteriores a '+D.dm(O.ARCHIVE_START)+' aparecem sem o texto.';
  btns+='<button class="btn" type="button" id="clearBtn">Limpar filtros</button>';
  document.getElementById('emptyH').textContent=head;document.getElementById('emptyWhy').textContent=why;document.getElementById('emptyBtns').innerHTML=btns;
  document.querySelectorAll('[data-fix]').forEach(function(b){b.addEventListener('click',function(){fix[+b.dataset.fix][0][4]();syncControls();renderAll();});});
  var w=document.querySelector('[data-widen]');if(w)w.addEventListener('click',function(){st.win=+w.dataset.widen;syncControls();renderAll();});
  document.getElementById('clearBtn').addEventListener('click',clearFilters);
}

/* ---------- sparklines: projeção do esperado em --muted (cálculo do site, nunca cor da forja) ---------- */
var NS='http://www.w3.org/2000/svg';
function el(n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);return e;}
function drawSparks(){
  document.querySelectorAll('svg.spark').forEach(function(s){
    var c=O.change(s.dataset.id),e=eff(c),r=dailyRates(c,e),b=r.b,a=r.a;
    while(s.firstChild)s.removeChild(s.firstChild);
    var box=s.parentNode;box.querySelectorAll('.spark-lbl').forEach(function(x){x.remove()});
    var W=Math.max(120,Math.round(s.getBoundingClientRect().width)),H=64,pt=14,pb=3;
    s.setAttribute('viewBox','0 0 '+W+' '+H);
    var hasExp=e.status!=='aguardando'&&e.expected!=null,rb=e.beforeAvg;
    var vals=b.concat(a).concat(hasExp?[rb*(1+e.iqr[0]),rb*(1+e.iqr[1])]:[]);
    var hi=Math.max.apply(null,vals),lo=Math.min.apply(null,vals),pad=(hi-lo)*.12||hi*.05,max=hi+pad,min=Math.max(0,lo-pad);
    var step=W/13,off=7-b.length;
    function x(i){return (i+off)*step;} function y(v){return pt+(H-pt-pb)*(1-(v-min)/(max-min));}
    var xm=(x(b.length-1)+x(b.length))/2,last=x(b.length+6);
    if(hasExp){
      s.appendChild(el('polygon',{points:xm+','+y(rb)+' '+last+','+y(rb*(1+e.iqr[1]))+' '+last+','+y(rb*(1+e.iqr[0])),fill:'var(--band)'}));
      s.appendChild(el('line',{x1:xm,x2:last,y1:y(rb),y2:y(rb*(1+e.expected)),stroke:'var(--muted)','stroke-width':1.5,'stroke-dasharray':'4 3'}));
    }
    s.appendChild(el('line',{x1:xm,x2:xm,y1:pt-2,y2:H,stroke:'var(--muted)','stroke-width':1.5,'stroke-dasharray':'3 2'}));
    function path(arr,start){return arr.map(function(v,i){return (i?'L':'M')+x(start+i).toFixed(1)+' '+y(v).toFixed(1)}).join(' ');}
    if(b.length)s.appendChild(el('path',{d:path(b,0),fill:'none',stroke:'var(--spark-before)','stroke-width':2,'stroke-linejoin':'round'}));
    if(b.length===1)s.appendChild(el('circle',{cx:x(0),cy:y(b[0]),r:3,fill:'var(--spark-before)'}));
    if(a.length)s.appendChild(el('path',{d:path(a,b.length),fill:'none',stroke:'var(--spark-after)','stroke-width':2,'stroke-linejoin':'round'}));
    if(a.length===1)s.appendChild(el('circle',{cx:x(b.length),cy:y(a[0]),r:3,fill:'var(--spark-after)'}));
    if(a.length<7)s.appendChild(el('line',{x1:x(b.length+Math.max(0,a.length-1))+4,x2:last,y1:H-4,y2:H-4,stroke:'var(--muted)','stroke-width':1.5,'stroke-dasharray':'2 4'}));
    function lbl(css,html){var sp=document.createElement('span');sp.className='spark-lbl';sp.style.cssText=css;sp.innerHTML=html;box.appendChild(sp);}
    lbl('left:'+(xm+4)+'px','troca');
    lbl('left:0','máx '+numH(F.num(hi)));
    lbl('left:0;top:auto;bottom:-15px','mín '+numH(F.num(lo))+' (eixo não começa em 0)');
  });
}
if(window.ResizeObserver){new ResizeObserver(function(){drawSparks();}).observe(document.body);}

/* ---------- interações ---------- */
function bindFeed(){
  document.querySelectorAll('[data-toggle-diff]').forEach(function(btn){btn.addEventListener('click',function(){
    var d=document.getElementById(btn.getAttribute('aria-controls'));var open=btn.getAttribute('aria-expanded')==='true';
    d.hidden=open;var pk=document.getElementById(d.id.replace(/^dd-/,'dp-'));if(pk)pk.hidden=!open;btn.setAttribute('aria-expanded',String(!open));btn.textContent=open?'Ver comparação':'Esconder comparação';});});
  document.querySelectorAll('[data-noise]').forEach(function(cb){cb.addEventListener('change',function(){cb.closest('.d-diff').classList.toggle('show-noise',cb.checked);});});
  document.querySelectorAll('[data-save]').forEach(function(b){b.addEventListener('click',function(){
    var id=b.dataset.save;SW.toggle(id);var on=SW.saved(id),lbl=SW.label(id);b.setAttribute('aria-pressed',String(on));b.setAttribute('aria-label',lbl);b.title=lbl;
    toast(on?'Salvo no swipe file':'Tirado do swipe file');if(st.saved)renderAll();});});
}
function toast(msg,kind){CHROME.toast(kind||'ok',msg,'');}
function seg(id,key,num){document.getElementById(id).addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;st[key]=num?+b.dataset.v:b.dataset.v;st.limit=8;
  syncControls();renderAll();});}
seg('fWin','win',true);seg('fFmt','fmt');seg('fType','type');
document.getElementById('fChannel').addEventListener('change',function(e){st.channel=e.target.value;st.limit=8;renderAll();});
document.getElementById('fSort').addEventListener('change',function(e){st.sort=e.target.value;st.limit=8;syncUrl();renderFeed();});
document.getElementById('fMeasured').addEventListener('change',function(e){st.measured=e.target.checked;st.limit=8;renderAll();});
document.getElementById('fSaved').addEventListener('change',function(e){st.saved=e.target.checked;st.limit=8;renderAll();});
document.getElementById('fSearch').addEventListener('input',function(e){st.q=e.target.value.trim();st.limit=8;renderAll();});

document.getElementById('videoX').addEventListener('click',function(){if(st.changes||st.video){st.win=30;st.fmt='all';}st.video=null;st.changes=null;st.limit=8;syncControls();renderAll();});
document.getElementById('readX').addEventListener('click',function(){st.reading=null;st.linkReading=null;st.readingMissing=false;renderAll();});
document.getElementById('chanX').addEventListener('click',function(){st.channel='all';st.limit=8;syncControls();renderAll();});
document.getElementById('moreBtn').addEventListener('click',function(){st.limit+=8;renderFeed();});
function clearFilters(){st.changes=null;st.fmt='all';st.type='all';st.channel='all';st.measured=false;st.saved=false;st.q='';st.video=null;st.fmt='all';st.win=30;st.limit=8;syncControls();renderAll();MP[1]='cheio';CHROME.setMockPressed(MP);}
function syncControls(){
  [['fWin','win'],['fFmt','fmt']].forEach(function(p){document.getElementById(p[0]).querySelectorAll('button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.v===String(st[p[1]])));});});
  ['fWin','fFmt'].forEach(function(id){document.getElementById(id).querySelectorAll('button').forEach(function(b){b.disabled=!!st.changes;b.title=st.changes?'Desligado enquanto a lista citada pela forja está aberta. Tire o filtro “Trocas citadas pela forja” para usar.':'';});});
  document.getElementById('fMeasured').checked=st.measured;document.getElementById('fSaved').checked=st.saved;document.getElementById('fSearch').value=st.q;document.getElementById('fSort').value=st.sort;
}
function renderMoreSum(){var k=(st.channel!=='all'?1:0)+(st.measured?1:0)+(st.saved?1:0);var sm=document.getElementById('moreSum');sm.textContent=k?'Mais filtros ('+k+')':'Mais filtros';sm.classList.toggle('on',k>0);}
function renderAll(){
  syncUrl();renderMoreSum();renderHead();renderTypeSeg();renderChannels();renderSummary();renderLedger();renderDigest();renderFeed();if(typeof renderForja==='function')renderForja();
  var rc=document.getElementById('readChip');rc.classList.toggle('hidden',!st.readingMissing&&!st.reading);var rt=document.getElementById('readTxt');
  if(st.reading&&!st.readingMissing){var lr=F_.byId[st.reading];rt.textContent='Leitura do link: '+NICHE_STORE[lr.niche]+', '+D.dm(lr.generatedAt)+' '+D.hm(lr.generatedAt);}
  if(st.readingMissing==='invalid')rt.innerHTML='Leitura do link não encontrada — <a class="lnk" href="'+esc(O.link.insights({}).replace(/\?$/,''))+'">veja as leituras em Insights</a>';
  else if(st.readingMissing)rt.innerHTML='Esse link é de outra leitura ('+esc(st.readingMissing.label)+', '+esc(st.readingMissing.niche)+', '+esc(D.dm(st.readingMissing.at))+') — <a class="lnk" href="'+esc(st.readingMissing.href)+'">abra em Insights</a>';
  var cc=document.getElementById('chanChip');cc.classList.toggle('hidden',st.channel==='all');if(st.channel!=='all')document.getElementById('chanTxt').textContent='Canal: '+chName(st.channel);
  var vc=document.getElementById('videoChip');vc.classList.toggle('hidden',!st.video&&!st.changes);
  if(st.changes)document.getElementById('videoTxt').textContent='Trocas citadas pela forja ('+st.changes.length+')';else if(st.video)document.getElementById('videoTxt').textContent='Vídeo: '+O.video(st.video).title;
}
var MP={0:F_.session.state().type==='resumo-trocas'?mockOf(F_.session.state().base):'nenhum',1:'cheio'};
/* B1: clique no botão ou no status do cabeçalho nunca reenvia um pedido em andamento; abre o resumo e foca o andamento.
   I5: pedido novo passa por uma prévia do escopo (forja.preview por nicho + canais fora) e confirmação. */
function focusForja(){var sb=document.getElementById('sumBox');if(!sb.open){sb.open=true;}var t=document.getElementById('forjaStatus')||document.getElementById('forja');t.scrollIntoView({block:'center'});t.setAttribute('tabindex','-1');t.focus({preventScroll:true});}
function onForjaClick(){var sc=currentScenario();
  if(!sendable(sc).length){focusForja();return;}
  st.forjaConfirm=true;renderForja();focusForja();}
function sendForja(){var res=SES.ask(scopeNow(),{type:'resumo-trocas'});st.justSent=res.ok?res.results.filter(function(x){return x.ok}).map(function(x){return x.niche}):null;st.forjaConfirm=false;renderForja();renderDigest();
  if(res.ok){var n=res.results.filter(function(r){return r.ok}).length;toast(n>1?'Pedidos enviados à forja (um por nicho)':'Pedido enviado à forja','forja');}else CHROME.toast('warn','Pedido não enviado',cap(res.reason||''));focusForja();}
function setForja(v){MP[0]=v;CHROME.setMockPressed(MP);renderForja();renderDigest();}
function onMock(id,g){
  if(g===0){st.justSent=null;SES.setBase(id==='nenhum'?'sem pedido':id,{type:'resumo-trocas'});st.forjaConfirm=false;setForja(id);return;}
  if(id==='vazio-sugestao'){Object.assign(st,{q:'',sort:'recent',saved:false,reading:null,readingMissing:false,win:7,type:'desc',measured:true,fmt:'long',video:null,changes:null,channel:'all',limit:8});CHROME.setNiche('ia',{silent:true,persist:false});st.niche='ia';}
  if(id==='vazio-90'){Object.assign(st,{q:'',sort:'recent',saved:false,reading:null,readingMissing:false,win:90,type:'thumb',measured:false,fmt:'short',video:null,changes:null,channel:'all',limit:8});CHROME.setNiche('viagem',{silent:true,persist:false});st.niche='viagem';}
  if(id==='cheio'){Object.assign(st,{win:30,type:'all',measured:false,saved:false,fmt:'all',video:null,changes:null,channel:'all',limit:8,q:'',sort:'recent'});CHROME.setNiche('todos',{silent:true,persist:false});st.niche='todos';}
  MP[1]=id;CHROME.setMockPressed(MP);syncControls();renderAll();
}
document.addEventListener('click',function(e){var m=document.getElementById('moreF');if(m.open&&!m.contains(e.target))m.open=false;});
document.addEventListener('keydown',function(e){var m=document.getElementById('moreF');if(e.key==='Escape'&&m.open){m.open=false;document.getElementById('moreSum').focus();}});
document.getElementById('sumBox').addEventListener('toggle',function(){this.querySelector('.sumopen').textContent=this.open?'Recolher resumo':'Ver resumo';drawSparks();});
st.niche=CHROME.niche();
CHROME.setMockPressed(MP);   /* a base do pedido vem da sessão do motor (persistida entre telas) */
(function(){var objNiche=st.video?O.video(st.video).niche:st.channel!=='all'?O.channel(st.channel).niche:null;
  if(st.changes){var ns=st.changes.map(function(id){return O.change(id).niche}).filter(function(x,i,a){return a.indexOf(x)===i});var want=ns.length===1?ns[0]:'todos';if(st.niche!=='todos'&&ns.some(function(n){return n!==st.niche})){CHROME.setNiche(want,{silent:true,persist:false});st.niche=want;CHROME.toast('','Nicho mudou para '+(want==='todos'?'Todos':O.NICHES[want].label)+' para mostrar as trocas citadas','');}}
  if(objNiche&&st.niche!=='todos'&&st.niche!==objNiche){CHROME.setNiche(objNiche,{silent:true,persist:false});st.niche=objNiche;
    CHROME.toast('','Nicho mudou para '+O.NICHES[objNiche].label+' para mostrar '+(st.video?'este vídeo':'este canal'),'');}})();
/* ?reading=<id>: abre o card da forja com essa leitura, no nicho dela (persist:false), e põe o foco nele */
(function(){var p=window.__params||{};if(!p.reading)return;
  var r=F_.byId[p.reading];
  if(!r){st.readingMissing='invalid';return;}   /* id inválido: aviso sem o id cru; não vai para a URL nem para o back= */
  if(r.type!=='resumo-trocas'){var T=F_.readingTypes.filter(function(t){return t.id===r.type})[0];st.readingMissing={label:T?T.label.replace(/ \(.*\)$/,'').replace(/ dos outliers.*$/,''):'outro tipo',at:r.generatedAt,href:O.link.insights({reading:r.id}),niche:O.NICHES[r.niche].label};return;}
  st.reading=p.reading;
  if(!F_.readings.some(function(x){return x.id===r.id})){st.linkReading=r;}   /* leitura de cenário: liga o mock publicado */
  if(st.niche!=='todos'&&st.niche!==r.niche){var pn=CHROME.store&&CHROME.store.get('obs-niche');CHROME.setNiche(r.niche,{silent:true,persist:r.niche===pn});st.niche=r.niche;
    CHROME.toast('','Nicho mudou para '+O.NICHES[r.niche].label+' para mostrar esta leitura','');}
  st.focusReading=r.niche;fjOpen[r.niche]=true;})();
syncControls();renderAll();
if(st.focusReading){var sb0=document.getElementById('sumBox');sb0.open=true;var d0=document.querySelector('#forja details.fj-niche[data-n="'+st.focusReading+'"]');if(d0){d0.open=true;var sm=d0.querySelector('summary');sm.scrollIntoView({block:'center'});sm.focus({preventScroll:true});}}
window.__screen={st:st,renderAll:renderAll,syncControls:syncControls};
})();
