<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Observatório e forja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="chrome.css">
<style id="screen-css">
/* moldura-forja: só o que é desta tela. Tokens, sidebar, cabeçalhos, nicho, abas, barra de estados e toasts vêm de chrome.css. */
:is(#screen,#drawer) .num{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;font-size:.92em;letter-spacing:-.01em}
:is(#screen,#drawer) :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
:is(#screen,#drawer) .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:is(#screen,#drawer) .muted{color:var(--muted)}:is(#screen,#drawer) .dim{color:var(--dim)}
/* ---------- buttons ---------- */
:is(#screen,#drawer) .btn{display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:0 13px;border-radius:6px;border:1px solid var(--border-strong);background:var(--surface);cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap;text-decoration:none}
:is(#screen,#drawer) .btn:hover{background:var(--surface-hover)}
:is(#screen,#drawer) .btn svg{width:15px;height:15px;flex:none}
:is(#screen,#drawer) .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
:is(#screen,#drawer) .btn.primary:hover{background:var(--accent-hover)}
:is(#screen,#drawer) .btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
:is(#screen,#drawer) .btn.ghost:hover{background:var(--surface-hover);color:var(--text)}
:is(#screen,#drawer) .btn.forja{border-color:var(--forja-line);color:var(--forja);background:transparent}
:is(#screen,#drawer) .btn.forja:hover{background:var(--forja-subtle);border-color:var(--forja)}
:is(#screen,#drawer) .btn.forja.warnst{border-color:var(--warning);color:var(--warning-text)}
:is(#screen,#drawer) .btn.forja-solid{background:var(--forja);border-color:var(--forja);color:var(--on-forja);font-weight:600}
:is(#screen,#drawer) .btn.forja-solid:hover{background:var(--forja-hover)}
:is(#screen,#drawer) .btn.icon{width:34px;padding:0;justify-content:center}
:is(#screen,#drawer) .btn[disabled]{cursor:not-allowed;background:var(--surface-2);border-color:var(--border);color:var(--dim)}
:is(#screen,#drawer) .btn small{font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:400}

:is(#screen,#drawer) .btn.forja-solid,:is(#screen,#drawer) .btn.primary{font-weight:600}
:is(#screen,#drawer) a.btn{text-decoration:none}
:is(#screen,#drawer) .dot{width:8px;height:8px;border-radius:50%;background:var(--success);flex:none}:is(#screen,#drawer) .dot.warn{background:var(--warning)}:is(#screen,#drawer) .dot.forja{background:var(--forja)}
:is(#screen,#drawer) .seg-ctl{display:inline-flex;border:1px solid var(--border-strong);border-radius:6px;overflow:hidden;background:var(--surface)}
:is(#screen,#drawer) .seg-ctl button{border:0;background:none;padding:0 12px;min-height:32px;cursor:pointer;color:var(--muted);font-size:13px}
:is(#screen,#drawer) .seg-ctl button+button{border-left:1px solid var(--border-strong)}
:is(#screen,#drawer) .seg-ctl button[aria-pressed="true"]{background:var(--surface-2);color:var(--text);font-weight:600;box-shadow:inset 0 -2px 0 var(--text)}
:is(#screen,#drawer) .seg-ctl button[disabled]{cursor:not-allowed;color:var(--dim);text-decoration:line-through}
:is(#screen,#drawer) .seg-ctl button{min-width:36px}
:is(#screen,#drawer) .tabctx{display:flex;justify-content:space-between;align-items:center;gap:12px 16px;flex-wrap:wrap;padding:0 0 14px;border-bottom:1px solid var(--border-subtle);min-height:54px;box-sizing:border-box}   /* M6: duas linhas de contexto ou uma altura de controle (34 px), mais o respiro de 14 px: igual em toda aba */
:is(#screen,#drawer) .tabctx p{margin:0;color:var(--muted);font-size:13px;max-width:70ch}
:is(#screen,#drawer) .tabctx p b{color:var(--text);font-weight:500}
:is(#screen,#drawer) .ctls{display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap}
:is(#screen,#drawer) .win{display:flex;align-items:center;gap:8px}
:is(#screen,#drawer) .win>span.lbl{font-size:12.5px;color:var(--muted)}
:is(#screen,#drawer) .win .seg-ctl button{padding:0 10px;font-size:12.5px}

/* ---------- tab bodies ---------- */
:is(#screen,#drawer) .body{padding-top:14px}
:is(#screen,#drawer) .tbl{width:100%;border-collapse:collapse;font-size:13px}
:is(#screen,#drawer) .tbl th{text-align:left;font-weight:500;color:var(--dim);font-size:12px;padding:6px 10px;border-bottom:1px solid var(--border)}
:is(#screen,#drawer) .tbl td{padding:9px 10px;border-bottom:1px solid var(--border-subtle);vertical-align:top}
:is(#screen,#drawer) .tbl td.n,:is(#screen,#drawer) .tbl th.n{text-align:right;white-space:nowrap}
:is(#screen,#drawer) .tbl tr:hover td{background:var(--surface-hover)}
:is(#screen,#drawer) .tbl .ttl{display:block;max-width:56ch}
:is(#screen,#drawer) .tbl .old{color:var(--dim);text-decoration:line-through;text-decoration-color:var(--dim)}
:is(#screen,#drawer) .tbl .sub{display:block;color:var(--dim);font-size:12px}
:is(#screen,#drawer) .tbl .when{font-size:12.5px;color:var(--muted);min-width:150px}
:is(#screen,#drawer) .tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:1px 7px;border-radius:4px;border:1px solid var(--border-strong);color:var(--muted);white-space:nowrap}
:is(#screen,#drawer) .tag.wait{border-style:dashed}
:is(#screen,#drawer) .chip{display:inline-flex;gap:6px;align-items:center;font-size:12px;margin-top:3px}
:is(#screen,#drawer) .chip .add{color:var(--success)}:is(#screen,#drawer) .chip .rem{color:var(--danger)}
:is(#screen,#drawer) .linkbtn{background:none;border:0;padding:0 2px;color:var(--text);text-decoration:underline;text-underline-offset:2px;cursor:pointer;font-size:12px;min-height:32px;min-width:32px;display:inline-flex;align-items:center;vertical-align:middle}
:is(#screen,#drawer) .eff{font-size:12.5px;min-width:190px}
:is(#screen,#drawer) .eff .v{font-weight:600;display:inline-flex;gap:5px;align-items:center}
:is(#screen,#drawer) .eff .v.up{color:var(--success)}:is(#screen,#drawer) .eff .v.down{color:var(--danger)}
:is(#screen,#drawer) .eff small{display:block;color:var(--dim);font-size:12px}
:is(#screen,#drawer) .tbl-wrap{overflow-x:auto}
:is(#screen,#drawer) .tbl-wrap.more{-webkit-mask-image:linear-gradient(to right,#000 88%,transparent);mask-image:linear-gradient(to right,#000 88%,transparent)}
:is(#screen,#drawer) .scrollhint{font-size:12px;color:var(--muted);margin:0 0 6px}
:is(#screen,#drawer) .nic-ia{color:var(--ia)}:is(#screen,#drawer) .nic-viagem{color:var(--viagem)}
:is(#screen,#drawer) .since{margin:0 0 16px;font-size:13px;color:var(--text);border-left:2px solid var(--forja-line);padding:4px 10px}
:is(#screen,#drawer) .pat-claim{font-size:12px;color:var(--muted);margin:6px 0 0}
:is(#screen,#drawer) .attr{font-size:12px;color:var(--muted);margin:4px 0 0}
:is(#screen,#drawer) .mocknote{margin-top:12px;font-size:12px;color:var(--dim);border:1px dashed var(--border-strong);border-radius:5px;padding:6px 10px;width:fit-content}
:is(#screen,#drawer) .tabtop{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
:is(#screen,#drawer) .tabtop p{margin:0;color:var(--muted);font-size:13px}

/* Insights: reading */
:is(#screen,#drawer) .inflight{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:1px solid var(--forja-line);border-radius:7px;padding:9px 12px;margin-bottom:14px;font-size:13px;background:var(--forja-subtle)}
:is(#screen,#drawer) .inflight.warn{border-color:var(--warning);background:var(--warn-subtle)}
:is(#screen,#drawer) .inflight b{font-weight:600}
:is(#screen,#drawer) .reading{border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:20px 22px;margin-bottom:22px}
:is(#screen,#drawer) .reading.isnew{border-color:var(--forja)}
:is(#screen,#drawer) .seal{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--forja);border:1px solid var(--forja-line);border-radius:4px;padding:2px 8px;font-weight:500}
:is(#screen,#drawer) .seal svg{width:13px;height:13px}
:is(#screen,#drawer) .reading header{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
:is(#screen,#drawer) .reading .when{font-size:12.5px;color:var(--muted)}
:is(#screen,#drawer) .reading h3{font-family:Fraunces,serif;font-weight:600;font-size:21px;margin:12px 0 6px;letter-spacing:-.005em}
:is(#screen,#drawer) .reading .base{color:var(--muted);font-size:13px;margin:0 0 16px;max-width:82ch}
:is(#screen,#drawer) .reading .base b{color:var(--text);font-weight:500}
:is(#screen,#drawer) .pattern{border-top:1px solid var(--border-subtle);padding:14px 0;display:grid;grid-template-columns:minmax(200px,280px) minmax(0,1fr);gap:20px}
:is(#screen,#drawer) .pattern h4{margin:0 0 6px;font-size:14.5px;font-weight:600}
:is(#screen,#drawer) .freqbar{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;font-size:12px;color:var(--muted);margin-top:8px}
:is(#screen,#drawer) .freqbar .bar{height:6px;background:var(--border-subtle);border-radius:3px;overflow:hidden}
:is(#screen,#drawer) .freqbar .bar i{display:block;height:100%;background:var(--forja)}
:is(#screen,#drawer) .freqbar .bar.base i{background:var(--dim)}
:is(#screen,#drawer) .small-n{display:inline-block;margin-top:8px;font-size:12px;color:var(--warning-text);border:1px dashed var(--warning);border-radius:4px;padding:1px 7px}
:is(#screen,#drawer) .ev{list-style:none;margin:0;padding:0;display:grid;gap:6px}
:is(#screen,#drawer) .ev li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:7px 10px;background:var(--sunk);border-radius:5px;border-left:2px solid var(--border-strong)}
:is(#screen,#drawer) .ev q{quotes:"“" "”";font-size:13px}
:is(#screen,#drawer) .ev small{display:block;color:var(--muted);font-size:12px}
:is(#screen,#drawer) .ev .mult{color:var(--text);font-size:13px;text-align:right}
:is(#screen,#drawer) .ev .mult small{text-align:right}
:is(#screen,#drawer) .ev-more{margin-top:6px}
:is(#screen,#drawer) .cant{margin-top:6px;border:1px dashed var(--border-strong);border-radius:6px;padding:12px 14px}
:is(#screen,#drawer) .cant h4{margin:0 0 6px;font-size:13px;font-weight:600}
:is(#screen,#drawer) .cant ul{margin:0;padding-left:18px;color:var(--muted);font-size:13px;display:grid;gap:3px}
:is(#screen,#drawer) .cant b{color:var(--text);font-weight:500}
:is(#screen,#drawer) .reading .acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}

:is(#screen,#drawer) .hist h3{font-size:14px;margin:0 0 8px;font-weight:600}
:is(#screen,#drawer) .hist ol{list-style:none;margin:0;padding:0;border-top:1px solid var(--border-subtle)}
:is(#screen,#drawer) .hist li{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:14px;padding:10px 4px;border-bottom:1px solid var(--border-subtle);align-items:baseline}
:is(#screen,#drawer) .hist .t{font-size:12px;color:var(--muted)}
:is(#screen,#drawer) .hist .what{font-size:13px}
:is(#screen,#drawer) .hist .what small{display:block;color:var(--dim);font-size:12px}
:is(#screen,#drawer) .st{font-size:12px;display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
:is(#screen,#drawer) .st.ok{color:var(--success)}:is(#screen,#drawer) .st.bad{color:var(--danger)}
:is(#screen,#drawer) .st svg{width:13px;height:13px}
:is(#screen,#drawer) .empty{border:1px dashed var(--border-strong);border-radius:8px;padding:22px;color:var(--muted);margin-bottom:20px}
:is(#screen,#drawer) .empty b{color:var(--text);display:block;margin-bottom:4px;font-weight:600}

/* ---------- drawer ---------- */
#drawer{border-left:1px solid var(--border);background:var(--surface);min-height:100%}
:is(#screen,#drawer) .drawer-in{position:sticky;top:0;max-height:100vh;overflow-y:auto;padding:18px 20px 0}
:is(#screen,#drawer) .drawer-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
:is(#screen,#drawer) .drawer-head h3{font-family:Inter,sans-serif;font-weight:600;font-size:17px;margin:0}
:is(#screen,#drawer) .drawer-head h3:focus{outline:none}
:is(#screen,#drawer) .drawer-head .btn.icon{width:32px;min-width:32px;min-height:32px;height:32px;flex:none}
:is(#screen,#drawer) .drawer-head p{margin:3px 0 0;font-size:12.5px;color:var(--muted)}
:is(#screen,#drawer) .machine{margin:14px 0 16px;display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--muted);padding:9px 11px;background:var(--sunk);border-radius:6px}
:is(#screen,#drawer) .machine .dot{margin-top:5px}
:is(#screen,#drawer) .machine b{color:var(--text);font-weight:500}
:is(#screen,#drawer) .backdrop{display:none}

:is(#screen,#drawer) .opts{display:grid;gap:8px;margin:0;padding:0;border:0;min-width:0}
:is(#screen,#drawer) .opts legend{font-size:13px;font-weight:600;margin-bottom:8px;padding:0}
:is(#screen,#drawer) .opt{border:1px solid var(--border);border-radius:7px;padding:12px 12px 12px 40px;position:relative;background:var(--bg)}
:is(#screen,#drawer) .opt:hover{border-color:var(--border-strong)}
:is(#screen,#drawer) .opt input{position:absolute;left:13px;top:15px;accent-color:var(--forja);width:16px;height:16px;margin:0}
:is(#screen,#drawer) .opt label{cursor:pointer;display:block}
:is(#screen,#drawer) .opt.sel{border-color:var(--forja);background:var(--forja-subtle)}
:is(#screen,#drawer) .opt.off{background:var(--sunk)}
:is(#screen,#drawer) .opt.off label{cursor:default}
:is(#screen,#drawer) .opt strong{display:block;font-weight:600;font-size:13.5px}
:is(#screen,#drawer) .opt .desc{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
:is(#screen,#drawer) .opt .meta{display:block;font-size:12px;color:var(--muted);margin:6px 0 0}
:is(#screen,#drawer) .warnline{display:flex;gap:6px;font-size:12px;color:var(--warning-text);margin:6px 0 0}
:is(#screen,#drawer) .warnline svg{width:13px;height:13px;flex:none;margin-top:2px}
:is(#screen,#drawer) .opt .param{display:flex;gap:8px;align-items:center;margin-top:9px;font-size:12px;color:var(--muted)}
:is(#screen,#drawer) .opt .param .seg-ctl button{font-size:12px;padding:0 9px}
:is(#screen,#drawer) .drawer-foot{display:flex;gap:8px;margin-top:14px;align-items:center;flex-wrap:wrap}
:is(#screen,#drawer) .drawer-foot .note{font-size:12px;color:var(--dim);flex-basis:100%}
:is(#screen,#drawer) .drawer-more{margin:22px 0 0;font-size:12.5px;color:var(--muted);border-top:1px solid var(--border-subtle);padding:12px 0 24px}

:is(#screen,#drawer) .confirm{border:1px solid var(--forja);border-radius:8px;padding:14px;background:var(--forja-subtle)}
:is(#screen,#drawer) .confirm h4{margin:0 0 10px;font-size:14.5px;font-weight:600}
:is(#screen,#drawer) .confirm dl{margin:0;display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px 10px;font-size:12.8px}
:is(#screen,#drawer) .confirm dt{color:var(--muted)}
:is(#screen,#drawer) .confirm dd{margin:0;color:var(--text)}

/* progress card — mirrors the Health Coach run card */
:is(#screen,#drawer) .run{border:1px solid var(--border-strong);border-radius:8px;padding:14px;background:var(--bg)}
:is(#screen,#drawer) .run[data-st="done"]{border-color:var(--success)}
:is(#screen,#drawer) .run[data-st="late"],:is(#screen,#drawer) .run[data-st="nomachine"],:is(#screen,#drawer) .run[data-st="retry"],:is(#screen,#drawer) .run[data-st="released"]{border-color:var(--warning)}
:is(#screen,#drawer) .run[data-st="failed"]{border-color:var(--danger)}
:is(#screen,#drawer) .run[data-st="refused"]{border-color:var(--warning);border-style:dashed}
:is(#screen,#drawer) .run-lbl{display:flex;align-items:center;gap:8px;margin:0;font-size:12.5px;color:var(--muted)}
:is(#screen,#drawer) .run-lbl svg{width:14px;height:14px}
:is(#screen,#drawer) .run-lbl .state{margin-left:auto;font-weight:600;font-size:12px;padding:1px 7px;border-radius:4px;background:var(--forja-subtle);color:var(--forja)}
:is(#screen,#drawer) .run[data-st="done"] .state{background:var(--ok-subtle);color:var(--success)}
:is(#screen,#drawer) .run[data-st="late"] .state,:is(#screen,#drawer) .run[data-st="nomachine"] .state,:is(#screen,#drawer) .run[data-st="retry"] .state,:is(#screen,#drawer) .run[data-st="released"] .state,:is(#screen,#drawer) .run[data-st="refused"] .state{background:var(--warn-subtle);color:var(--warning-text)}
:is(#screen,#drawer) .run[data-st="failed"] .state{background:var(--danger-subtle);color:var(--danger)}
:is(#screen,#drawer) .run-what{margin:8px 0 0;font-weight:600;font-size:13.5px}
:is(#screen,#drawer) .run-eta{display:flex;align-items:baseline;gap:8px;margin-top:10px}
:is(#screen,#drawer) .run-eta b{white-space:nowrap;flex:none;font-family:Inter,system-ui,sans-serif;font-size:24px;font-weight:500;letter-spacing:-.02em;line-height:1}
:is(#screen,#drawer) .run-eta span{font-size:12.5px;color:var(--muted)}
:is(#screen,#drawer) .run-tit{margin:10px 0 2px;font-size:13.5px;font-weight:500}
:is(#screen,#drawer) .run-sub{margin:0;font-size:12.5px;color:var(--muted)}
:is(#screen,#drawer) .run-steps{list-style:none;margin:12px 0 0;padding:0}
:is(#screen,#drawer) .run-step{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:2px 8px;font-size:12.5px;padding:5px 0}
:is(#screen,#drawer) .run-step::before{content:"";width:10px;height:10px;border-radius:50%;border:2px solid var(--dim);margin-top:4px;grid-row:span 2;box-sizing:border-box}
:is(#screen,#drawer) .run-step[data-s="feito"]::before{background:var(--success);border-color:var(--success)}
:is(#screen,#drawer) .run-step[data-s="agora"]::before{border-color:var(--forja);background:var(--forja-subtle);animation:pulse 1.6s ease-in-out infinite}
:is(#screen,#drawer) .run-step[data-s="parado"]::before{border-color:var(--warning)}
:is(#screen,#drawer) .run-step[data-s="erro"]::before{background:var(--danger);border-color:var(--danger)}
:is(#screen,#drawer) .run-step b{font-weight:500}
:is(#screen,#drawer) .run-step time,:is(#screen,#drawer) .run-step .tm{font-family:Inter,system-ui,sans-serif;font-size:11.5px;color:var(--muted);text-align:right}
:is(#screen,#drawer) .run-step small{grid-column:2 / 4;color:var(--dim);font-size:12px}
:is(#screen,#drawer) .run-step .sr-state{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:is(#screen,#drawer) .run-acoes{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
:is(#screen,#drawer) .run-acoes .note{font-size:12px;color:var(--dim);flex-basis:100%}
@keyframes pulse{50%{box-shadow:0 0 0 4px var(--forja-subtle)}}

/* the queue clock */
:is(#screen,#drawer) .clock{margin:14px 0 4px;padding:30px 6px 26px;position:relative}
:is(#screen,#drawer) .clock .track{position:relative;height:2px}
:is(#screen,#drawer) .clock .track::before{content:"";position:absolute;inset:0;background:var(--border-strong)}
:is(#screen,#drawer) .clock .tk{position:absolute;top:-6px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
:is(#screen,#drawer) .clock .tk i{width:2px;height:14px;background:var(--dim);display:block}
:is(#screen,#drawer) .clock .tk em{font-style:normal;font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--dim);margin-top:5px;white-space:nowrap}
:is(#screen,#drawer) .clock .tk[data-s="seen"] i{background:var(--success)}
:is(#screen,#drawer) .clock .tk[data-s="busy"] i{background:var(--muted);height:10px;margin-top:2px}
:is(#screen,#drawer) .clock .tk[data-s="busy"] em{color:var(--muted)}
:is(#screen,#drawer) .clock .tk[data-s="next"] i{background:var(--forja);height:18px;margin-top:-2px;width:3px}
:is(#screen,#drawer) .clock .tk[data-s="next"] em{color:var(--forja);font-weight:500}
:is(#screen,#drawer) .clock .tk[data-s="missed"] i{background:var(--warning)}
:is(#screen,#drawer) .clock .tk[data-s="missed"] em{color:var(--warning-text);text-decoration:line-through}
:is(#screen,#drawer) .clock .gapseg{position:absolute;top:-1px;height:4px;border-top:2px dashed var(--warning)}

:is(#screen,#drawer) .btn.status{border-color:var(--forja-line);color:var(--forja);font-weight:500}

:is(#screen,#drawer) .nowrap{white-space:nowrap}
:is(#screen,#drawer) .drawer-foot{position:sticky;bottom:0;background:var(--surface);padding:10px 0 12px;margin-bottom:0;border-top:1px solid var(--border-subtle);z-index:1}
:is(#screen,#drawer) .drawer-note{font-size:12px;color:var(--dim);margin:12px 0 0}

/* drawer em coluna (≥ 1280): o andamento já está à vista, "Ver andamento" sai */
@media (min-width:1280px){ .ch-with-drawer #screen .inflight [data-act="openForja"]{display:none} }

<body>
<div id="screen"><div id="content"></div></div>
<aside class="drawer" id="drawer" hidden></aside>
<script src="dados.js"></script>
<script src="chrome.js"></script>
<script>

/* Moldura do Observatório + fluxo da forja.
   Todos os dados e cálculos vêm de window.OBS (dados.js). Nada de número digitado aqui:
   o que falta na API está em PEDIDOS-API.md. */
const ICON = {
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  anvil:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M3 7h13a5 5 0 0 1-5 5H9v3h6v3H6v-3h1v-3H7A4 4 0 0 1 3 8z"/></svg>',
  warn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  up:'<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 5l8 12H4z"/></svg>',
  down:'<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 19L4 7h16z"/></svg>',
  dash:'<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="10" width="14" height="4"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>',
};
const SEM_MAQUINA = ts=>`Seu pedido das ${OBS.date.hm(ts)} está na fila e roda quando a máquina voltar.`;
const SEM_MAQUINA_N = (ts,ns)=>`Seus pedidos das ${OBS.date.hm(ts)} (${ns.join(' e ')}) estão na fila e rodam quando a máquina voltar.`;
const period = t=>{t=String(t||'').trim();return !t||/[.!?]$/.test(t)?t:t+'.'};
const sentenceCase = t=>{t=String(t||'').trim();return t?t[0].toUpperCase()+t.slice(1):''};
const sentence = t=>{t=String(t||'').trim();if(!t)return '';t=t[0].toUpperCase()+t.slice(1);return /[.!?]$/.test(t)?t:t+'.'};
const esc = s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const D = OBS.date, F = OBS.fmt, FJ = OBS.forja, Q = OBS.forja.queue;
const M = 60e3, HOUR = 36e5, DAY = OBS.DAY;
const hm = D.hm, wdm = ts=>`${D.weekdayShort(ts)} ${D.dm(ts)}`;

/* ============================================================ FILA: tudo de OBS.forja (queue, requestScenario, requests) */
const NOW = OBS.NOW;
const TICK = Q.tickMinutes * M;
const FLOW_STATE = {queued:'na fila',running:'trabalhando',done:'publicado',late:'atrasado',nomachine:'sem máquina',retry:'nova tentativa',released:'liberado pelo vigia',failed:'falhou',refused:'recusado (dado velho)'};
/* ESTADO DE PEDIDOS: um só, no motor (OBS.forja.session, CONVENCOES F9). A moldura não guarda pedido próprio:
   lê session.current(nicho da tela), pede com session.ask(nicho) e cancela com session.cancel(nicho).
   A barra de estados do mockup só define a base (session.setBase(estado)). Trocar de nicho ou de tela não cria nem apaga pedido. */
const SS = FJ.session;
const DEAD = ['falhou','recusado (dado velho)'];
const ACTIVE_ST = ['na fila','trabalhando','atrasado','sem máquina','nova tentativa','liberado pelo vigia'];
/** cenário que a tela mostra: o do nicho da tela (Todos = todos os pedidos) */
/* CONVENCOES F9: a sessão é por (tipo, alvo); toda chamada passa {type}. A moldura pede vários tipos: o painel e o
   cabeçalho acompanham o tipo do último pedido ou do estado escolhido na barra (S.trackType). */
/** tipo acompanhado: o do último pedido/estado escolhido; se ele não tem pedido (cancelado), o mais recente que tenha, senão o da base */
const trackType = ()=>{ const st=SS.state(); const cand=[S.trackType].concat(st.asks.slice().sort((a,b)=>b.seq-a.seq).map(a=>a.type), [st.type]);
  return cand.find(t=>t&&t!=='leitura-video'&&!SS.current('todos',{type:t}).empty) || S.trackType; };
/** B1 (F10): todos os tipos com pedido no nicho da tela, cada um com o próprio cenário; o mais antigo ativo primeiro */
// ordem entre tipos: a fila global do motor (queuePos, F10); sem ela, o pedido ativo mais antigo
const oldestActive = sc=>Math.min(...sc.requests.filter(x=>ACTIVE_ST.includes(x.state)).map(x=>x.queuePos!=null?x.queuePos*1e15:x.createdAt));
/** K2 (F11): pedidos de leitura de vídeo da sessão (feitos no Histórico), um cenário por vídeo, filtrados pelo nicho do vídeo */
function videoScens(niche=S.niche){
  const st=SS.state(), vids=new Set([].concat(st.base!=='sem pedido'&&st.type==='leitura-video'&&st.video?[st.video]:[], (st.asks||[]).filter(a=>a.type==='leitura-video').map(a=>a.video)));
  return [...vids].filter(v=>OBS.video(v)&&(niche==='todos'||OBS.video(v).niche===niche))
    .map(v=>Object.assign(SS.current(null,{type:'leitura-video',video:v}),{type:'leitura-video',video:v})).filter(hasReq);
}
function scens(niche=S.niche){
  const tt=trackType();
  return REQ_TYPES().map(type=>Object.assign(SS.current(niche,{type}),{type})).filter(hasReq).concat(videoScens(niche))
    .sort((a,b)=>(b.anyActive-a.anyActive)||(a.anyActive?oldestActive(a)-oldestActive(b):(b.type===tt)-(a.type===tt)));
}
/** cenário principal (cabeçalho, auditoria): o ativo mais antigo entre os tipos; sem ativo, o do tipo acompanhado */
const cur = ()=>{ const l=scens(); return l.length?l[0]:Object.assign(SS.current(S.niche,{type:trackType()}),{type:trackType()}); };
const shortType = t=>({'padroes-titulo':'Padrões de título','padroes-titulo-shorts':'Padrões de título (Shorts)','temas':'Temas','resumo-trocas':'Resumo das trocas','leitura-video':'Leitura de vídeo'})[t]||typeName(t);
/** nichos do escopo da tela sem pedido ativo em nenhum tipo (CONVENCOES F10: o botão segue habilitado para eles) */
const busyNiche = n=>REQ_TYPES().some(t=>allReqs(t).some(x=>x.niche===n&&ACTIVE_ST.includes(x.state)));
/** tipos que ainda dá para pedir no nicho (mesma regra de session.ask: só o mesmo tipo bloqueia) */
const askableTypes = n=>REQ_TYPES().filter(t=>!blockOf(n,t));
/** K3 (F11): nicho livre = nicho com algum TIPO pedível (por nicho+tipo, regra M8); nicho sem tipo livre não é oferecido */
const freeNiches = ()=>(S.niche==='todos'?['ia','viagem']:[S.niche]).filter(n=>askableTypes(n).length);
const scen = cur;   // nome antigo, usado pela auditoria
const allReqs = (type=trackType())=>{ const a=SS.current('todos',{type}); return a.empty?[]:a.requests.map(x=>Object.assign({type},x)); };
const REQ_TYPES = ()=>[...new Set(TYPES.map(t=>t.id).concat(['padroes-titulo-shorts']))];
const hasReq = sc=>!!(sc&&!sc.empty&&sc.requests&&sc.requests.length);
const activeReq = sc=>(sc.requests||[]).find(x=>ACTIVE_ST.includes(x.state))||sc.request;
const isSplit = sc=>!!(sc&&sc.requests&&sc.requests.length>1);
/** pedido que o card acompanha: o que terminou mal (pede ação), senão o ativo, senão o publicado */
const trackedReq = sc=>(sc.requests||[]).find(x=>DEAD.includes(x.state))||activeReq(sc);
/** publicado + outro ainda ativo (Todos): card próprio com "1 de 2 publicadas" */
const splitDone = (sc=cur())=>hasReq(sc)&&isSplit(sc)&&sc.anyActive&&sc.requests.some(x=>x.state==='publicado')&&!sc.requests.some(x=>DEAD.includes(x.state));
/** pedido publicado na sessão para o nicho (cota usada, leitura nova em Insights) */
const pubReq = (n,type=FJ.readingTypeFor('long'))=>allReqs(type).find(x=>x.state==='publicado'&&x.niche===n&&x.readingId);
const anyPub = ()=>REQ_TYPES().some(t=>allReqs(t).some(x=>x.state==='publicado'));
const STATE_CASE = {'na fila':'queued','trabalhando':'running','publicado':'done','atrasado':'late','sem máquina':'nomachine','nova tentativa':'retry','liberado pelo vigia':'released','falhou':'failed','recusado (dado velho)':'refused'};
const nextPoll = m=>{let t=m.lastPollAt;while(t<=NOW)t+=m.tickMinutes*M;return t};
const pollsBetween = (m,a,b)=>{const out=[];const step=m.tickMinutes*M;let t=m.lastPollAt;while(t>a)t-=step;for(t+=step;t<=b;t+=step)out.push(t);return out};

/* ============================================================ CÓPIA DE INTERFACE POR TIPO DE PEDIDO */
const TYPE_COPY = {
  'padroes-titulo':{desc:'Classifica os títulos dos vídeos longos que estouraram em fórmulas nomeadas, com contagem e exemplos.',
    entrega:`Fórmulas de título com mediana do multiplicador de quem usa vs quem não usa, n dos dois lados, exemplos citados e quem assina. Fórmula com n < ${FJ.rules.pattern.minN} sai como “recorrência observada — pouco para concluir”.`,
    naoFaz:'Não olha thumbnails e não afirma causa.', dados:'títulos e views da última sincronização'},
  'temas':{desc:'Nomeia os assuntos dos vídeos que estouraram e diz se algum domina.',
    entrega:'Temas nomeados, com quantos outliers e canais tocam cada um e exemplos citados.',
    naoFaz:'Não prevê se o tema vai crescer e não afirma por que ele apareceu.', dados:'títulos e descrições dos vídeos longos'},
  'resumo-trocas':{desc:'Agrupa as trocas de título, thumbnail e descrição dos concorrentes.',
    entrega:'Trocas agrupadas por tipo e canal; as com efeito medido (observado vs esperado, n) separadas das que aguardam os 7 dias.',
    naoFaz:'Não julga a thumbnail nova (não vê imagens) e não diz que a troca causou a variação.', dados:'textos antigos e novos e a média de views/dia de cada vídeo trocado'},
};
TYPE_COPY['padroes-titulo-shorts'] = {desc:'Classifica os títulos dos Shorts que estouraram em fórmulas nomeadas, com contagem e exemplos.',
  entrega:`Fórmulas de título dos Shorts com mediana do multiplicador de quem usa vs quem não usa (comparando só Shorts com Shorts), exemplos citados e quem assina. Fórmula com n < ${FJ.rules.pattern.minN} sai como “recorrência observada — pouco para concluir”.`,
  naoFaz:'Não olha thumbnails nem o vídeo, não afirma causa e não mistura Shorts com vídeos longos.', dados:'títulos e views dos Shorts da última sincronização'};
const TYPES = FJ.readingTypes.filter(t=>t.target!=='video'&&!t.shorts);   // Shorts entram pelo formato (readingTypeFor)
const typeOf = id=>FJ.readingTypes.find(t=>t.id===id);
const typeName = id=>typeOf(id).label;

/* ============================================================ STATE */
const NICHES = ['todos','viagem','ia'];
const nicheLabel = n=>n==='todos'?'Todos':OBS.NICHES[n].label;
const S = {
  tab:'mudancas', niche:'todos',
  drawer:false, flow:'choose', mockId:null, trackType:'padroes-titulo', req:'padroes-titulo', reqNiche:'ia', reqFmt:'long',
  pop:null, published:false, toasts:[], focusKey:null
};
const qs = new URLSearchParams(location.search);
/* nicho e tema: o chrome compartilhado lê e grava localStorage['obs-niche'] e ['obs-theme'] (?niche= e ?theme= vencem) */
const store = CHROME.store;
if(['canais','mudancas','outliers','insights'].includes(qs.get('tab'))) S.tab = qs.get('tab');
/** em andamento: algum pedido ativo no cenário da tela */
const isActive = ()=>scens().some(sc=>sc.anyActive);
/** M4 (F11): com Todos e um só nicho livre, o seletor nasce nele (prévias só do nicho livre) */
const reqNicheFor = n=>{ if(n!=='todos'||!isActive()) return n; const f=freeNiches(); return f.length===1?f[0]:n; };
/** nicho que o pedido realmente leva: com Todos e cota usada num nicho, só o outro */
const effNiche = ()=>{ const q=S.reqNiche==='todos'?quotaFor(S.req,'todos'):null; return q&&q.only?q.only:S.reqNiche; };
/** rótulo do que está sendo pedido no seletor/confirmação */
const reqLabel = ()=>{ const n=effNiche(); return `${typeName(S.req)} · ${nicheLabel(n)}${n==='todos'?' · um pedido por nicho':''}`; };
/** rótulo do pedido existente: tipo + nicho, ou Todos quando há um pedido por nicho */
const scLabel = sc=>{ const r=trackedReq(sc); if(sc.type==='leitura-video'){ const v=OBS.video(sc.video); return `Leitura do vídeo “${v?v.title:sc.video}” · ${nicheLabel(r.niche)}`; } return `${typeName(r.type||'padroes-titulo')} · ${isSplit(sc)?'Todos · um pedido por nicho':nicheLabel(r.niche)}`; };
const competitors = ()=>OBS.channels.filter(c=>!c.own);
const syncProblems = ()=>competitors().filter(c=>c.sync.state!=='ok');
const syncText = c=>c.sync.state==='ok'?'ok':c.sync.state==='backfill'?`${c.sync.backfill.done} de ${c.sync.backfill.total} vídeos buscados`:c.sync.msg;
/** link entre telas: sempre OBS.link.*, sem "?" sobrando (o tema vai pelo localStorage) */
const L = CHROME.link;
const nicheParam = ()=>S.niche==='todos'?{}:{niche:S.niche};

/* ============================================================ HEADER */
function machine(){ const sc=cur(); return hasReq(sc)&&sc.machine?sc.machine:{lastPollAt:Q.lastPollAt,alive:true,tickMinutes:Q.tickMinutes}; }
function forjaSeen(){ const m=machine(); return {off:!m.alive,t:m.lastPollAt}; }
function featuredFor(niche){
  const pr=pubReq(niche); if(pr && (pr.type||'padroes-titulo')===FJ.readingTypeFor('long') && FJ.byId[pr.readingId]) return FJ.byId[pr.readingId];
  return FJ.latest(FJ.readingTypeFor('long'), niche);
}
function featured(){ return featuredFor(S.niche==='todos'?'ia':S.niche); }
/** só a aba Insights tem texto próprio (cita a leitura em exibição); as outras usam o texto padrão do chrome */
function coworkText(){
  if(S.tab!=='insights') return null;
  const r = featured();
  return `Leia ${S.niche==='todos'?`as leituras da forja "${featuredFor('ia').text.title}" e "${featuredFor('viagem').text.title}"`:`a leitura da forja "${r.text.title}" (${r.seal})`} via youtube_observatory e proponha 3 títulos para o meu próximo vídeo que sigam só as fórmulas que passam a regra, dizendo de qual exemplo cada um parte. Use o MCP bythiagofigueiredo.`;
}
/* ============================================================ ABAS (links reais para as telas irmãs) */
const TABS = ['canais','mudancas','outliers','insights'];
const TABNAME = {canais:'Canais',mudancas:'Mudanças',outliers:'Outliers',insights:'Insights'};
const TABKEY = {canais:'canais',mudancas:'mud',outliers:'out'};
function means(t){
  const c = OBS.tabCounts(S.niche);
  if(t==='canais') return `<b>${OBS.TAB_TITLES.canais(c.canais)}</b>; ${syncProblems().filter(x=>S.niche==='todos'||x.niche===S.niche).length} com problema de sincronização. Abaixo, uma amostra; a aba completa tem nicho, cadência e ações por canal.`;
  if(t==='mudancas') return `<b>${OBS.TAB_TITLES.mud(c.mud)}</b>. Abaixo, as mais recentes; o efeito sai ${OBS.RULES.effect.afterDays} dias depois de cada troca.`;
  if(t==='outliers') return `<b>${OBS.TAB_TITLES.out(c.out)}</b>, ajustado pela idade.`;
  return `Leituras publicadas pela forja${S.niche==='todos'?'':' para '+nicheLabel(S.niche)}. Cada leitura fica congelada na data dos dados enviados.`;
}

/* ---------- amostras das abas (todas de OBS) ---------- */
function bodyCanais(){
  const list = competitors().filter(c=>S.niche==='todos'||c.niche===S.niche).sort((a,b)=>(b.sync.state!=='ok')-(a.sync.state!=='ok'));
  const rows = list.map(c=>{
    const bad = c.sync.state!=='ok';
    const cell = bad?`<span class="probline">${ICON.warn.replace('<svg','<svg width="12" height="12"')}<span>${esc(c.sync.problemPhrase||c.sync.label)}</span></span>`
      :`<span class="tag"><span class="dot" aria-hidden="true"></span>${c.sync.last>=NOW?'Sincronizado agora':D.dm(c.sync.last)===D.dm(NOW)?'hoje '+hm(c.sync.last):D.dmhm(c.sync.last)}</span>`;   // D5: mesma regra de Canais
    return `<tr><td>${esc(c.name)}</td><td class="nic-${c.niche}">${nicheLabel(c.niche)}</td><td class="n num">${F.subs?F.subs(c.subs):F.num(c.subs)}</td><td>${cell}</td></tr>`;
  }).join('');
  return `<div class="tabtop"><p>Canal novo entra na próxima sincronização (${OBS.SYNC.nextText.replace('próxima às ','')}).</p><a class="btn ${S.drawer?'':'primary'}" href="${L('canais',{add:1})}" data-k="addPrimary">${ICON.plus}Adicionar canal</a></div>

}
const EFF_ICON = {ganhou:['up','up'],perdeu:['down','down']};
function effCell(e){
  const ic = EFF_ICON[e.status];
  const lr = F.labelReason(e.label,e.reason)||'';
  // textos canônicos do motor (CONVENCOES F8 conjunto): readyText (aguardando), noBaseText (n = 0), numbersFlat + "efeito N pp"
  const why = e.waitText?e.waitText   // D4: texto do motor, como vem
    : e.status==='aguardando'&&e.readyText?`${e.collected} de ${OBS.RULES.effect.afterDays} dias coletados · ${e.readyText}`
    : e.noBaseText?e.noBaseText
    : (lr.toLowerCase().startsWith(String(e.label).toLowerCase())?lr.slice(e.label.length):lr).replace(/^\s*[—:.,-]\s*/,'');

  return `<span class="v ${ic?ic[1]:''}">${ic?ICON[ic[0]]:ICON.dash}${esc(e.label)}</span>${nums?`<small class="num">${nums}</small>`:''}${why?`<small>${esc(why)}</small>`:''}${e.willBeInconclusive&&!e.waitText?`<small class="warnline">${ICON.warn}<span>Vai sair inconclusivo: ${esc(F.lcfirst(e.willBeInconclusive))}</span></small>`:''}`;
}

function bodyOut(){

/* ---------- leituras da forja ---------- */
function histList(){
  const reqs = FJ.requests.filter(r=>!r.scenario&&(S.niche==='todos'||r.niche===S.niche)).slice().sort((a,b)=>b.createdAt-a.createdAt);
  const pub = allReqs().filter(r=>(r.state==='publicado'||DEAD.includes(r.state))&&(S.niche==='todos'||r.niche===S.niche));   // pedidos da sessão já terminados
  const items = pub.concat(reqs);
  return `<section class="hist" aria-labelledby="hh"><h3 id="hh">Histórico de pedidos</h3><ol>${items.map(r=>{
    const rd = r.readingId?FJ.byId[r.readingId]:null;
    const ok = r.status==='completed';
    const when = r.publishedAt||r.failedAt||r.refusedAt||r.createdAt;
    return `<li data-request="${r.id}"><span class="t">${D.weekdayShort(when)} <span class="num">${D.dm(when)} ${hm(when)}</span></span><span class="what">${esc(rd?rd.text.title:`${typeName(r.type)} — ${nicheLabel(r.niche)}`)}<small>${esc(sentence(rd?rd.text.lead:(r.failReason||r.refusedReason||'')))}${!ok?' Nada publicado.':''}</small></span>
    <span class="st ${ok?'ok':'bad'}">${ok?ICON.check+'publicada':ICON.x+esc(r.state)}</span></li>`}).join('')}</ol></section>`;
}
function evidenceItem(r,id){
  const b = r.base.videos.find(v=>v.id===id);
  return `<li><span><q>${esc(b.title)}</q><small>${esc(OBS.channel(b.ch).name)}</small></span><span class="mult"><span class="num">${F.mult(b.mult)}</span><small>${esc(b.method)} (n = ${b.n}) em ${D.dm(r.sent.asOf)}</small></span></li>`;
}
function patternBlock(r,p){
  const rules = FJ.rules.pattern;
  const k = p.evidence.length, n = r.analysis.nOutliers;
  const passes = p.verdict.id==='padrao';
  const ev = p.evidence.slice(0,3).map(id=>evidenceItem(r,id)).join('');
  const link = L('outliers',{niche:r.niche,reading:r.id,formula:p.formula});
  const today = OBS.outliers({reading:r.id,formula:p.formula}).count;
  return `<div class="pattern" data-verdict="${p.verdict.id}" data-n="${p.nUse}" data-diff="${p.diff.toFixed(3)}"><div><h4>${esc(p.label)}</h4>
    <div class="freqbar"><span>outliers <span class="num">${k}</span> de <span class="num">${n}</span></span><span class="bar" aria-hidden="true"><i style="width:${Math.round(k/n*100)}%"></i></span></div>
    <p class="pat-claim">${esc(p.verdict.text)}</p>
    ${p.attribution&&p.attribution.text?`<p class="attr">${esc(p.attribution.text)}</p>`:''}
    ${passes?'':`<span class="small-n">${p.verdict.id==='recorrencia'?'pouco para concluir':`não passa a regra (n ≥ ${rules.minN} e diferença ≥ ${F.mult(rules.minDiff)})`}</span>`}</div>
    <div>${k?`<ul class="ev">${ev}</ul><div class="ev-more"><a class="linkbtn" href="${link}">${today?`Ver ${today===1?'o outlier':`os ${today} outliers`} de hoje`:'Ver no Outliers (nenhum hoje)'}</a></div>`:'<p class="muted" style="margin:0;font-size:13px">Nenhum outlier com esta fórmula.</p>'}</div></div>`;
}
function readingCard(r,isNew){
  const since = FJ.since(r.id);
  const ORDER={padrao:0,recorrencia:1,'sem-diferenca':2};
  const shown = r.analysis.patterns.filter(p=>p.evidence.length>0).sort((a,b)=>ORDER[a.verdict.id]-ORDER[b.verdict.id]||b.evidence.length-a.evidence.length);
  const quiet = r.analysis.patterns.filter(p=>!shown.includes(p));
  return `<details class="reading ${isNew?'isnew':''}" data-reading="${r.id}" ${isNew&&S.openRead?'open':''}>
    <summary><span class="sum-s"><span class="seal">${ICON.anvil}${esc(r.seal)}</span>${isNew?'<span class="newmark">nova</span>':''}</span><span class="sum-t">${esc(r.text.title)}</span><span class="sum-l">${esc(r.text.lead)}</span><span class="sum-open">Ver leitura</span></summary>
    <div class="reading-in">
    <!-- I5 (CONVENCOES F9): sob o selo, só o texto literal da leitura (reading.text.*) -->
    <div class="lit">${(r.text.items||[]).length?`<ul class="lit-items">${r.text.items.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:''}${r.text.theme?`<p class="lit-theme">${esc(r.text.theme)}</p>`:''}</div>
    <section class="from-site" aria-labelledby="fs-${r.id}"><h4 class="fs-h" id="fs-${r.id}">Do site</h4>
    <p class="when">Leitura de ${wdm(r.generatedAt)}, ${D.ago(r.generatedAt)}.</p>
    <p class="base">${esc(r.sent.text[0].toUpperCase()+r.sent.text.slice(1))}.</p>
    ${since&&since.text?`<p class="since">${esc(isActive()&&since.textNoAsk?since.textNoAsk:since.text)}</p>`:''}
    ${shown.map(p=>patternBlock(r,p)).join('')}
    ${quiet.length?`<div class="pattern" data-verdict="lista"><div><h4>Sem outlier com a fórmula</h4></div><p class="muted" style="margin:0;font-size:13px">${quiet.map(p=>`${esc(p.label)} (n = ${p.nUse}${p.verdict.id==='recorrencia'?', pouco para concluir':''})`).join(' · ')}.</p></div>`:''}
    <div class="cant"><h4>O que esta leitura não faz</h4><ul>
      <li><b>Não vê thumbnails.</b> O Gemma 12B não lê imagens; padrões de thumbnail ficam com você.</li>
      <li><b>Não afirma causa.</b> Diz onde a fórmula aparece, não que ela fez o vídeo estourar.</li>
      <li><b>Não cria números.</b> Cada contagem e multiplicador foi conferido pelo validador contra os dados enviados.</li>
    </ul></div>
    </section>
    <div class="acts"><a class="btn ghost" href="${L('insights',{niche:r.niche})}">Abrir em Insights</a></div>
  </div></details>${since&&since.shortText?`<p class="since-short">${esc(since.shortText[0].toUpperCase()+since.shortText.slice(1).replace(/\.$/,''))}</p>`:''}`;   // C1: linha recolhida, fora do selo (CONVENCOES F9), some quando a leitura está aberta
}
function inflightBar(){ return scens().filter(sc=>sc.anyActive||sc.requests.some(x=>DEAD.includes(x.state))).map((sc,i)=>inflightOne(sc,i===0)).join(''); }
function inflightOne(sc,anchor){

}
function bodyIns(){
  const ns = S.niche==='todos'?['ia','viagem']:[S.niche];

/* ============================================================ DRAWER */
function clock(c){
  const ticks = c.ticks.map(([p,l,s])=>`<span class="tk" data-s="${s||''}" style="left:${p}%"><i></i><em ${s==='next'||!s?'data-future':''}>${l}</em></span>`).join('');
  // rótulos de eventos próximos (< 18 %) sobem um degrau para não encavalar
  const sorted=(c.ev||[]).slice().sort((a,b)=>a[0]-b[0]); let prev=-99, stacked=false;
  const evs = sorted.map(([p,l,cl])=>{const hi=p-prev<18; prev=hi?-99:p; if(hi) stacked=true; return `<span class="evt ${cl||''} ${hi?'hi':''}" style="left:${p}%">${l}</span>`}).join('');
  const fill = c.fill?`<span class="fill ${c.fill[2]||''}" style="left:${c.fill[0]}%;width:${c.fill[1]-c.fill[0]}%"></span>`:'';
  const gap = c.gap?`<span class="gapseg" style="left:${c.gap[0]}%;width:${c.gap[1]-c.gap[0]}%"></span>`:'';
  return `<div class="clock ${stacked?'stacked':''}" role="img" aria-label="${c.aria}"><div class="track">${fill}${gap}${ticks}${evs}</div></div><p class="clock-cap">${c.cap}</p>`;
}
const linear = (a,b)=>t=>+(((t-a)/(b-a))*100).toFixed(2);
const INSIDE = 'lê os dados enviados à forja, o Gemma escreve, o validador confere cada número citado';
function step(s,title,time,note){
  const srs = {feito:'concluído',agora:'em andamento',proximo:'aguardando',pendente:'pendente',erro:'com erro',parado:'parado'}[s];
  return `<li class="run-step" data-s="${s}"><b>${title}<span class="sr"> (${srs})</span></b>${time?`<span class="tm ${/^\d/.test(time)?'num':''}">${time}</span>`:'<span></span>'}${note?`<small>${note}</small>`:''}</li>`;
}
/** um bloco por tipo com pedido no nicho (B1, F10) */
/** B2 (F10): legenda do atraso só com dado real: ocupada com <busyWith>, ou atrás do pedido de outro nicho; sem os dois, só o fato */
function lateCap(sc,r){
  const ahead = r.behind?(sc.requests||[]).find(x=>x.id===r.behind):null;
  const why = r.busyWith?`A forja está ocupada com ${esc(r.busyWith)}; `:ahead?`O pedido de ${nicheLabel(ahead.niche)} está à frente; `:'';
  return `${why}${why?'c':'C'}onsultou a fila nesses horários sem pegar este pedido.`;
}
function runCards(){ return scens().map(runCard).join(''); }
function runCard(sc){
  // o card acompanha o pedido no estado mostrado (Todos recusado: o de IA); num cenário composto, o novo pedido ativo
  if(!hasReq(sc)) return '';
  const r = trackedReq(sc), m = sc.machine, NP = m.alive?nextPoll(m):null, kase = splitDone(sc)?'doneTodos':STATE_CASE[r.state];
  const what = scLabel(sc);
  const label = st=>`<p class="run-lbl">${ICON.anvil}Leitura pedida<span class="state">${esc(st)}</span></p><p class="run-what">${what}</p>`;
  // pedido dividido (Todos): uma linha por nicho, do motor (CONVENCOES F8); a frase completa segue no run-tit
  const others = isSplit(sc)&&sc.statusLines?`<ul class="run-lines">${sc.statusLines.map(l=>`<li>${esc(l)}</li>`).join('')}</ul>`:'';
  const nAct = (sc.requests||[sc.request]).filter(x=>ACTIVE_ST.includes(x.state)).length;
  const cancel = `<button class="btn ghost" type="button" data-act="cancelReq" data-type="${sc.type}"${sc.video?` data-video="${sc.video}"`:''}>${nAct>1?'Cancelar pedidos':'Cancelar pedido'}</button>`;
  // "Pedir nova" nunca habilitado com pedido ativo (de qualquer tipo) no nicho que terminou mal
  const deadNs = sc.requests.filter(x=>DEAD.includes(x.state)).map(x=>x.niche);
  const busyN = deadNs.filter(n=>blockOf(n,sc.type));   // F11 M8: só o mesmo tipo bloqueia
  const again = `<button class="btn forja-solid" type="button" data-act="again" data-type="${sc.type}"${sc.video?` data-video="${sc.video}"`:''} data-k="again"${busyN.length?` disabled aria-describedby="again-why-${sc.type}"`:''}>Pedir nova leitura à forja</button>${busyN.length?`<span class="note" id="again-why-${sc.type}">Já há um pedido deste tipo para ${busyN.map(nicheLabel).join(' e ')}; peça de novo quando ele terminar.</span>`:''}`;
  const um = timingFor(r.type||'padroes-titulo', sc.requests.filter(x=>ACTIVE_ST.includes(x.state)).map(x=>x.niche));
  const created = step('feito','Pedido registrado',hm(r.createdAt));
  switch(kase){
  case 'queued':{ const x=linear(m.lastPollAt-2*M,NP+TICK+2*M);
    return `<section class="run" data-st="queued">${label(r.state)}${others}
    <div class="run-eta"><b data-future>${hm(NP)}</b><span>próxima consulta da forja; ${um}</span></div>
    ${clock({aria:`Pedido às ${hm(r.createdAt)}; próxima consulta às ${hm(NP)}`,ticks:[[x(m.lastPollAt),hm(m.lastPollAt),'seen'],[x(NP),hm(NP),'next'],[x(NP+TICK),hm(NP+TICK),'']],ev:[[x(r.createdAt),'pedido '+hm(r.createdAt)]],fill:[x(r.createdAt),x(NP)],cap:`A forja consulta a fila a cada ${m.tickMinutes} minutos.`})}
    <p class="run-tit">${esc(period(sc.statusText))}</p>
    <p class="run-sub">Você pode fechar este painel ou sair da página; o pedido continua.</p>
    <ol class="run-steps">${created}${step('proximo','A forja pega o pedido')}${step('pendente','Leitura publicada','',INSIDE)}</ol>
    <div class="run-acoes">${cancel}</div></section>`;}
  case 'running': return `<section class="run" data-st="running">${label(r.state)}${others}
    <div class="run-eta"><b>${Math.round((NOW-r.startedAt)/M)} min</b><span>trabalhando; ${um}</span></div>
    <p class="run-tit">${esc(period(sc.statusText))}</p>
    <p class="run-sub">Lendo os dados enviados, classificando com o Gemma e conferindo cada número antes de publicar.</p>
    <ol class="run-steps">${created}${step('feito','A forja pegou',hm(r.claimedAt))}${step('agora','Leitura publicada','',INSIDE)}</ol></section>`;
  case 'doneTodos':{ const pubN=(sc.requests.find(x=>x.state==='publicado')||{}).niche, restN=sc.requests.filter(x=>x.state!=='publicado').map(x=>nicheLabel(x.niche)).join(' e ');
    return `<section class="run" data-st="running">${label('pedido em andamento')}${others}
    <div class="run-eta"><b>${sc.requests.filter(x=>x.state==='publicado').length} de ${sc.requests.length}</b><span>leituras publicadas; ${um}</span></div>
    <p class="run-tit">${esc(period(sc.statusText))}</p>
    <p class="run-sub">A leitura de ${nicheLabel(pubN)} já está em Insights; a de ${restN} sai quando a forja terminar.</p>
    <div class="run-acoes"><button class="btn forja-solid" type="button" data-act="goInsights" data-k="goRead">Ir até a leitura de ${nicheLabel(pubN)}</button></div></section>`;}
  case 'done': return `<section class="run" data-st="done">${label(r.state)}${others}
    <div class="run-eta"><b aria-hidden="true">✓</b><span>em ${Math.round((r.publishedAt-r.createdAt)/M)} min, do pedido à publicação</span></div>
    <p class="run-tit">${esc(period(sc.statusText))}</p>
    <p class="run-sub">Está na aba Insights.</p>
    <ol class="run-steps">${created}${step('feito','A forja pegou',hm(r.claimedAt))}${step('feito','Publicada',hm(r.publishedAt))}</ol>
    <div class="run-acoes"><button class="btn forja-solid" type="button" data-act="goInsights" data-k="goRead">Ir até a leitura</button>${freeNiches().length?'<button class="btn ghost" type="button" data-act="openForja" data-k="another">Pedir outra leitura</button>':''}</div></section>`;
  case 'late':{ const busy=pollsBetween(m,r.createdAt,NOW); const x=linear(r.createdAt-6*M,NP+3*M);
    return `<section class="run" data-st="late">${label(r.state)}${others}
    <div class="run-eta"><b>${r.waitingMinutes} min</b><span>na fila; o limite é ${Q.LATE_AFTER_MINUTES} min</span></div>
    ${clock({aria:`Pedido às ${hm(r.createdAt)}; a forja consultou a fila às ${busy.map(hm).join(', ')} sem pegar este pedido; próxima às ${hm(NP)}`,ticks:[...busy.map(t=>[x(t),hm(t),'busy']),[x(NP),hm(NP),'next']],ev:[[x(r.createdAt),'pedido '+hm(r.createdAt)]],fill:[x(r.createdAt),x(NOW),'late'],cap:lateCap(sc,r)})}
    <p class="run-tit">${esc(period(sc.statusText))}</p>
    <p class="run-sub">Fica na fila até a forja ficar livre.</p>
    <ol class="run-steps">${created}${step('parado','A forja pega o pedido','aguardando')}${step('pendente','Leitura publicada')}</ol>
    <div class="run-acoes">${cancel}</div></section>`;}
  case 'nomachine':{ const mis=pollsBetween(m,m.lastPollAt,NOW); const x=linear(m.lastPollAt-4*M,NOW+6*M);
    return `<section class="run" data-st="nomachine">${label(r.state)}${others}
    <div class="run-eta"><b>${D.dur(NOW-m.lastPollAt,true)}</b><span>sem consulta da forja</span></div>
    ${clock({aria:`Última consulta da forja às ${hm(m.lastPollAt)}; ${mis.length} consultas perdidas; pedido às ${hm(r.createdAt)}; sem previsão`,ticks:[[x(m.lastPollAt),hm(m.lastPollAt),'seen'],...mis.map(t=>[x(t),'','missed'])],ev:[[x(r.createdAt),'pedido '+hm(r.createdAt)],[x(NOW),'agora','now']],fill:[x(m.lastPollAt),x(NOW),'late'],cap:`${mis.length} consultas perdidas desde a última. Sem previsão: volta quando a máquina consultar a fila.`})}
