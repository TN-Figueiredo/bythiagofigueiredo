<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Histórico do vídeo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="chrome.css">
<style>
/* histórico: só tokens desta tela; base, tema e chrome vêm de chrome.css */
#screen{
  --well:#181511; --forja-solid:#5CC3B2; --utm:#f59e0b;
  --t-title:#60A5FA; --t-thumb:#A78BFA; --t-desc:#22D3EE;
  --t-title-a:rgba(96,165,250,.16); --t-desc-a:rgba(34,211,238,.14);
  --ins-bg:rgba(34,197,94,.16); --ins-fg:#86EFAC; --del-bg:rgba(242,107,107,.14); --del-fg:#FCA5A5;
  --curve:#F5EFE6; --curve-fill:rgba(245,239,230,.07); --grid:#2A251F; --shadow-pop:0 12px 32px rgba(0,0,0,.45);
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]) #screen{
  --well:#F2EBDF; --forja-solid:#17695C; --utm:#8A3F06;
  --t-title:#1D4ED8; --t-thumb:#6D28D9; --t-desc:#0E7490; --t-title-a:rgba(29,78,216,.10); --t-desc-a:rgba(14,116,144,.10);
  --ins-bg:rgba(17,105,47,.12); --ins-fg:#11692F; --del-bg:rgba(180,35,24,.10); --del-fg:#B42318;
  --curve:#231C14; --curve-fill:rgba(35,28,20,.06); --grid:#E8DFCF; --shadow-pop:0 12px 28px rgba(60,40,10,.16);
}}
:root[data-theme="light"] #screen{
  --well:#F2EBDF; --forja-solid:#17695C; --utm:#8A3F06;
  --t-title:#1D4ED8; --t-thumb:#6D28D9; --t-desc:#0E7490; --t-title-a:rgba(29,78,216,.10); --t-desc-a:rgba(14,116,144,.10);
  --ins-bg:rgba(17,105,47,.12); --ins-fg:#11692F; --del-bg:rgba(180,35,24,.10); --del-fg:#B42318;
  --curve:#231C14; --curve-fill:rgba(35,28,20,.06); --grid:#E8DFCF; --shadow-pop:0 12px 28px rgba(60,40,10,.16);
}
#screen button{font:inherit;color:inherit}
#screen a{color:inherit}
#screen .mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
#screen :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
#screen [hidden]{display:none!important}
#screen .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#screen .page{max-width:1240px;margin:0 auto;padding:0 0 64px}


#screen .crumbs{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:8px}
#screen .crumbs ol{display:flex;gap:6px;list-style:none;margin:0;padding:0;flex-wrap:wrap}
#screen .crumbs li{display:flex;align-items:center;min-height:32px}
#screen .crumbs li+li::before{content:"/";margin-right:6px;color:var(--dim)}
#screen .crumbs a{text-decoration:none;display:inline-flex;align-items:center;min-height:32px}#screen .crumbs a:hover{color:var(--text)}
#screen .tz{color:var(--dim);font-size:12.5px}
#screen .pager{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
#screen .pager span{padding:0 6px;color:var(--dim);font-size:12.5px}
#screen .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:34px;padding:0 13px;border-radius:6px;border:1px solid var(--border-strong);background:var(--surface);cursor:pointer;font-size:13px;font-weight:500;text-decoration:none;white-space:nowrap}
#screen .btn:hover{background:var(--surface-2)}
#screen .btn svg{width:15px;height:15px;flex:none}
#screen .btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
#screen .btn.ghost:hover{color:var(--text);background:var(--surface)}
#screen .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
#screen .btn.primary:hover{background:var(--accent-hover)}
#screen .btn.forja-solid{background:var(--forja-solid);border-color:var(--forja-solid);color:var(--on-forja);font-weight:600}
#screen .btn.forja-solid:hover{filter:brightness(1.06)}
#screen .btn.forja-solid[aria-disabled="true"]{background:transparent;color:var(--muted);border-style:dashed;border-color:var(--border-strong);cursor:not-allowed}
#screen .btn.pending{border-style:dashed;color:var(--muted);cursor:default;background:transparent}
#screen .btn.pending .st{color:var(--forja);font-weight:600}
#screen .btn[aria-pressed="true"]{border-color:var(--success);color:var(--success)}

#screen .vhead{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:start;margin-bottom:8px}
#screen .vhead .cur{width:176px}
#screen .vhead h2{font-family:Inter,sans-serif;font-weight:700;font-size:21px;line-height:1.2;margin:2px 0 4px;letter-spacing:-.015em;max-width:40ch;text-wrap:balance}
#screen .chan{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
#screen .chan .av{width:22px;height:22px;border-radius:6px;background:#3B2F8F;display:grid;place-items:center;font-size:9.5px;font-weight:700;color:#fff}
#screen .chan .niche{font-size:11.5px;padding:1px 7px;border-radius:999px;border:1px solid var(--border-strong)}
#screen .facts{display:flex;flex-wrap:wrap;gap:2px 18px;margin-top:4px;font-size:12.5px;color:var(--muted)}
#screen .facts b{color:var(--text);font-weight:500}
#screen .counts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
#screen .count{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--border)}
#screen .count i{width:7px;height:7px;border-radius:2px}
#screen .actions{display:flex;flex-direction:column;gap:6px;align-items:stretch;min-width:330px}
#screen .multl{font-size:12.5px;color:var(--muted);align-self:center;margin-left:6px}
#screen .arow{display:flex;gap:8px}
#screen .arow > .btn{flex:1}

#screen .th{position:relative;aspect-ratio:16/9;border-radius:6px;overflow:hidden;isolation:isolate;container-type:inline-size;background:#222}
#screen .th .sil{position:absolute;bottom:0;width:30cqw;height:46cqw}
#screen .th .sil::before{content:"";position:absolute;left:24%;top:0;width:52%;aspect-ratio:1;border-radius:50%;background:var(--sc)}
#screen .th .sil::after{content:"";position:absolute;left:0;bottom:0;width:100%;height:44%;border-radius:50% 50% 0 0/70% 70% 0 0;background:var(--sc)}
#screen .th .tx{position:absolute;font:900 11cqw/0.92 Inter,sans-serif;letter-spacing:-.02em;text-transform:uppercase;color:#fff}
#screen .th .bd{position:absolute;font:800 6cqw/1 Inter,sans-serif;padding:1.2cqw 2.4cqw;border-radius:1.5cqw}
#screen .th.missing{background:repeating-linear-gradient(135deg,var(--surface) 0 8px,var(--well) 8px 16px);border:1px dashed var(--border-strong);display:grid;place-items:center;text-align:center;color:var(--muted);padding:4%;line-height:1.25}
#screen .th.missing span{font-size:max(10px,6.5cqw)}
#screen .lane .th.missing span{display:none}
#screen .th .dur{position:absolute;right:2cqw;bottom:2cqw;background:rgba(0,0,0,.8);color:#fff;font:500 max(8px,4.6cqw)/1 "JetBrains Mono",monospace;padding:.8cqw 1.4cqw;border-radius:1cqw}

#screen .card{background:var(--surface);border:1px solid var(--border);border-radius:8px}
#screen .sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:6px 12px;flex-wrap:wrap;margin:0 0 4px}
#screen .sec-h h3{font-size:15px;font-weight:600;margin:0}
#screen .src{font-size:12px;color:var(--dim)}
#screen .src b{font-weight:500;color:var(--muted)}

#screen .timeline{padding:6px 20px 12px;margin-bottom:16px}
#screen .tl-wrap{position:relative;margin-top:4px}
#screen #chart{display:block;width:100%;height:200px;overflow:visible;position:relative;z-index:1}
#screen #chart text{paint-order:stroke;stroke:var(--surface);stroke-width:7px;stroke-linejoin:round;font:11px "JetBrains Mono",monospace;fill:var(--dim)}
#screen #chart .vl{font:500 11px "JetBrains Mono",monospace;fill:var(--muted)}
#screen #chart .note{font:12px Inter,sans-serif;fill:var(--dim)}
#screen .lanes{position:relative;margin-top:4px;z-index:1}
#screen .lane-axis{position:relative;height:22px;font:11px "JetBrains Mono",monospace;color:var(--dim)}
#screen .lane-axis span{position:absolute;top:4px;transform:translateX(-50%);white-space:nowrap}
#screen .lane-axis span:first-child{transform:none}
#screen .lane-axis span:last-child{transform:translateX(-100%)}
#screen .lane{position:relative;height:47px;border-top:1px solid var(--border-subtle)}
#screen .lane.thumbs{height:54px}
#screen .lane-l{position:absolute;left:0;top:12px;bottom:2px;width:84px;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
#screen .lane-l i{width:8px;height:8px;border-radius:2px;flex:none}
#screen .clip{position:absolute;top:12px;bottom:2px;border-radius:4px;background:var(--well);border:1px solid var(--border);overflow:hidden;display:flex;align-items:center;gap:6px;padding:0 8px;font-size:12px;color:var(--muted);white-space:nowrap;cursor:pointer;text-align:left;transition:border-color .15s,background .15s}
#screen .clip .vid{font:600 11px "JetBrains Mono",monospace;color:var(--text);flex:none}
#screen .clip .tt{overflow:hidden;text-overflow:ellipsis;min-width:0}
#screen .clip.cur{border-color:var(--border-strong)}
#screen .lane.thumbs .clip{padding:0 6px 0 0}
#screen .lane.thumbs .clip .th{height:100%;flex:none;border-radius:3px 0 0 3px}
#screen .lane.thumbs .clip.narrow{padding:0;justify-content:center}
#screen .clip.tiny{padding:0;justify-content:center;background:transparent;border-color:transparent;overflow:visible;z-index:2}
#screen .clip.tiny .bar{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);width:var(--bw);border-radius:3px;background:var(--well);border:1px solid var(--border-strong)}
#screen .clip.tiny .vid{position:relative}
#screen .clip.tiny.is-hl{border:0;background:transparent}
#screen .clip.tiny.is-hl .bar{border:2px solid var(--hl)}
#screen .ret{font-size:11px;color:var(--t-thumb)}
#screen .clip.is-hl{border:2px solid var(--hl);background:var(--surface-2);color:var(--text)}
#screen .lane .pre{position:absolute;top:12px;bottom:2px;border:1px dashed var(--border-strong);border-radius:4px;background:repeating-linear-gradient(135deg,transparent 0 6px,var(--border-subtle) 6px 8px);display:flex;align-items:center;padding:0 8px;font-size:12px;color:var(--muted);overflow:hidden;white-space:nowrap}
#screen .lane .pre span{background:var(--surface);padding:0 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
#screen .lane .stale{position:absolute;top:12px;bottom:2px;border:1px dashed var(--border-strong);border-radius:4px;background:repeating-linear-gradient(135deg,transparent 0 6px,var(--border-subtle) 6px 8px);z-index:1}
#screen .lane .win{position:absolute;top:12px;bottom:2px;border-left:1px dashed var(--c);border-right:1px dashed var(--c);background:var(--wa)}
#screen .mk{position:absolute;top:-4px;width:32px;height:32px;margin-left:-16px;border:0;background:transparent;padding:0;cursor:pointer;z-index:3;display:grid;place-items:center}
#screen .mk span{width:22px;height:22px;border-radius:50%;border:2px solid var(--c);background:var(--surface);display:grid;place-items:center;color:var(--c)}
#screen .mk svg{width:11px;height:11px}
#screen .mk:hover span,#screen .mk:focus-visible span,#screen .mk.on span{background:var(--c);color:var(--surface)}
#screen .vlines{position:absolute;left:0;right:0;bottom:0;top:0;pointer-events:none;z-index:0}
#screen .vline{position:absolute;top:0;bottom:0;width:0;border-left:1px dashed var(--c);opacity:.55}
#screen .vband{position:absolute;top:0;bottom:0;background:var(--wa);border-inline:1px dashed var(--c)}
#screen .vline.on{opacity:1;border-left-style:solid}
#screen .vband.on{border-inline-style:solid}
#screen .tip{position:absolute;z-index:10;width:310px;max-width:calc(100% - 8px);background:var(--surface);border:1px solid var(--border-strong);border-radius:8px;box-shadow:var(--shadow-pop);padding:12px 14px;font-size:12.5px;pointer-events:none;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
#screen .tip.show{opacity:1;transform:none}
#screen .tip h4{margin:0 0 2px;font-size:12px;font-weight:600;color:var(--c)}
#screen .tip .when{color:var(--muted);margin:0 0 6px}
#screen .tip .bef{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--del-fg)}
#screen .tip .aft{color:var(--text);margin-top:3px}
#screen .tip .thpair{display:grid;grid-template-columns:1fr 18px 1fr;align-items:center;gap:6px;color:var(--dim)}
#screen .legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;font-size:12px;color:var(--muted)}
#screen .legend > span{display:inline-flex;align-items:center;gap:6px}
#screen .sw{display:inline-block;width:18px;height:0;border-top:2px solid var(--curve)}
#screen .sw.shade{width:14px;height:10px;background:var(--text);opacity:.18}
#screen .sw.dash{border-top:2px dashed var(--muted)}
#screen .sw.hatch{height:10px;border:1px solid var(--border-strong);background:repeating-linear-gradient(135deg,transparent 0 3px,var(--border-strong) 3px 4px)}
#screen .sw.swwin{width:14px;height:10px;border:1px dashed var(--t-title);background:var(--t-title-a)}
#screen .empty-chart{display:grid;place-items:center;min-height:180px;border:1px dashed var(--border-strong);border-radius:6px;text-align:center;color:var(--muted);font-size:13px;padding:20px}
#screen .empty-chart strong{display:block;color:var(--text);font-weight:600;margin-bottom:4px}
#screen details.data{margin-top:10px;font-size:12px;color:var(--dim)}
#screen details.data summary{cursor:pointer;width:max-content;min-height:32px;display:flex;align-items:center}
#screen details.data .tw{overflow-x:auto}
#screen details.data table{border-collapse:collapse;margin-top:6px}
#screen details.data td,#screen details.data th{padding:3px 14px 3px 0;text-align:left;font-weight:400;white-space:nowrap}
#screen details.data th{color:var(--muted)}
#screen details.data td{color:var(--text)}

#screen .compare{padding:18px 20px;margin-bottom:16px}
#screen .pairs{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 16px}
#screen .pair{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--border-strong);background:transparent;cursor:pointer;font-size:12.5px;color:var(--muted)}
#screen .pair svg{width:13px;height:13px;flex:none}
#screen .pair[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
#screen .ba{display:grid;grid-template-columns:minmax(0,1fr) 28px minmax(0,1fr);gap:12px;align-items:center;margin-bottom:18px}
#screen .ba .side{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;align-items:center;padding:10px;border-radius:6px;background:var(--well);border:1px solid var(--border-subtle)}
#screen .ba .side.solo{grid-template-columns:minmax(0,1fr)}
#screen .ba .lbl{font-size:11.5px;color:var(--dim);margin-bottom:2px}
#screen .ba .ttl{font-size:14px;line-height:1.35}
#screen .ba .arr{color:var(--dim);font-size:20px;text-align:center}
#screen .cmp{display:grid;grid-template-columns:minmax(240px,1fr) minmax(0,1.4fr);gap:28px;align-items:start}
#screen .big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
#screen .big .n{font:500 28px/1 "JetBrains Mono",monospace;letter-spacing:-.02em}
#screen .big .arr{color:var(--dim);font-size:20px}
#screen .big .u{font-size:12px;color:var(--dim)}
#screen .cmp .what{font-size:13px;color:var(--muted);margin:0 0 10px}
#screen .cmp .what b{color:var(--text);font-weight:500}
#screen .vd{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;border:1px solid var(--border-strong);margin-top:10px}
#screen .vd svg{width:14px;height:14px}
#screen .verdict{font-size:14px;line-height:1.55;margin:0 0 10px;max-width:62ch}
#screen .verdict strong{font-weight:600}
#screen .scale{position:relative;height:58px;margin:6px 0 2px}
#screen .scale .axis{position:absolute;left:0;right:0;top:28px;height:1px;background:var(--border-strong)}
#screen .scale .iqr{position:absolute;top:20px;height:16px;background:var(--border);border:1px solid var(--border-strong);border-radius:3px}
#screen .scale .med{position:absolute;top:14px;height:28px;width:0;border-left:2px dashed var(--muted)}
#screen .scale .obs{position:absolute;top:21px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--text);border:3px solid var(--surface)}
#screen .scale .lbr{text-align:right}
@media (max-width:640px){#screen .scale .lbr{display:none}}
#screen .scale .lb{position:absolute;font:11px "JetBrains Mono",monospace;color:var(--dim);white-space:nowrap}
#screen .caveats{margin:10px 0 0;padding:0;list-style:none;font-size:12.5px;color:var(--muted)}
#screen .caveats li{display:flex;gap:8px;padding:3px 0}
#screen .caveats svg{width:14px;height:14px;flex:none;margin-top:3px;color:var(--warning-text)}
#screen .nobase{padding:14px 16px;border:1px dashed var(--border-strong);border-radius:6px;color:var(--muted);font-size:13.5px;max-width:76ch}
#screen .nobase strong{color:var(--text);font-weight:600;display:block;margin-bottom:2px}

#screen .forja{padding:16px 20px;margin-bottom:16px;border-left:3px solid var(--forja)}
#screen .forja .fh{display:flex;justify-content:space-between;gap:10px 16px;align-items:center;flex-wrap:wrap}
#screen .forja .fh h3{margin:0;font-size:15px;font-weight:600}
#screen .state{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid var(--forja-line);color:var(--forja);background:var(--forja-subtle)}
#screen .state.warn{color:var(--warning-text);border-color:var(--warning-text);background:transparent}
#screen .state.bad{color:var(--danger);border-color:var(--danger);background:transparent}
#screen .forja p.ex{margin:6px 0 0;color:var(--muted);font-size:13px;max-width:80ch}
#screen .steps{display:flex;align-items:center;font-size:12px;color:var(--dim);margin-top:10px;flex-wrap:wrap;gap:4px 0}
#screen .steps span{display:inline-flex;align-items:center;gap:6px}
#screen .steps span+span::before{content:"";width:22px;height:1px;background:var(--border-strong);margin:0 8px}
#screen .steps .dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--dim)}
#screen .steps .done .dot{background:var(--forja);border-color:var(--forja)}
#screen .steps .now{color:var(--text);font-weight:500}
#screen .steps .now .dot{border-color:var(--forja);background:var(--forja);animation:hv-pulse 1.6s ease-in-out infinite}
@keyframes hv-pulse{50%{transform:scale(.6)}}
#screen .seal{display:inline-flex;gap:6px;align-items:center;font-size:11.5px;color:var(--forja);border:1px solid var(--forja-line);background:var(--forja-subtle);border-radius:999px;padding:1px 9px}
#screen .reading{margin-top:14px;padding-top:12px;border-top:1px solid var(--border-subtle)}
#screen .since-short{margin:4px 0 0}
#screen .lit{margin:0 0 12px}
#screen .from-site{border-top:1px dashed var(--border-strong);padding-top:10px;margin-top:10px}
#screen .from-site .fs-h{margin:0 0 6px;font:600 11px/1.4 Inter,system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
#screen .from-site ul{margin:6px 0 0;padding-left:20px;font-family:Inter,sans-serif;font-size:13px;line-height:1.5}
#screen .from-site a{display:inline-flex;align-items:center;min-height:32px;color:var(--forja);font-size:12.5px;font-weight:500}
#screen .from-site.nb{margin-top:14px}
#screen .rh .rlead{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60ch;min-width:0}
#screen .reading .rh{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
#screen .reading .body{font-family:Fraunces,serif;font-size:16px;line-height:1.6;max-width:70ch;margin:10px 0 0}
#screen .reading ul{margin:8px 0 0;padding-left:20px;font-family:Fraunces,serif;font-size:15px;line-height:1.55;max-width:70ch}
#screen .reading li{margin:3px 0}
#screen .reading a{display:inline-flex;align-items:center;min-height:32px;color:var(--forja);font-family:Inter,sans-serif;font-size:12.5px;font-weight:500}
#screen .f-actions{display:flex;gap:8px;flex-wrap:wrap}

#screen .versions{padding:18px 20px;margin-bottom:16px}
#screen .film{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:14px}
#screen .fcard{border-radius:6px;padding:8px;border:1px solid transparent;transition:border-color .15s,background .15s}

<script>
/* Histórico do vídeo — tudo vem de window.OBS (dados.js). Aqui só há apresentação e derivações da série do vídeo. */
const D=OBS.date, F=OBS.fmt, S03=OBS.date.dm(OBS.SERIES_START), dmhmY=ms=>D.dmOrDmy(ms)+' '+D.hm(ms), MINUS='−', H_MS=3600e3, DAY=24*H_MS;

/* ===================== ícones ===================== */
const IC = {

  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1 1 0 0 1 1-1h10"/></svg>',
  neutro:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 9h14M5 15h14"/></svg>',
  ganhou:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="m5 15 7-7 7 7"/></svg>',
  perdeu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="m5 9 7 7 7-7"/></svg>',
  inconclusivo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6M12 17h.01"/></svg>',
  aguardando:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  'sem-serie':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg>',
};
IC['sem-antes']=IC['sem-serie'];
const TYPE = {title:{c:'var(--t-title)',a:'var(--t-title-a)',n:'Título'},thumb:{c:'var(--t-thumb)',a:'transparent',n:'Thumbnail'},desc:{c:'var(--t-desc)',a:'var(--t-desc-a)',n:'Descrição'}};
const NICHE={ia:'IA',viagem:'Viagem'};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* ===================== thumbnail placeholder a partir de OBS art ===================== */
function art(a, opts={}){
  if(!a||opts.missing) return `<div class="th missing"><span>${opts.missingText||'Imagem não registrada'}</span></div>`;
  const words=String(a.text).split(/\s+/), lines=[]; let cur='';
  words.forEach(w=>{if((cur+' '+w).trim().length>8&&cur){lines.push(cur);cur=w}else cur=(cur+' '+w).trim()}); if(cur) lines.push(cur);
  const longest=Math.max(...lines.map(l=>l.length)), fs=Math.min(13,Math.floor(50/(longest*0.7)*10)/10), right=a.face!=='l';
  const dur=opts.dur?`<span class="dur">${opts.dur}</span>`:'';
  return `<div class="th" style="background:linear-gradient(90deg,${a.bg} 0 62%,${a.fg} 62% 100%)"><div class="sil" style="${right?'right:3cqw':'left:3cqw'};--sc:rgba(0,0,0,.55)"></div><div class="tx" style="${right?'left:5cqw':'right:5cqw;text-align:right'};top:${lines.length>2?10:14}cqw;color:${a.ink};font-size:${fs}cqw">${lines.map(esc).join('<br>')}</div>${dur}</div>`;
}

/* ===================== estado ===================== */
const q=new URLSearchParams(location.search);
function pickStates(){
  const sc=OBS.video(OBS.SHOWCASE);
  const byVid=new Map(); OBS.changes.forEach(c=>{if(!byVid.has(c.video))byVid.set(c.video,[]);byVid.get(c.video).push(c)});
  const few=OBS.videos.find(v=>v.tracked&&v.series.length<2&&byVid.has(v.id));
  const none=OBS.videos.filter(v=>v.tracked&&v.fmt==='long'&&!byVid.has(v.id)&&v.ch===sc.ch&&v.series.length>=10).sort((a,b)=>(b.named?1:0)-(a.named?1:0)||b.series.length-a.series.length)[0];
  const preC=OBS.changes.filter(c=>c.preSeries).sort((a,b)=>(b.niche===sc.niche)-(a.niche===sc.niche)||b.at-a.at)[0];
  const noreg=OBS.videos.find(v=>v.tracked&&v.series.length===0);
  const untr=OBS.videos.find(v=>!v.tracked&&v.ch===OBS.channels.find(c=>!c.own).id)||OBS.videos.find(v=>!v.tracked);
  const old=OBS.videos.filter(v=>v.tracked&&v.named&&v.pub<OBS.SERIES_START&&!OBS.changes.some(c=>c.video===v.id)&&v.ch!==sc.ch).sort((a,b)=>(b.niche===sc.niche)-(a.niche===sc.niche)||a.pub-b.pub)[0];
  const err=OBS.videos.find(v=>v.tracked&&OBS.channel(v.ch).sync.state==='erro'&&v.named)||OBS.videos.find(v=>v.tracked&&OBS.channel(v.ch).sync.state==='erro');
  const bf=OBS.videos.find(v=>OBS.channel(v.ch).sync.state==='backfill'&&v.tracked);
  return {full:sc.id, few:few&&few.id, none:none&&none.id, pre:preC&&preC.video, noreg:noreg&&noreg.id, untr:untr&&untr.id, old:old&&old.id, err:err&&err.id, bf:bf&&bf.id};
}
const PICK=pickStates();
const STATE_LABEL={untr:'Fora dos acompanhados',old:'Antigo sem trocas',err:'Canal com erro de sincronização',bf:'Canal ainda buscando vídeos',noreg:'Sem registro diário (canal atrasado)',full:'Vitrine com trocas medidas',pre:`Histórico anterior a ${S03}`,few:'Registros diários insuficientes',none:'Vídeo sem trocas'};
let BADVID=q.get('video')&&!OBS.video(q.get('video'))?q.get('video'):null;
let VID=q.get('video')&&OBS.video(q.get('video'))?q.get('video'):(PICK[q.get('state')==='notarch'?'pre':q.get('state')]||OBS.SHOWCASE);
let S, forjaState='idle', pairK=null;

/* ===================== modelo de tela derivado de OBS ===================== */
function build(id){
  const v=OBS.video(id), ch=OBS.channel(v.ch), now=OBS.NOW;
  const t0=v.pub, H=(now-t0)/H_MS, hx=ms=>(ms-t0)/H_MS;
  // série → bins (views/dia entre registros). Antes do 1º registro só existe bin se o vídeo saiu depois de ${S03}.
  const pts=v.series.slice(), bins=[];
  let firstNote=null; // 1º intervalo (publicação → 1º registro) com menos de 24 h não vira views/dia
  if(pts.length&&v.pub>=OBS.SERIES_START){const fh=(pts[0].t-v.pub)/H_MS; if(fh>=24) bins.push({a:0,b:hx(pts[0].t),v:pts[0].views/(fh/24),from0:true}); else firstNote={views:pts[0].views,h:fh,t:pts[0].t};}
  for(let i=1;i<pts.length;i++) bins.push({a:hx(pts[i-1].t),b:hx(pts[i].t),v:(pts[i].views-pts[i-1].views)/((pts[i].t-pts[i-1].t)/DAY)});
  const seriesStart=bins.length?bins[0].a:(pts.length?hx(pts[0].t):H);
  const changes=OBS.changes.filter(c=>c.video===id).sort((a,b)=>a.at-b.at);
  const obsSince=ch.sync&&ch.sync.added?ch.sync.added:(ch.snapshots[0]&&ch.snapshots[0].t);
  const stalled=!!(ch.sync&&(ch.sync.state==='atrasado'||ch.sync.state==='erro')&&ch.sync.last), endNow=stalled?Math.min(now,ch.sync.last):now;
  const lateObs=x=>x.prec==='publicacao'&&obsSince&&obsSince>v.pub&&x.first_seen<=v.pub;
  const recentAdd=!!(ch.sync&&ch.sync.added&&ch.sync.added>v.pub);
  const startLbl=(x,g)=>{const o=g==='f'?'a':'o';
    if(lateObs(x)) return recentAdd?`vist${o} na 1ª conferência, ${dmhmY(obsSince)}`:`vist${o} desde ${D.dmOrDmy(obsSince)}`;
    if(x.prec==='publicacao') return `${dmhmY(v.pub)} (publicação)`;
    if(x.prec==='min') return dmhmY(x.first_seen);
    if(x.prec==='desde-arquivo') return `vist${o} desde ${D.dmOrDmy(x.first_seen)}`;
    return `vist${o} pela 1ª vez ${D.dmOrDmy(x.first_seen)} ${D.hh(x.first_seen)}`;};
  const vers=(arr,g)=>arr.map((x,i)=>{const nx=arr[i+1];
    const toMs=nx?(nx.window?nx.window[0]:nx.first_seen):endNow;
    const sObs=lateObs(x)?obsSince:x.first_seen, sLo=x.window?x.window[0]:sObs, sHi=sObs, eLo=nx?(nx.window?nx.window[0]:nx.first_seen):endNow, eHi=nx?nx.first_seen:endNow;
    const du=ms=>D.dur(ms).replace(/ 0 h$/,'').replace(/ 0 min$/,'');
    const openStart=lateObs(x)||x.prec==='desde-arquivo', openEnd=!nx&&stalled;
    const dMin=eLo-sHi, dMax=eHi-sLo, rng=dMax-dMin<H_MS?du(dMax):`${du(Math.max(0,dMin))} a ${du(dMax)}`;
    const durTxt=(openStart||openEnd)?`pelo menos ${du(Math.max(0,dMin))}`:rng;
    return {...x, fromMs:x.first_seen, toMs, from:hx(x.first_seen), to:hx(toMs), win:x.window?[hx(x.window[0]),hx(x.window[1])]:null,
      start:startLbl(x,g), end:nx?(nx.window?`trocad${g==='f'?'a':'o'} ${D.windowText(nx.window[0],nx.window[1])}`:dmhmY(nx.first_seen)):(stalled?`até ${dmhmY(endNow)} (última conferência)`:'agora'),
      dur:durTxt, cur:!nx}});
  const thumbs=vers(v.thumbs,'f');
  const thumbPre=v.thumbs[0]&&v.thumbs[0].seenSinceArchive?hx(v.thumbs[0].first_seen):null;
  // ticks: até 7 datas uniformes
  const compress=v.pub<OBS.SERIES_START&&(OBS.SERIES_START-v.pub)/(now-v.pub)>0.14;
  const tStart=compress?OBS.SERIES_START:t0, days=Math.ceil((now-tStart)/DAY), stepD=Math.max(1,Math.ceil(days/6)), ticks=compress?[[0,D.dmOrDmy(t0)]]:[];
  for(let d=0;d<=days;d+=stepD){const ms=tStart+d*DAY; if(ms<=now) ticks.push([hx(ms),D.dmOrDmy(ms)])}

/* ===================== destaque cruzado ===================== */
function highlight(type,i,evIdx){
  clearHL();
  const arr=arrOf(type), v=arr[i];
  arr.forEach((o,k)=>{if(k===i||(type==='thumb'&&o.key===v.key)){
    {const e1=document.querySelector(`.clip[data-k="${type}:${k}"]`); if(e1) e1.classList.add('is-hl');}
    {const e2=document.querySelector(`[data-ver="${type}:${k}"]`); if(e2) e2.classList.add('is-hl');}}});
  const r=document.getElementById('hlrect'); if(r){const {x}=geom();r.setAttribute('x',x(Math.max(0,v.from)));r.setAttribute('width',Math.max(0,x(v.to)-x(Math.max(0,v.from))));r.setAttribute('opacity','.07')}
  if(evIdx!=null){(document.querySelector(`.vlines [data-ev="${type}:${evIdx}"]`)||{classList:{add(){}}}).classList.add('on');(document.querySelector(`.mk[data-ev="${type}:${evIdx}"]`)||{classList:{add(){}}}).classList.add('on')}
}
function clearHL(){
  document.querySelectorAll('.is-hl,.vlines .on,.mk.on').forEach(e=>e.classList.remove('is-hl','on'));
  const r=document.getElementById('hlrect'); if(r) r.setAttribute('opacity','0');
  document.getElementById('tip').classList.remove('show');
}
function showTip(btn,type,i){

  const tip=document.getElementById('tip'); tip.style.setProperty('--c',TYPE[type].c);

  if(type==='thumb') body=`<div class="thpair">${art(b.art)}<span aria-hidden="true">→</span>${art(a.art)}</div>${c.revertTo?`<div class="aft" style="color:var(--t-thumb)">Voltou para a versão ${c.revertTo} (mesma imagem).</div>`:''}`;
  if(type==='desc') body=`<div class="aft">${c.diff?c.diff.label:`A descrição mudou; o texto antigo não foi guardado (antes de ${S03}).`}</div>${c.diff?'<div class="src" style="margin-top:4px">Comparação linha a linha em Descrições, abaixo.</div>':''}`;
  const when=c.window?`${c.whenText} (janela de ${c.prec==='1d'?'1 dia, sincronização antiga':'6 h'})`:`${c.whenText}, horário exato`;
  tip.innerHTML=`<h4>${TYPE[type].n}: ${type==='thumb'?b.key:b.id} → ${type==='thumb'?a.key:a.id}</h4><div class="when">${when}, ${partAgo(c)}</div>${body}`;
  const wrap=document.getElementById('tlwrap').getBoundingClientRect(), r=btn.getBoundingClientRect();
  const tw=Math.min(310,wrap.width-8);
  let left=r.left-wrap.left+r.width/2-tw/2; left=Math.max(0,Math.min(left,wrap.width-tw));
  tip.style.left=left+'px'; tip.classList.add('show');
  tip.style.top=(r.top-wrap.top-tip.offsetHeight-8)+'px';
}
function bindLanes(){
  document.querySelectorAll('.mk').forEach(m=>{
    const [type,i]=m.dataset.ev.split(':'), n=+i;

    m.addEventListener('click',()=>{const c=changeOf(type,n); const p=pairs().find(p=>p.group.some(g=>g.id===c.id)); if(p){pairK=p.k;renderCompare();renderChart();legend();const ch2=document.querySelector('#compare .pair[aria-pressed="true"]'); if(ch2) setTimeout(()=>ch2.focus(),0);document.getElementById('compare').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})}});

function sideHTML(s){

}
function baFor(p){
  const c=p.group[0], last=p.group[p.group.length-1];
  if(c.type==='desc') return '';
  if(p.group.length===2&&p.group.every(g=>g.type==='thumb')) return [
    {art:c.before.art,l:`${c.before.key} até ${c.whenText}`},{art:c.after.art,l:`${c.after.key} por ${D.dur(c.nextLivedMs)}`},{art:last.after.art,l:`${last.after.key} de volta em ${dmhmY(last.at)}`}];
  const preMs=(c.window?c.window[0]:c.at)-60e3, postMs=Math.max(...p.group.map(g=>g.at))+60e3;
  const tb=versionAt('thumb',preMs), ta=versionAt('thumb',postMs), Tb=versionAt('title',preMs), Ta=versionAt('title',postMs);
  const thumbKnown=x=>!(x.seenSinceArchive&&x.first_seen>preMs);
  return [{art:thumbKnown(tb)?tb.art:null,missing:!thumbKnown(tb),t:Tb.text,l:`Antes (${Tb.id}${thumbKnown(tb)?`, thumbnail ${tb.key}`:''})`},{art:ta.art,t:Ta.text,l:`Depois (${Ta.id}, thumbnail ${ta.key})`}];
}

      <span class="m"><span>${cap(span(t))}</span><span>no ar por ${t.dur}</span><span>média de views/dia: ${periodText(t)}</span>${t.cur?`<span style="color:var(--success)">${CURL('title')}</span>`:''}</span></li>`).join('')}</ol>`;

  const de=document.getElementById('descSec');
  const dRow=(d,i)=>`<div data-ver="desc:${i}" tabindex="-1"><span><b>${d.id}</b>${cap(span(d))}${d.lines==null?' (texto não guardado)':''}</span><span>no ar por ${d.dur}${d.cur?` <span style="color:var(--success)">${CURL('desc')}</span>`:''}</span></div>`;
  if(S.descs.length<2){de.innerHTML=`<div class="sec-h"><h3 id="deh">Descrições</h3><span class="src">sem troca vista</span></div><div class="dver">${S.descs.map(dRow).join('')}</div><p class="src" style="margin-top:10px">${sameSinceText('descrição')}</p>`;return}
  const dc=S.changes.filter(c=>c.type==='desc');
  const withText=dc.filter(c=>c.diff);
  let html=`<div class="sec-h"><h3 id="deh">Descrições</h3><span class="src">${withText.length?'comparação linha a linha':'texto antigo não guardado'}</span></div><div class="dver">${S.descs.map(dRow).join('')}</div>`;
  dc.filter(c=>!c.diff).forEach(c=>{html+=`<div class="note"><span style="color:var(--warning-text)">${IC.warn}</span><span>${c.fromId} → ${c.toId} (${c.whenText}): antes de ${S03} a sincronização só registrava que a descrição mudou, sem guardar o texto. Não há comparação linha a linha para esta troca.</span></div>`});
  withText.forEach(c=>{
    const L=c.diff.lines; let rows='', run=[];
    const flush=()=>{ if(run.length>=3&&run.every(r=>r.text)) rows+=`<div class="fold">${F.plural(run.length,'linha sem mudança','linhas sem mudança')} (${run.map(r=>esc(r.text)).join(', ')})</div>`; else run.forEach(r=>rows+=`<div class="ln ctx"><span aria-hidden="true"></span><span>${esc(r.text)||'&nbsp;'}</span></div>`); run=[]; };
    L.forEach(l=>{
      if(l.op==='ctx'&&l.text){run.push(l);return} flush();
      if(l.op==='ctx') rows+=`<div class="ln ctx"><span aria-hidden="true"></span><span>&nbsp;</span></div>`;
      else if(l.op==='utm'){const extra=l.text.slice(l.from.length);
        rows+=`<div class="ln rem noise"><span aria-hidden="true">${MINUS}</span><span><span class="sr">removida: </span>${esc(l.from)}</span></div><div class="ln add noise"><span aria-hidden="true">+</span><span><span class="sr">adicionada: </span>${esc(l.from)}<span class="utm">${esc(extra)}</span></span></div>`}
      else rows+=`<div class="ln ${l.op}"><span aria-hidden="true">${l.op==='add'?'+':MINUS}</span><span><span class="sr">${l.op==='add'?'adicionada':'removida'}: </span>${esc(l.text)}</span></div>`;
    }); flush();
    html+=`<div class="dhead"><span class="dsum">${c.fromId} → ${c.toId}: ${c.diff.label}</span>
      <label class="toggle"><input type="checkbox" class="hideNoise" checked>Ocultar mudanças só de link/UTM</label></div>
      <details class="expander" open><summary class="src">Ver a comparação linha a linha</summary>
      <div class="diff">${rows}${c.diff.utm?`<div class="fold noiseNote">${F.plural(c.diff.utm,'mudança só de link/UTM oculta','mudanças só de link/UTM ocultas')}</div>`:''}</div></details>`;
  });
  de.innerHTML=html;
  de.querySelectorAll('.hideNoise').forEach(hn=>hn.onchange=()=>{const box=hn.closest('.dhead').nextElementSibling.querySelector('.diff');box.classList.toggle('shownoise',!hn.checked);const nn=box.querySelector('.noiseNote');if(nn)nn.hidden=!hn.checked});
}

/* ===================== barra de estados ===================== */
const FORJA_IDS=['idle','queued','working','done','late','nomachine','retry','vigil','failed','refused'];
function demoVideos(){
  const withChanges=[...new Set(OBS.changes.map(c=>c.video))];
  const picks=['full','pre','few','none','noreg','untr','old','err','bf'].filter(k=>PICK[k]).map(k=>({id:PICK[k],label:STATE_LABEL[k]}));
  const others=withChanges.filter(id=>!picks.some(p=>p.id===id)).map(id=>{const v=OBS.video(id);return {id,label:`${OBS.channel(v.ch).name}: ${v.title.length>26?v.title.slice(0,26)+'…':v.title}`}});
  const all=[...picks,...others]; if(!all.some(x=>x.id===VID)) all.push({id:VID,label:OBS.video(VID).title.slice(0,30)});
  return all;
}
const NICHE_NO_PERSIST=/persist/.test(String(CHROME.setNiche));
function fitNiche(){ // ?video de outro nicho: muda o nicho só na exibição desta tela (persist:false); sem suporte no chrome, não chama setNiche
  if(BADVID) return;
  const n=CHROME.niche(), vn=OBS.video(VID).niche;
  if(n==='todos'||n===vn) return;
  if(NICHE_NO_PERSIST){CHROME.setNiche(vn,{silent:true,persist:false}); CHROME.toast('',`Nicho mudou para ${NICHE[vn]} para mostrar este vídeo`,'');}
  else CHROME.toast('',`Este vídeo é do nicho ${NICHE[vn]}; o paginador usa o nicho do vídeo`,'');
}
function go(id){if(BADVID){BADVID=null;['#vhead','.timeline','#compare','#forja','#thumbsSec','.two','#pager'].forEach(sel=>{const e=document.querySelector('#screen '+sel); if(e) e.hidden=false;}); const nf=document.getElementById('notfound'); if(nf) nf.remove();}VID=id;pairK=null;askRefused=null;clearHL();CHROME.setMockPressed({0:id});const u=new URL(location.href);u.searchParams.set('video',id);u.searchParams.delete('state');if(FROM!=='mudancas')u.searchParams.set('from',FROM);history.replaceState(null,'',u);fitNiche();renderAll()}

/* ===================== render geral ===================== */
function renderNotFound(){
  ['#vhead','.timeline','#compare','#forja','#thumbsSec','.two','#pager'].forEach(sel=>{const e=document.querySelector('#screen '+sel); if(e) e.hidden=true;});
  const page=document.querySelector('#screen .page'); let nf=document.getElementById('notfound'); if(!nf){nf=document.createElement('section');nf.id='notfound';nf.className='card nobase-card';page.appendChild(nf);}
  const base=({mudancas:'Mudanças',outliers:'Outliers',canais:'Canais',insights:'Insights'})[FROM];
  const href=backHref(FROM,{}); const cm=document.getElementById('crumbMud'); cm.textContent=base; cm.href=href;
  try{CHROME.setMockPressed({0:'__none__'})}catch(e){}
  nf.innerHTML=`<div class="nfin"><strong>Vídeo não encontrado: “${esc(BADVID)}”.</strong>Ele não está entre os vídeos observados: o link pode estar errado ou o vídeo saiu da lista do canal. <a class="inl" href="${href}">Voltar para ${base}</a></div>`;
}
function renderAll(){if(BADVID){renderNotFound();return}S=build(VID);renderHead();
  const untracked=!S.v.tracked, hideSel=['.timeline','#compare','#forja','#thumbsSec','.two'];
  hideSel.forEach(sel=>{const e=document.querySelector('#screen '+sel); if(e) e.hidden=untracked;});
  let u=document.getElementById('untracked');
  if(untracked){ if(!u){u=document.createElement('section');u.id='untracked';u.className='card nobase-card';document.getElementById('vhead').after(u);}
    u.hidden=false; u.innerHTML=`<div class="nfin"><strong>Vídeo fora dos acompanhados.</strong>${S.ch.name} tem ${F.plural(S.ch.video_limit,'vídeo acompanhado','vídeos acompanhados')}, os mais recentes; este ficou de fora. Sem registro diário de views e sem versões de título, thumbnail ou descrição para mostrar. <a class="inl" href="${CHROME.link('canais',{channel:S.v.ch})}">Ver o canal em Canais</a></div>`; return; }
  if(u) u.hidden=true;
  renderCompare();renderChart();renderLanes();legend();renderForja();renderVersions();bindVer()}
if(q.get('forja')&&FORJA_IDS.includes(q.get('forja'))){ forjaState=q.get('forja'); if(SESSION&&!BADVID) SESSION.setBase(forjaState==='idle'?'sem pedido':FSTATE[forjaState],VO()); }
CHROME.mount({tab:'historico', content:'#screen', forjaVariant:'none',
  mockStates:[
    {label:'Vídeo', items:demoVideos().map(x=>({id:x.id,label:x.label,pressed:!BADVID&&x.id===VID})), note:`Os primeiros são escolhidos pela API para cada caso de borda: trocas medidas, histórico anterior a ${S03}, poucos registros, sem trocas, sem registro, fora dos acompanhados, antigo sem trocas, canal com erro e canal buscando vídeos.`},
    {label:'Pedido de leitura do vídeo', items:FORJA_IDS.map(f=>({id:f,label:f==='idle'?'sem pedido':FSTATE[f],pressed:f===forjaState})), note:`Os estados do pedido são simulações marcadas no dado. Fila real: última consulta da máquina ${D.ago(OBS.forja.queue.lastPollAt)}.`},
  ],
  deps:[
    ['<code>leitura-video</code>','tipo de pedido na fila da forja com escopo de 1 vídeo; leituras congeladas por vídeo e "desde então" por troca.'],
    ['Cota',OBS.forja.queue.quotaScope.text],
    ['Estado do pedido por alvo','na fila, trabalhando, atrasado, sem máquina, nova tentativa, liberado pelo vigia, falhou, recusado, com motivo e horários.'],
    ['Frescor por canal','um canal atrasado tira o vídeo da leitura e é dito na tela.'],
    ['Série e versões',`tabela de versões por vídeo, registro diário de views desde ${S03} e curva esperada pela idade (mesma idade em dias).`],
  ],
  onMock:(id,g)=>{ if(g===0) go(id); else setForjaState(id); },
  onSynced:()=>{ renderAll(); },
  onNiche:n=>{ if(BADVID||!S){ if(BADVID) renderNotFound(); return; } if(n!=='todos'&&n!==S.v.niche) CHROME.toast('',`Este vídeo é do nicho ${NICHE[S.v.niche]}; o paginador continua no nicho do vídeo`,''); renderHead(); },
  onTheme:()=>{ if(BADVID||!S) return; renderChart();renderLanes()},
  onForja:()=>{ document.getElementById('forja').scrollIntoView({block:'start'}); },
  onStatus:()=>{ const f=document.getElementById('forja'); f.scrollIntoView({block:'start'}); f.focus({preventScroll:true}); },
});
fitNiche();
window.__hist={ctxIds:()=>context().ids, videos:()=>demoVideos().map(x=>x.id), forjaStates:FORJA_IDS, forjaLabel:f=>f==='idle'?'sem pedido':FSTATE[f], setVideo:id=>go(id), setForja:f=>setForjaState(f), state:()=>({video:VID,forja:forjaState})};
let rt, lastW=0; new ResizeObserver(en=>{if(BADVID||!S) return; const w=Math.round(en[0].contentRect.width); if(w===lastW) return; lastW=w; clearTimeout(rt); rt=setTimeout(()=>{renderChart();renderLanes()},60)}).observe(document.getElementById('tlwrap'));
renderAll();
if(!BADVID) CHROME.setMockPressed({0:VID,1:forjaState});
document.addEventListener('click',ev=>{const a=ev.target.closest&&ev.target.closest('a[data-go]'); if(!a||ev.metaKey||ev.ctrlKey||ev.shiftKey) return; ev.preventDefault(); go(a.dataset.go); window.scrollTo(0,0); const h=document.querySelector('#vhead h2'); if(h){h.tabIndex=-1;h.focus({preventScroll:true});}});

</script>
