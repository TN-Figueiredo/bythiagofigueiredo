# .github/workflows/health-watch.yml
#
# Terceira perna do canal de garantia (spec §2, objetivo 6): um agendador fora
# da Vercel E fora do home-lab, para a classe "o cron parou de rodar" — morte
# por maxDuration, CRON_SECRET rotacionado, crons desabilitados pela Vercel.
#
# MUST: arquivo NOVO. Um job a mais em uptime.yml quebraria a supressão de lá,
# que lê a conclusão da RUN (uptime.yml:111-113) e não a do job.
name: Health Watch

on:
  schedule:
    # */15 e não */5: o alvo é "o cron parou", cuja menor grace é 15 min
    # (computeGraceMinutes, piso MIN_GRACE_MINUTES = 15). Sondar a cada 5 min
    # não antecipa nada e triplica o ruído.
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read

concurrency:
  group: health-watch
  cancel-in-progress: false

env:
  HEALTH_URL: https://bythiagofigueiredo.com/api/health
  REALERT_AFTER_SECONDS: 21600 # 6 h => teto de 4 pushes/dia enquanto "not ok"

jobs:
  watch:
    name: Probe /api/health and alert on transitions
    runs-on: ubuntu-latest
    steps:
      - name: Restore previous state
        id: cache
        uses: actions/cache@v4
        with:
          path: .health-watch-state
          key: health-watch-state-${{ github.run_id }}
          restore-keys: health-watch-state-

      - name: Probe /api/health
        id: probe
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -uo pipefail
          # Secret ausente NÃO aborta o passo: a sonda segue, recebe 401, cai em
          # `blind` e ALERTA. Abortar aqui recriaria exatamente o silêncio de
          # 2026-09-07..18, quando 74 runs seguidas falharam e nada avisou.
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::health-watch: secrets.CRON_SECRET ausente — a sonda não consegue autenticar. Grave com: gh secret set CRON_SECRET"
          fi
          # O corpo NUNCA é ecoado: repositório público, logs de Actions
          # mundialmente legíveis, e o payload de saúde carrega mensagens de
          # erro em texto livre como 'alert channel down: terminal refusal
          # (HTTP <n>)' — nada disso deve ir para stdout/summary.
          http_code="$(curl --silent --show-error --max-time 20 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -o "$RUNNER_TEMP/health.json" \
            -w '%{http_code}' "$HEALTH_URL" || echo '000')"

          status="$(jq -r '.status // "unknown"' "$RUNNER_TEMP/health.json" 2>/dev/null || echo 'unknown')"
          late="$(jq -r '[.crons[]? | select(.status=="late") | .name] | join(", ")' "$RUNNER_TEMP/health.json" 2>/dev/null || echo '')"
          unknown="$(jq -r '(.unknownNames // []) | join(", ")' "$RUNNER_TEMP/health.json" 2>/dev/null || echo '')"

          # TRÊS estados, não dois. `blind` (401/403) é a sonda que não
          # consegue AUTENTICAR — não é o site fora do ar, e confundir os dois
          # foi o defeito de 2026-09-07..18: o secret do repositório nunca
          # existiu, o 401 virou "not-ok", o estado travou lá — logo nenhuma
          # transição voltou a ser detectável e uma queda real passaria
          # despercebida — e o ramo `re-alert` disparou push urgente FALSO a
          # cada 6 h por 11 dias. `blind` tem transição e re-alerta próprios,
          # com texto que diz o que de fato aconteceu, e nunca se mistura com a
          # máquina ok/not-ok. `000` (timeout/DNS/TLS) continua sendo not-ok:
          # ali o site realmente não respondeu.
          if [ "$http_code" = "401" ] || [ "$http_code" = "403" ]; then
            state="blind"
          elif [ "$http_code" != "200" ] || [ "$status" != "ok" ]; then
            state="not-ok"
          else
            state="ok"
          fi

          {
            echo "http_code=$http_code"
            echo "status=$status"
            echo "late=$late"
            echo "unknown=$unknown"
            echo "state=$state"
          } | tee -a "$GITHUB_OUTPUT"

          {
            echo "### health-watch"
            echo "- HTTP: \`$http_code\`"
            echo "- status: \`$status\`"
            echo "- crons late: \`${late:-none}\`"
            echo "- unknown: \`${unknown:-none}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve previous state
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          if [ -f .health-watch-state ]; then
            prev_state="$(head -n1 .health-watch-state)"
            prev_alert="$(sed -n '2p' .health-watch-state)"
          else
            # Cache miss: deriva SÓ das runs DESTE workflow, nunca das de uptime.yml.
            conclusion="$(gh api \
              "repos/${{ github.repository }}/actions/workflows/health-watch.yml/runs?status=completed&per_page=1" \
              --jq '.workflow_runs[0].conclusion' 2>/dev/null || echo '')"
            if [ "$conclusion" = "failure" ]; then prev_state="not-ok"; else prev_state="ok"; fi
            prev_alert=""
          fi
          echo "prev_state=$prev_state" | tee -a "$GITHUB_OUTPUT"
          echo "prev_alert=$prev_alert" | tee -a "$GITHUB_OUTPUT"

      - name: Decide and alert
        id: alert
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          STATE: ${{ steps.probe.outputs.state }}
          PREV_STATE: ${{ steps.prev.outputs.prev_state }}
          PREV_ALERT: ${{ steps.prev.outputs.prev_alert }}
          STATUS: ${{ steps.probe.outputs.status }}
          HTTP_CODE: ${{ steps.probe.outputs.http_code }}
          LATE: ${{ steps.probe.outputs.late }}
          UNKNOWN: ${{ steps.probe.outputs.unknown }}
        run: |
          set -uo pipefail
          now="$(date -u +%s)"
          alerted_at="$PREV_ALERT"

          if [ -z "${NTFY_URL:-}" ]; then
            echo "::warning::secrets.NTFY_URL não configurado — health-watch está medindo mas não consegue alertar."
            printf '%s\n%s\n' "$STATE" "$alerted_at" > .health-watch-state
            exit 0
          fi

          send() {
            # $1=priority $2=title $3=body. `curl -f` sai != 0 em qualquer
            # não-2xx, e runners do GitHub compartilham IP de saída —
            # exatamente a população que o ntfy.sh limita por IP, então a
            # recusa é provável, não exótica.
            curl -fsS -o /dev/null -w '%{http_code}' \
              --max-time 15 \
              -H "Title: $2" \
              -H "Priority: $1" \
              -H "Tags: warning" \
              -d "$3" \
              "$NTFY_URL"
          }

          # Entrega VERIFICADA (Important #4 da review dos blocos 3-5): o passo
          # roda sob `set -uo pipefail` SEM `-e`, então um `send` que falha não
          # derrubava nada — o `case` seguia, `alerted_at` era armado como se o
          # push tivesse chegado (suprimindo o re-alerta por 6 h) e o passo saía
          # 0 pelo `printf` final. Aqui a recusa: (a) falha o passo; (b) NÃO
          # arma a janela de supressão; (c) NÃO grava o estado novo — deixa
          # PREV_STATE/PREV_ALERT intactos, para que o run seguinte (15 min)
          # volte a ver a MESMA transição e tente de novo. Escrever "$STATE"
          # aqui converteria a transição perdida em silêncio permanente: o ramo
          # `re-alert` exige `alerted_at` não vazio.
          fail_undelivered() {
            echo "::error::health-watch: ntfy recusou o push ($1) — alerta NÃO entregue; supressão não armada, o próximo run repete."
            printf '%s\n%s\n' "$PREV_STATE" "$PREV_ALERT" > .health-watch-state
            exit 1
          }

          if [ "$STATE" = "blind" ]; then
            # Nunca ecoar secret nem corpo da resposta — só o código e a causa.
            body="A sonda não conseguiu autenticar em /api/health (HTTP ${HTTP_CODE}): secrets.CRON_SECRET ausente ou desatualizado. Enquanto durar, este vigia NÃO enxerga o site."
          else
            body="Crons late: ${LATE:-none} · unknown: ${UNKNOWN:-none}"
          fi

          # Transição = QUALQUER mudança de estado. A forma antiga enumerava só
          # os pares ok<->not-ok: um terceiro estado ficaria sem saída, e um
          # estado travado nunca mais alertava. A cláusula do `alerted_at` vazio
          # fecha a outra metade do mesmo buraco — estar num estado ruim sem
          # nunca ter alertado (cache perdido, push recusado antes) tem de
          # alertar, não virar silêncio permanente.
          should_alert="no"
          if [ "$STATE" != "$PREV_STATE" ]; then
            should_alert="transition"
          elif [ "$STATE" != "ok" ] && [ -z "$alerted_at" ]; then
            should_alert="never-alerted"
          elif [ "$STATE" != "ok" ] && [ -n "$alerted_at" ] \
               && [ $((now - alerted_at)) -ge "$REALERT_AFTER_SECONDS" ]; then
            should_alert="re-alert"
          fi

          case "$STATE" in
            ok)
              title="health-watch: recuperado"
              priority="default"
              ;;
            blind)
              title="health-watch: sonda cega"
              priority="urgent"
              ;;
            *)
              title="health-watch: ${STATUS}"
              # `high` segue reservado a canal caído/segundo cron.
              if [ "$STATUS" = "degraded" ] && [ "$HTTP_CODE" = "200" ]; then
                priority="default"
              else
                priority="urgent"
              fi
              ;;
          esac

          if [ "$should_alert" = "no" ]; then
            echo "health-watch: sem transição (state=$STATE prev=$PREV_STATE)"
          else
            send "$priority" "$title" "$body" || fail_undelivered "$should_alert ($STATE)"
            if [ "$STATE" = "ok" ]; then alerted_at=""; else alerted_at="$now"; fi
          fi

          printf '%s\n%s\n' "$STATE" "$alerted_at" > .health-watch-state

      # `hashFiles` devolve '' quando o arquivo não existe — o passo de alerta
      # pode não ter rodado (probe falhou) ou ter abortado sem gravar, e
      # actions/cache/save falha o job com "Path Validation Error" nesse caso,
      # trocando o erro real por um erro de cache.
      - name: Save state
        if: always() && hashFiles('.health-watch-state') != ''
        uses: actions/cache/save@v4
        with:
          path: .health-watch-state
          key: health-watch-state-${{ github.run_id }}

      - name: Fail the run if not ok (segundo sinal na aba Actions)
        if: steps.probe.outputs.state != 'ok'
        run: |
          echo "state=not-ok http_code=${{ steps.probe.outputs.http_code }} status=${{ steps.probe.outputs.status }}"
          exit 1
