<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teste de dados</title>
<style>
:root{--bg:#1A1714;--surface:#221E1A;--border:#332D25;--text:#F5EFE6;--muted:#A89D88;--ok:#22c55e;--bad:#F26B6B}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#F7F2E9;--surface:#FBF7F0;--border:#DDD2BF;--text:#231C14;--muted:#5E5240;--ok:#11692F;--bad:#B42318}}
:root[data-theme="light"]{--bg:#F7F2E9;--surface:#FBF7F0;--border:#DDD2BF;--text:#231C14;--muted:#5E5240;--ok:#11692F;--bad:#B42318}
body{margin:0;padding:24px 16px;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,sans-serif}
main{max-width:1100px;margin:0 auto}
h1{font-size:20px;margin:0 0 4px}
p.sub{color:var(--muted);margin:0 0 16px}
#summary{font:600 16px/1.4 ui-monospace,Menlo,monospace;padding:12px 14px;border:1px solid var(--border);border-radius:6px;background:var(--surface);margin-bottom:16px}
#summary.pass{color:var(--ok)}#summary.fail{color:var(--bad)}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);border-radius:6px}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--border);vertical-align:top}
th{color:var(--muted);font-weight:600}
td.r{font:600 12px ui-monospace,Menlo,monospace;white-space:nowrap}
td.r.PASS{color:var(--ok)}td.r.FAIL{color:var(--bad)}
td.d{color:var(--muted);font-size:12px;word-break:break-word}
</style>
</head>
<body>
<main>
<h1>Teste de dados (dados.js)</h1>
<p class="sub">Roda as asserções sobre <code>window.OBS</code> e escreve PASS/FAIL aqui e no console. Horários em São Paulo.</p>
<div id="summary" role="status">rodando…</div>
<table><thead><tr><th scope="col">resultado</th><th scope="col">asserção</th><th scope="col">detalhe</th></tr></thead><tbody id="rows"></tbody></table>
</main>
<script src="dados.js"></script>
<script id="tests">
(function (root) {
  const O = root.OBS, R = [];
  const test = (name, fn) => { let ok = false, detail = ''; try { const r = fn(); ok = r === true || (r && r.ok === true); detail = r && r.detail != null ? r.detail : (ok ? '' : JSON.stringify(r)); } catch (e) { detail = 'erro: ' + e.message; } R.push({ name, ok, detail }); };
  const all = (arr, pred, label) => { const bad = arr.filter(x => !pred(x)); return { ok: bad.length === 0, detail: bad.length ? bad.length + ' violações: ' + bad.slice(0, 4).map(label || (x => x.id || JSON.stringify(x))).join('; ') : arr.length + ' itens conferidos' }; };
  const { date, fmt, NOW, DAY, H } = O;
  const D = (s) => date.spIso(s);
  const V = id => O.video(id), C = id => O.change(id);
  const median = O.median;
  const byN = (reqs) => [reqs.find(q => q.niche === 'ia'), reqs.find(q => q.niche === 'viagem')];   // [IA, Viagem], qualquer que seja a ordem da fila

  /* ---------- calendário ---------- */
  test('24/10/2026 15:02 (SP) é sábado e NOW bate', () => ({ ok: date.weekday(NOW) === 'sábado' && date.dm(NOW) === '24/10' && date.hm(NOW) === '15:02', detail: date.weekday(NOW) + ' ' + date.dmhm(NOW) }));
  test('Dias da semana pelo calendário real (20/10 terça, 21/10 quarta, 22/10 quinta, 28/10 quarta, 03/10 sábado, 31/05 domingo)', () => {
    const exp = { '2026-10-20': 'terça', '2026-10-21': 'quarta', '2026-10-22': 'quinta', '2026-10-28': 'quarta', '2026-10-03': 'sábado', '2026-05-31': 'domingo', '2025-12-30': 'terça' };
    const bad = Object.entries(exp).filter(([d, w]) => date.weekday(D(d + 'T12:00')) !== w || new Date(d + 'T12:00:00-03:00').getUTCDay() !== ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'].indexOf(w));
    return { ok: !bad.length, detail: bad.length ? JSON.stringify(bad) : '7 datas' };
  });
  test('Sincronização: última 24/10 12:00, próxima 18:00, "sincronizado há 3 h"', () => ({ ok: date.dmhm(O.SYNC.last) === '24/10 12:00' && date.hm(O.SYNC.next) === '18:00' && O.SYNC.text === 'sincronizado há 3 h', detail: O.SYNC.text + ' · ' + O.SYNC.title }));
  test('Série começa em 03/10 e hoje é o índice 21 (24/10 12:00)', () => ({ ok: date.dmhm(O.SERIES_START) === '03/10 00:00' && date.dmhm(date.snapTime(0)) === '03/10 12:00' && date.dmhm(date.snapTime(O.LAST_IDX)) === '24/10 12:00', detail: '' }));

  /* ---------- nada depois de NOW ---------- */
  test('Nada depois de NOW (publicações, pontos da série, versões, trocas, snapshots, leituras, sincronizações)', () => {
    const bad = [];
    O.videos.forEach(v => { if (v.pub > NOW) bad.push(v.id + ' pub'); v.series.forEach(p => { if (p.t > NOW) bad.push(v.id + ' série'); });
      [v.titles, v.thumbs, v.descs].forEach(a => a.forEach(x => { if (x.first_seen > NOW || x.last_seen > NOW) bad.push(v.id + ' ' + x.id); })); });
    O.changes.forEach(c => { if (c.at > NOW || (c.window && c.window[1] > NOW)) bad.push(c.id); });
    O.channels.forEach(c => { if (c.sync.last > NOW) bad.push(c.id + ' sync'); c.snapshots.forEach(s => { if (s.t > NOW) bad.push(c.id + ' snap'); }); });
    O.forja.readings.forEach(r => { if (r.generatedAt > NOW || r.sent.asOf > r.generatedAt) bad.push(r.id); });
    return { ok: !bad.length, detail: bad.length ? bad.slice(0, 5).join('; ') : 'ok' };
  });

  /* ---------- contagens das abas ---------- */
  ['todos', 'viagem', 'ia'].forEach(n => test('Contagens das abas (' + n + ') = CONVENCOES ' + JSON.stringify(O.TAB_COUNTS[n]), () => {
    const got = O.tabCounts(n), want = O.TAB_COUNTS[n];
    // recálculo independente
    const inN = x => n === 'todos' || x.niche === n;
    const canais = O.channels.filter(c => !c.own && inN(c)).length;
    const mud = O.changes.filter(c => c.at > NOW - 30 * DAY && inN(c) && !O.channel(c.ch).own).length;
    const out = O.videos.filter(v => v.tracked && v.fmt === 'long' && inN(v) && !O.channel(v.ch).own && v.ageDays <= 90 && v.mult.value >= 2 && !v.mult.weak).length;
    const ok = got.canais === want.canais && got.mud === want.mud && got.out === want.out && canais === want.canais && mud === want.mud && out === want.out;
    return { ok, detail: 'tabCounts ' + JSON.stringify(got) + ' · recontagem ' + JSON.stringify({ canais, mud, out }) };
  }));
  test('Integridade de carga (asserção interna do dados.js) sem erros', () => ({ ok: O.integrity.ok, detail: O.integrity.errors.join('; ') }));
  test('Mudanças: título + thumbnail na mesma janela contam como 2 eventos (Opus 18/10)', () => {
    const ev = O.changesIn({ video: 'matt-opus55', days: 30 }).filter(c => c.at >= D('2026-10-18T06:00') && c.at <= D('2026-10-18T12:00'));
    return { ok: ev.length === 2 && ev.some(c => c.type === 'title') && ev.some(c => c.type === 'thumb') && ev.every(c => c.sameWindow.length === 1), detail: ev.map(c => c.id).join(', ') };
  });

  /* ---------- outliers ---------- */
  test('Outliers padrão (longos, até 90 d) são ≥ 2×, base não fraca (n ≥ 3) e com views/dia acima da mediana do canal', () => {
    const items = O.outliers({}).items;
    return all(items, x => { const v = x.video, ch = O.channel(v.ch); const med = median(ch.videos.filter(u => u.tracked && u.fmt === v.fmt && u.vpd != null).map(u => u.vpd)); return x.mult.value >= 2 && !x.mult.weak && x.mult.n >= 3 && v.vpd > med; }, x => x.id + ' ' + fmt.mult(x.mult.value));
  });
  test('Outliers: viagem 5 e IA 6; contagem por faixa fecha com a lista', () => {
    const a = O.outliers({ niche: 'viagem' }), b = O.outliers({ niche: 'ia' }), t = O.outliers({});
    return { ok: a.count === 5 && b.count === 6 && t.byAge['0-30'] + t.byAge['31-90'] === t.count && t.count === 11, detail: 'viagem ' + a.count + ' · IA ' + b.count + ' · 0–30 ' + t.byAge['0-30'] + ' + 31–90 ' + t.byAge['31-90'] };
  });
  test('Abaixo de 2× nunca é outlier (nenhum item < 2× em nenhuma faixa/formato)', () => {
    const items = ['long', 'short'].flatMap(f => O.outliers({ fmt: f, ages: 'all' }).items);
    return all(items, x => x.mult.value >= 2, x => x.id);
  });
  test('Fases dos outliers seguem a regra (estourando ≤ 30 d; recentes ≤ 90 d; perenes/antigos > 90 d)', () => {
    const items = ['long', 'short'].flatMap(f => O.outliers({ fmt: f, ages: 'all' }).items);
    return all(items, x => ({ estourando: x.ageDays <= 30, recente: x.ageDays <= 90, perene: x.ageDays > 90, antigo: x.ageDays > 90, 'sem-ritmo': ['atrasado', 'erro', 'backfill'].includes(O.channel(x.video.ch).sync.state), novos: x.video.vpd7 == null && O.channel(x.video.ch).sync.state === 'ok' })[x.phase.id], x => x.id + ' ' + x.phase.id);
  });

  /* ---------- n possíveis pela cadência ---------- */
  test('n do multiplicador = recontagem independente (sem contar o vídeo) e possível pela lista do canal', () => {
    const bad = [];
    O.videos.filter(v => v.tracked && v.series.length && O.channel(v.ch).lastIdx != null).forEach(v => {
      const m = v.mult, ch = O.channel(v.ch), t = ch.lastIdx, tt = date.snapTime(t);
      const others = ch.videos.filter(u => u !== v && u.tracked && u.fmt === v.fmt && u.pub < tt && u.series.length);
      if (m.method === 'aproximação por faixa') {
        const b = O.bandOf(Math.floor((tt - v.pub) / DAY)).id;
        const n = others.filter(u => O.bandOf(Math.floor((tt - u.pub) / DAY)).id === b).length;
        if (n !== m.n) bad.push(v.id + ' faixa ' + m.n + '≠' + n);
      } else if (m.method === 'mesmo dia de vida') {
        const max = others.filter(u => u.pub >= O.SERIES_START).length;
        if (m.n > max || m.n < 3) bad.push(v.id + ' dia ' + m.n + '>' + max);
      }
    });
    return { ok: !bad.length, detail: bad.length ? bad.slice(0, 5).join('; ') : 'todos os vídeos com série' };
  });
  test('Cadência: pw = n/13 (1 casa), semanas somam n, "costuma" só com ≥ 3 vídeos e ≥ 30%', () => {
    const bad = [];
    O.channels.forEach(c => ['long', 'short'].forEach(f => { const k = O.cadence(c.id, f);
      if (Math.abs(k.pw - Math.round(k.n / 13 * 10) / 10) > 1e-9) bad.push(c.id + ' pw');
      if (k.weeks.reduce((a, w) => a + w.n, 0) !== k.n) bad.push(c.id + ' semanas');
      if (k.habit.costuma && !(k.habit.n >= 3 && k.habit.n / k.n >= 0.3)) bad.push(c.id + ' costuma'); }));
    return { ok: !bad.length, detail: bad.join('; ') || '30 combinações canal × formato' };
  });

  /* ---------- limites e sincronização ---------- */
  test('≤ 200 vídeos acompanhados por canal; acompanhados = os mais recentes até o video_limit', () => all(O.channels, c => { const tr = c.videos.filter(v => v.tracked); return c.video_limit <= 200 && tr.length <= c.video_limit && tr.every(v => c.videos.indexOf(v) < c.video_limit); }, c => c.id));
  test('Vídeos fora do video_limit não têm série', () => all(O.videos.filter(v => !v.tracked), v => !v.series.length && v.views == null));
  test('Estados de sincronização: Paddy atrasado (23/10 00:00), Esq erro 404 (21/10 18:00), Vou sem volta buscando 18 de 50, bald and bankrupt parado, demais ok às 12:00', () => {
    const c = id => O.channel(id), s = id => c(id).sync;
    const ok = s('paddy-doyle').state === 'atrasado' && date.dmhm(s('paddy-doyle').last) === '23/10 00:00'
      && s('esq-unltd-daily').state === 'erro' && date.dmhm(s('esq-unltd-daily').last) === '21/10 18:00' && /404/.test(s('esq-unltd-daily').msg)
      && s('vou-sem-volta').state === 'backfill' && s('vou-sem-volta').backfill.done === 18 && s('vou-sem-volta').backfill.total === 50 && c('vou-sem-volta').videos.length === 18
      && c('bald-and-bankrupt').activity.state === 'parado' && O.cadence('bald-and-bankrupt', 'long').lastUpload <= NOW - 35 * DAY
      && O.channels.filter(x => !['paddy-doyle', 'esq-unltd-daily', 'vou-sem-volta'].includes(x.id)).every(x => x.sync.state === 'ok' && date.dmhm(x.sync.last) === '24/10 12:00');
    return { ok, detail: O.channels.map(x => x.id + ':' + x.sync.state).join(' ') };
  });
  test('Canais: 14 concorrentes (Viagem 8, IA 6) + seu canal tnFigueiredo (own)', () => {
    const comp = O.channels.filter(c => !c.own);
    return { ok: comp.length === 14 && comp.filter(c => c.niche === 'viagem').length === 8 && comp.filter(c => c.niche === 'ia').length === 6 && O.channel('tnfigueiredo').own === true, detail: comp.map(c => c.name).join(', ') };
  });
  test('Snapshots de canal: 1 por dia desde 31/05 (09:00 até 02/10; 12:00 desde 03/10) até a última sincronização', () => all(O.channels.filter(c => c.sync.state !== 'backfill'), c => {
    const s = c.snapshots; if (date.dmhm(s[0].t) !== '31/05 09:00') return false;
    for (let i = 1; i < s.length; i++) { const dd = Math.round((s[i].t - s[i - 1].t) / H); if (dd !== 24 && dd !== 27) return false; const h = date.parts(s[i].t).h; if (h !== (s[i].t < O.SERIES_START ? 9 : 12)) return false; }
    return date.snapTime(c.lastIdx) === s[s.length - 1].t;
  }, c => c.id));

  /* ---------- série diária ---------- */
  test('Série: 1 ponto/dia às 12:00 de max(03/10, publicação) ao último ponto do canal, sem decrescer', () => all(O.videos.filter(v => v.series.length), v => {
    const ch = O.channel(v.ch); const p = v.series;
    if (p[0].idx !== Math.max(0, date.snapIdxAtOrAfter(v.pub)) || p[p.length - 1].idx !== ch.lastIdx) return false;
    return p.every((x, i) => date.hm(x.t) === '12:00' && (i === 0 || (x.idx === p[i - 1].idx + 1 && x.views >= p[i - 1].views)));
  }));

  /* ---------- trocas: precisão ---------- */
  test('Precisão: thumbnail com minuto; título/descrição desde 03/10 em janela de 6 h terminando em 00/06/12/18; antes de 03/10 janela de 1 dia às 09:00', () => all(O.changes, c => {
    if (c.type === 'thumb') return c.prec === 'min' && !c.window;
    const [a, b] = c.window; const hb = date.parts(b).h;
    if (c.preSeries) return c.prec === '1d' && b - a === DAY && hb === 9;
    return c.prec === '6h' && b - a === 6 * H && [0, 6, 12, 18].includes(hb) && date.parts(b).mi === 0;
  }));
  test('Nenhuma troca de thumbnail antes de 03/10', () => all(O.changes.filter(c => c.type === 'thumb'), c => c.at >= O.SERIES_START));
  test('Descrições pré-03/10: só "mudou", sem texto e sem comparação linha a linha', () => {
    const pre = O.changes.filter(c => c.type === 'desc' && c.preSeries);
    const vers = O.videos.flatMap(v => v.descs.filter(d => !d.current && d.last_seen < O.SERIES_START));
    return { ok: pre.length > 0 && pre.every(c => c.hasText === false && c.diff == null) && vers.every(d => d.lines == null && d.hasText === false), detail: pre.length + ' trocas, ' + vers.length + ' versões antigas sem texto' };
  });
  test('Trocas antes de 03/10 → "Sem série antes da troca (coleta por vídeo desde 03/10)"', () => all(O.changes.filter(c => c.preSeries), c => O.effect(c.id).status === 'sem-serie' && /coleta por vídeo desde 03\/10/.test(O.effect(c.id).reason)));

  /* ---------- efeito ---------- */
  test('Efeito: "antes" ≤ 2 dias → inconclusivo (depois de 7 dias)', () => all(O.changes.map(c => O.effect(c.id)).filter(e => e.beforeDays != null && e.beforeDays > 0 && e.beforeDays <= 2 && e.afterDays >= 7), e => e.status === 'inconclusivo', e => e.id));
  test('Efeito: menos de 7 dias depois → aguardando "N de 7" com data, sem números', () => all(O.changes.map(c => O.effect(c.id)).filter(e => e.afterDays != null && e.afterDays < 7 && e.beforeDays > 0), e => e.status === 'aguardando' && e.observed == null && e.expected == null && new RegExp(e.afterDays + ' de 7 dias coletados, leitura em \\d\\d/\\d\\d').test(e.reason), e => e.id + ' ' + e.status));
  test('Efeito: ganhou/perdeu só com |efeito| > 10 pp e fora da faixa; veredito medido exige n ≥ 5 e antes ≥ 3 d', () => all(O.changes.map(c => O.effect(c.id)).filter(e => ['ganhou', 'perdeu', 'neutro'].includes(e.status)), e => {
    if (e.n < 5 || e.beforeDays < 3 || e.afterDays < 7) return false;
    const out = e.observed < e.iqr[0] || e.observed > e.iqr[1];
    if (e.status === 'ganhou') return e.effectPp > 10 && out; if (e.status === 'perdeu') return e.effectPp < -10 && out;
    return !(Math.abs(e.effectPp) > 10 && out) && /^Efeito [+−±]?\d+ pp: /.test(e.reason);
  }, e => e.id));
  test('Efeito: campos diferentes na mesma janela ou a < 48 h → inconclusivo (ou aguardando com aviso)', () => all(O.changes.filter(c => c.sameWindow.length || c.within48h.length).map(c => O.effect(c.id)), e => e.status === 'inconclusivo' || (e.status === 'aguardando' && !!e.willBeInconclusive) || e.status === 'sem-serie', e => e.id + ' ' + e.status));
  test('Efeito: há exemplos de ganhou, perdeu, neutro, inconclusivo, aguardando, sem série e sem base', () => {
    const st = new Set(O.changes.map(c => O.effect(c.id).status));
    const want = ['ganhou', 'perdeu', 'neutro', 'inconclusivo', 'aguardando', 'sem-serie', 'sem-antes'];
    return { ok: want.every(w => st.has(w)), detail: [...st].join(', ') };
  });

  /* ---------- exemplos do BRIEF ---------- */
  const brief = [
    ['matt-fast-cheap', 'This AI Model Is INSANELY Fast & Cheap', '1,5 mil', 'matt-fast-cheap/title/1', 'dev - The New AI model that has people talking', 'há 6 h'],
    ['sabrina-1m', 'I Forced Myself to Build $1M Business with AI', '19,8 mil', 'sabrina-1m/title/1', 'How I Built a $1M Solo AI Business ($0 to $1M)', 'há 4 dias'],
    ['matt-opus55', "Claude Opus 5.5 Didn't Need to Go This Hard", '207,6 mil', 'matt-opus55/title/2', 'Opus 5.5 Is Crazy Good and GPT-6 Sol Launched Too', 'há 6 dias'],
    ['nate-claude-code-danger', 'No, Seriously. Claude Code is Starting To Get Dangerous', '58 mil', 'nate-claude-code-danger/desc/1', null, 'há 3 dias'],
  ];
  brief.forEach(([id, title, views, cid, before, ago]) => test('BRIEF: ' + title + ' (' + views + ', troca ' + ago + ')', () => {
    const v = V(id), c = C(cid);
    const ok = v && v.title === title && fmt.num(v.views) === views && c && c.agoMidText === ago && c.agoText === (c.window ? 'vista pela 1ª vez ' : '') + date.ago(c.at) && (before == null || (c.before === before && c.after === title)) && (before != null || c.type === 'desc');
    return { ok, detail: v ? v.title + ' · ' + fmt.num(v.views) + ' · ' + (c ? c.type + ' ' + c.agoText : 'sem troca') : 'vídeo ausente' };
  }));
  const briefOut = [['luke-kfc', "Trying a $2.70 Pakistan's version of KFC", '1,9 mi', 21, 'short'], ['dale-ninja-dojo', 'Ninja Training Dojo in Arima Onsen, Japan', '7,4 mi', 298, 'long'],
    ['preguica-hailuo', 'Como criar vídeos cinematográficos e virais com o Hailuo', '382 mil', 154, 'long'], ['matt-gpt6-astra', 'GPT-6 Astra Is Finally Here', '500 mil', 28, 'long']];
  briefOut.forEach(([id, title, views, age, f]) => test('BRIEF outlier: ' + title + ' (' + views + ', ' + age + ' d, ' + f + ')', () => {
    const v = V(id); const inList = O.outliers({ fmt: f, ages: 'all' }).items.some(x => x.id === id);
    return { ok: v.title === title && fmt.num(v.views) === views && v.ageDays === age && v.fmt === f && inList, detail: fmt.num(v.views) + ' · ' + v.ageDays + ' d · ' + v.mult.label };
  }));
  test('Outlier KFC (Short publicado em 03/10) cai para "aproximação por faixa" com o aviso de fallback', () => { const m = V('luke-kfc').mult; return { ok: m.method === 'aproximação por faixa' && m.fallback && /menos de 3 vídeos do canal com série desde o dia 0/.test(m.fallbackText), detail: m.label }; });

  /* ---------- vídeo-vitrine ---------- */
  test('Vitrine (matt-opus55): publicado depois de 03/10, thumbnail A → B → A em ≤ 14 d (compatível com Testar e comparar)', () => {
    const v = V('matt-opus55'); const keys = v.thumbs.map(t => t.key).join('');
    const ba = C('matt-opus55/thumb/2');
    return { ok: v.pub >= O.SERIES_START && keys === 'ABAC' && ba.revertTo === 'A' && ba.testCompare === true && ba.cycleMs <= 14 * DAY && C('matt-opus55/thumb/1').testCompare === true, detail: keys + ' · B no ar ' + date.dur(ba.cycleMs) };
  });
  test('Vitrine: troca de título MEDIDA (≥ 7 d depois, antes ≥ 3 d) e outra aguardando', () => {
    const e1 = O.effect('matt-opus55/title/1'), e2 = O.effect('matt-opus55/title/2');
    return { ok: ['ganhou', 'perdeu', 'neutro'].includes(e1.status) && e1.afterDays === 7 && e1.beforeDays >= 3 && e2.status === 'aguardando' && !!e2.willBeInconclusive, detail: e1.status + ' (' + e1.numbers + ', antes ' + e1.beforeDays + ' d) · ' + e2.reason };
  });
  test('Vitrine: descrição com comparação linha a linha +4 −3 linhas + 1 UTM', () => { const d = C('matt-opus55/desc/1').diff; return { ok: d.add === 4 && d.rem === 3 && d.utm === 1 && d.label === '+4 −3 linhas + 1 UTM', detail: d.label }; });

  test('[F10] effect.waitText: "Aguardando: N de 7 dias coletados, leitura no domingo, 25/10." (+ "Vai sair inconclusivo: …" quando for o caso)', () => all(O.changes.map(c => O.effect(c.id)).filter(e => e.status === 'aguardando'), e => e.waitText === 'Aguardando: ' + e.collected + ' de 7 dias coletados, ' + e.readyText + '.' + (e.willBeInconclusive ? ' Vai sair inconclusivo: ' + e.willBeInconclusiveShort + '.' : '') && (e.waitText.match(/: /g) || []).length <= 2, e => e.id + ': ' + e.waitText) && O.effect('matt-opus55/title/2').waitText === 'Aguardando: 6 de 7 dias coletados, leitura no domingo, 25/10. Vai sair inconclusivo: dois campos do vídeo mudaram na mesma janela de sincronização.');
  test('[F10] Fila única entre tipos (uma máquina): ativos ordenados por createdAt/seq; "atrás do pedido de padrões de título de IA"; queuePos/firstInQueue', () => {
    const S = O.forja.session, bad = [];
    try {
      S.reset(); S.ask('ia'); S.ask(null, { type: 'leitura-video', video: 'luke-kfc' }); S.ask('viagem', { type: 'temas' });
      const a = S.current('ia'), v = S.current(null, { type: 'leitura-video', video: 'luke-kfc' }), t = S.current('viagem', { type: 'temas' });
      if (!a.request.firstInQueue || a.request.queuePos !== 1 || /atrás/.test(a.statusLabel)) bad.push('1º da fila: ' + a.statusLabel);
      if (v.statusLabel !== 'na fila · pedido 15:02 (atrás do pedido de padrões de título de IA)' || v.request.queuePos !== 2) bad.push('vídeo: ' + v.statusLabel);
      if (t.statusLabel !== 'na fila · pedido 15:02 (atrás do pedido de leitura de vídeo de Viagem)' || t.request.queuePos !== 3) bad.push('temas: ' + t.statusLabel);
      S.setBase('trabalhando'); S.ask(null, { type: 'leitura-video', video: 'luke-kfc' });
      const w = S.current(null, { type: 'leitura-video', video: 'luke-kfc' });
      if (!/atrás do pedido de padrões de título de Viagem\)$/.test(w.statusLabel) || S.current('todos').statusLines[1] !== 'Viagem: na fila · pedido 14:41 (atrás do de IA)') bad.push('base trabalhando: ' + w.statusLabel);
      const c = O.forja.compose({ requests: [Object.assign({}, O.forja.requestScenario('na fila').request, { type: 'temas' })], machine: O.forja.requestScenario('na fila').machine }, { niche: 'viagem', type: 'padroes-titulo' });
      if (!/atrás do pedido de temas de IA/.test(c.statusLines ? c.statusLines.join() : c.statusLabel + ' ' + c.requests.map(q => q.statusLabel).join())) bad.push('compose: ' + c.requests.map(q => q.statusLabel).join(' / '));
    } finally { S.reset(); }
    return { ok: !bad.length, detail: bad.join(' | ') || 'ok' };
  });
  test('[F11] heatmap: cells[d][b].dominantChannel = {id, name, share} quando um canal tem ≥ 80% da célula; senão null', () => all(['todos', 'viagem', 'ia'].flatMap(n => O.heatmap(n, 'long').cells.flat()), c => { if (!c.n) return c.dominantChannel === null;
    const by = {}; c.ids.forEach(id => { by[V(id).ch] = (by[V(id).ch] || 0) + 1; }); const [top, k] = Object.entries(by).sort((a, b) => b[1] - a[1])[0];
    return k / c.n >= 0.8 ? (c.dominantChannel && c.dominantChannel.id === top && c.dominantChannel.name === O.channel(top).name && Math.abs(c.dominantChannel.share - k / c.n) < 1e-12) : c.dominantChannel === null; }));
  test('[F11] session.current(nicho) em falhou/recusado leva o motivo completo do próprio pedido', () => {
    const S = O.forja.session; let v, r;
    try { S.setBase('falhou'); v = S.current('viagem'); S.setBase('recusado (dado velho)'); S.ask('ia'); S.reset(); S.setBase('falhou'); } finally { }
    const ok = v.statusText === 'O pedido de Viagem falhou às 14:51. O validador recusou a saída da forja nas 3 tentativas. Falha não conta na cota.' && /falhou às 14:51/.test(v.statusLabel) && S.current('ia').statusText === O.forja.requestScenario('falhou').statusText;
    S.reset(); return { ok, detail: v.statusText };
  });
  /* ---------- saída ---------- */
  const pass = R.filter(r => r.ok).length, fail = R.length - pass;
  root.__OBS_TEST = { pass, fail, results: R };
  if (typeof document !== 'undefined' && document.getElementById('rows')) {
    const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
    document.getElementById('rows').innerHTML = R.map(r => '<tr><td class="r ' + (r.ok ? 'PASS' : 'FAIL') + '">' + (r.ok ? 'PASS' : 'FAIL') + '</td><td>' + esc(r.name) + '</td><td class="d">' + esc(r.detail) + '</td></tr>').join('');
    const s = document.getElementById('summary'); s.textContent = (fail ? 'FAIL' : 'PASS') + ' — ' + pass + ' de ' + R.length + ' asserções passaram'; s.className = fail ? 'fail' : 'pass';
  }
  R.forEach(r => (r.ok ? console.log : console.error)((r.ok ? 'PASS ' : 'FAIL ') + r.name + (r.detail ? ' — ' + r.detail : '')));
  console.log((fail ? 'FAIL' : 'PASS') + ': ' + pass + '/' + R.length);
})(typeof window !== 'undefined' ? window : globalThis);
