<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waitlist — superfícies públicas — bythiagofigueiredo</title>
<meta name="description" content="Lista de espera: landing pública, bloco incorporável e nó inline no blog. Opt-in único, email + consentimento.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..600;1,8..60,400&family=Caveat:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    background: #14110B;
  }
  ::selection { background: #FF8240; color: #1A140C; }
  a { -webkit-tap-highlight-color: transparent; }
  input, button { font: inherit; }

  .top-strip {
    position: fixed; top: 0; left: 0; right: 0; z-index: 999; height: 44px;
    background: rgba(20,18,16,0.94);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px; border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .top-strip .url-pill {
    color: rgba(255,255,255,0.55);
    font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.04em;
    display: flex; align-items: center; gap: 8px;
  }
  .top-strip .url-pill .scheme { opacity: 0.45; }
  .top-strip .url-pill .slug { color: #FF8240; }
  .lang-pill {
    color: #F2EBDB; padding: 3px; border-radius: 999px; display: flex;
    font-family: 'JetBrains Mono', monospace; font-size: 11px; background: rgba(255,255,255,0.06);
  }
  .lang-pill button {
    background: transparent; color: inherit; border: none;
    padding: 5px 12px; border-radius: 999px; cursor: pointer;
    font: inherit; letter-spacing: 0.1em; text-transform: uppercase;
  }
  .lang-pill button.active { background: #F2EBDB; color: #141210; }

  .tweaks-panel {
    position: fixed; bottom: 20px; right: 20px; z-index: 998;
    background: rgba(20,18,16,0.94); color: #F2EBDB;
    backdrop-filter: blur(12px); border-radius: 14px; padding: 16px 18px; min-width: 260px;
    font-family: 'Inter', sans-serif; font-size: 13px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3); display: none;
  }
  .tweaks-panel.visible { display: block; }
  .tweaks-panel .tweaks-title { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.6; margin-bottom: 14px; }
  .tweaks-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; gap: 12px; }
  .tweaks-row + .tweaks-row { border-top: 1px solid rgba(255,255,255,0.08); }
  .tweak-seg { display: inline-flex; background: rgba(255,255,255,0.08); border-radius: 999px; padding: 2px; gap: 2px; }
  .tweak-seg button { background: transparent; color: inherit; border: none; padding: 5px 12px; border-radius: 999px; cursor: pointer; font-family: inherit; font-size: 11px; }
  .tweak-seg button.active { background: #F2EBDB; color: #141210; }

  #root { min-height: 100vh; padding-top: 44px; }

  @media (max-width: 980px) {
    [style*="grid-template-columns: 1.35fr 1fr"],
    [style*="grid-template-columns: 1.5fr 1fr"] { grid-template-columns: 1fr !important; }
    [style*="position: sticky"] { position: static !important; }
    h1[style*="font-size: 68px"] { font-size: 46px !important; }
  }
  @media (max-width: 600px) {
    .top-strip .url-pill .scheme { display: none; }
  }
</style>
</head>
<body>

<div class="top-strip">
  <div class="url-pill">
    <span class="scheme">bythiagofigueiredo.com/waitlists/</span>
    <span class="slug" id="url-slug">nomade-dev-turma-1</span>
  </div>
  <div class="lang-pill">
    <button data-lang="pt" class="active">PT</button>
    <button data-lang="en">EN</button>
  </div>
</div>

<div class="tweaks-panel" id="tweaks">
  <div class="tweaks-title">Tweaks</div>
  <div class="tweaks-row">
    <span class="label">Theme</span>
    <div class="tweak-seg" data-tweak="theme">
      <button data-value="light">Light</button>
      <button data-value="dark" class="active">Dark</button>
    </div>
  </div>
  <div class="tweaks-row">
    <span class="label">Language</span>
    <div class="tweak-seg" data-tweak="lang">
      <button data-value="pt" class="active">PT</button>
      <button data-value="en">EN</button>
    </div>
  </div>
</div>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="content.js?v=6"></script>
<script src="waitlist-content.js"></script>
<script type="text/babel" src="shared.jsx"></script>
<script type="text/babel" src="waitlist-public.jsx"></script>
<script type="text/babel" src="waitlist-surfaces.jsx"></script>

<script>
  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "lang": "en",
    "theme": "dark"
  }/*EDITMODE-END*/;
</script>

<script type="text/babel">
  function loadState() {
    try {
      const saved = JSON.parse(localStorage.getItem("btf_wlpub") || "{}");
      return { ...TWEAK_DEFAULTS, ...saved };
    } catch { return { ...TWEAK_DEFAULTS }; }
  }
  function saveState(s) { try { localStorage.setItem("btf_wlpub", JSON.stringify(s)); } catch {} }

  const App = () => {
    const [state, setState] = React.useState(loadState);
    const update = React.useCallback((patch) => {
      setState(prev => { const next = { ...prev, ...patch }; saveState(next); return next; });
    }, []);

    const dark = state.theme === "dark";
    const product = window.WL_PUB.product;
    const accent = dark ? product.accentDark : product.accent;
    const customAccent = dark ? window.WL_PUB.customAccentDark : window.WL_PUB.customAccent;
    const slug = product["slug_" + state.lang];

    React.useEffect(() => {
      document.documentElement.lang = state.lang === "pt" ? "pt-BR" : "en";
      const slugEl = document.getElementById("url-slug");
      if (slugEl) { slugEl.textContent = slug; slugEl.style.color = accent; }
      document.querySelectorAll(".lang-pill button").forEach(b => b.classList.toggle("active", b.dataset.lang === state.lang));
      document.querySelectorAll(".tweak-seg").forEach(seg => {
        const key = seg.dataset.tweak;
        seg.querySelectorAll("button").forEach(b => b.classList.toggle("active", b.dataset.value === String(state[key])));
      });
      document.body.style.background = dark ? "#14110B" : "#E9E1CE";
      document.title = `${product["name_" + state.lang]} — waitlist — bythiagofigueiredo`;
    }, [state, slug, accent, dark, product]);

    React.useEffect(() => {
      const onLang = (e) => { const b = e.target.closest(".lang-pill button[data-lang]"); if (b) update({ lang: b.dataset.lang }); };
      const onTweak = (e) => { const b = e.target.closest(".tweak-seg button[data-value]"); if (!b) return; update({ [b.closest(".tweak-seg").dataset.tweak]: b.dataset.value }); };
      document.addEventListener("click", onLang);
      document.addEventListener("click", onTweak);
      return () => { document.removeEventListener("click", onLang); document.removeEventListener("click", onTweak); };
    }, [update]);

    React.useEffect(() => {
      const panel = document.getElementById("tweaks");
      const onMsg = (e) => {
        const d = e.data || {};
        if (d.type === "__activate_edit_mode") panel.classList.add("visible");
        else if (d.type === "__deactivate_edit_mode") panel.classList.remove("visible");
      };
      window.addEventListener("message", onMsg);
      try { window.parent.postMessage({ type: "__edit_mode_available" }, "*"); } catch {}
      return () => window.removeEventListener("message", onMsg);
    }, []);

    React.useEffect(() => {
      try { window.parent.postMessage({ type: "__edit_mode_set_keys", edits: { lang: state.lang, theme: state.theme } }, "*"); } catch {}
    }, [state.lang, state.theme]);

    window._lang = state.lang;
    return <window.WaitlistPublic L={state.lang} dark={dark} accent={accent} customAccent={customAccent} />;
  };

  ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

</body>
</html>
